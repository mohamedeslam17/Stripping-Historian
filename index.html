<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stripping Historian — Process Engineering Log</title>
<style>
  *{box-sizing:border-box}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  /* #app and .sync-pill both carry a display rule that would otherwise beat the
     UA's [hidden] — the hosted shell and the sync chip rely on the attribute */
  [hidden]{display:none!important}
  :root{
    --ink:#1b1e1c; --muted:#5b615c; --faint:#646a64; --line:#c3c8bf; --line-2:#e0e3dc;
    --bg:#e9ebe6; --panel:#ffffff; --elev:#f2f3ef;
    --chrome:#24282a; --chrome-ink:#dde1dd; --chrome-dim:#98a09a;
    --brand:#24282a; --brand-ink:#dde1dd;
    --accent:#1b4d7e; --accent-2:#143b61; --accent-weak:#e4ebf3; --accent-ink:#164066; --on-accent:#ffffff;
    --green:#1c6337; --green-bg:#e1eee5; --amber:#8a5a00; --amber-bg:#f7ecd3;
    --red:#9c2019; --red-bg:#f6e2e0; --blue:#1b4d7e; --blue-bg:#e4ebf3; --grey-bg:#e6e9e3;
    --violet:#54407c; --violet-bg:#e9e6f1;
    --focus:#1b4d7e; --r:2px; --r-s:2px; --r-xs:2px;
    --ui:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sh-sm:none; --sh:none; --sh-lg:0 0 0 1px rgba(0,0,0,.22),0 16px 44px rgba(0,0,0,.3);
  }
  html,body{height:100%}
  body{margin:0;font-family:var(--ui);color:var(--ink);background:var(--bg);font-size:13px;line-height:1.45;color-scheme:light;font-variant-numeric:tabular-nums}

  /* ---- application chrome: title strip over a tab rail ------------------ */
  #app{display:flex;flex-direction:column;min-height:100vh}
  #chrome{position:sticky;top:0;z-index:20;background:var(--panel)}
  #idbar{display:flex;align-items:center;height:30px;padding-left:11px;background:var(--chrome);color:var(--chrome-ink)}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden}
  .brand b{font-size:11.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand small{font-size:11px;color:var(--chrome-dim);font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .idbar-sp{flex:1;min-width:8px}
  .tools{display:flex;align-self:stretch}
  .tools button{padding:0 11px;background:none;border:none;border-left:1px solid rgba(255,255,255,.14);color:var(--chrome-ink);font:inherit;font-size:11.5px;cursor:pointer;white-space:nowrap}
  .tools button:hover{background:rgba(255,255,255,.11);color:#fff}
  .tools button:disabled{color:#697069;cursor:not-allowed;background:none}

  #topbar{display:flex;align-items:stretch;min-height:36px;background:var(--elev);border-bottom:1px solid var(--line)}
  #nav{display:flex;align-items:stretch;overflow:auto;scrollbar-width:none}
  #nav::-webkit-scrollbar{display:none}
  .navlink{display:flex;align-items:center;gap:7px;padding:0 15px;border:none;border-right:1px solid var(--line);background:none;color:var(--muted);font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .navlink:hover{background:#e5e8e1;color:var(--ink)}
  .navlink.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 2px 0 var(--accent);margin-bottom:-1px}
  .navlink .badge{min-width:16px;padding:0 4px;text-align:center;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;font-family:var(--mono);line-height:15px;border-radius:1px}
  .navlink .badge.info{background:var(--accent)}
  .search{margin-left:auto;display:flex;align-items:center;padding:0 8px}
  .search input{width:238px;height:24px;min-height:24px;padding:2px 7px;border:1px solid var(--line);border-radius:1px;background:var(--panel);font-size:12px;font-family:var(--mono)}
  .side-log{align-self:stretch;display:flex;align-items:center;gap:8px;padding:0 15px;background:var(--accent);color:#fff;border:none;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
  .side-log:hover{background:var(--accent-2)}
  .kbd{display:inline-block;border:1px solid var(--line);border-radius:1px;padding:0 4px;font-size:10px;line-height:15px;font-family:var(--mono);color:var(--muted);background:var(--elev)}
  .side-log .kbd{border-color:currentColor;color:inherit;background:none;opacity:.72}
  .iconbtn{align-self:center;width:24px;height:24px;margin:0 8px;border:1px solid var(--line);border-radius:1px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;flex:none;line-height:1}
  .iconbtn:hover{background:var(--elev);color:var(--ink)}
  .sync-pill{align-self:center;display:inline-flex;align-items:center;height:21px;padding:0 7px;border:1px solid transparent;border-radius:1px;font-size:11px;font-weight:600;font-family:var(--mono);white-space:nowrap;margin-left:8px}
  .sync-idle{background:var(--green-bg);color:var(--green);border-color:#b7d3c1}
  .sync-syncing{background:var(--blue-bg);color:var(--blue);border-color:#b6c8da}
  .sync-offline{background:var(--amber-bg);color:var(--amber);border-color:#dcc38b}
  .sync-error{background:var(--red-bg);color:var(--red);border-color:#d9aca7}
  #main{padding:14px 16px 40px;flex:1;min-width:0;width:100%}

  /* ---- sign-in ---------------------------------------------------------- */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);font-family:inherit}
  .login-card{max-width:352px;width:100%;background:var(--panel);border:1px solid #8f968e}
  .login-head{margin:0;background:var(--chrome);color:#fff;padding:7px 13px;font-size:11.5px;font-weight:600;letter-spacing:1.1px;text-transform:uppercase}
  .login-body{padding:16px 15px 15px}
  .login-sub{color:var(--muted);font-size:12px;margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--line-2)}
  .login-error{color:var(--red);font-size:12px;min-height:19px;margin:6px 0}
  .login-submit{width:100%;min-height:32px;font-size:13px}
  .login-footnote{margin-top:14px;padding-top:11px;border-top:1px solid var(--line-2);color:var(--faint);font-size:11px;font-family:var(--mono)}

  /* ---- shared furniture -------------------------------------------------- */
  .attn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--red-bg);color:var(--red);border:1px solid #d9aca7;border-left:3px solid var(--red);padding:6px 11px;margin-bottom:12px;font-size:12.5px}
  .attn b{font-weight:700;font-family:var(--mono)} .attn .sp{flex:1}

  h2.sec{font-size:13px;margin:0 0 12px;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line-2)}
  h3.sub{display:flex;align-items:center;gap:10px;font-size:12px;margin:18px 0 8px;color:var(--ink);font-weight:700;text-transform:none;letter-spacing:0}
  h3.sub::after{content:"";flex:1;height:1px;background:var(--line)}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);padding:13px}
  .linkish{color:var(--accent-ink);cursor:pointer;font-weight:600;font-family:var(--mono);text-decoration:underline;text-decoration-color:#aabbcb;text-underline-offset:2px}
  .linkish:hover{text-decoration-color:currentColor}
  .mono{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .empty{min-height:170px;text-align:center;color:var(--muted);padding:36px 20px;background:var(--elev);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .empty.compact{min-height:110px;padding:26px 20px} .flagok{color:var(--green)}
  .filterbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;background:var(--elev);border:1px solid var(--line);padding:6px 8px;margin-bottom:8px}
  .filterbar select,.filterbar input{min-height:26px;background:var(--panel)}
  .filterbar select{width:auto;min-width:126px}.filterbar input{width:220px;flex:0 1 260px}
  .filterbar .filter-count{margin-left:auto;padding:0 4px;color:var(--muted);font-size:11.5px;font-family:var(--mono);white-space:nowrap}
  .settings-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,.85fr);gap:12px;align-items:start}
  .settings-stack{display:grid;gap:12px}
  .settings-grid .card{margin:0;max-width:none}
  .setting-note{font-size:11.5px;color:var(--muted);padding-top:2px}
  .danger-zone{border-color:#cfa8a3;background:#fdf7f6}
  .danger-zone h2.sec{color:#7a1c16;border-bottom-color:#e6c8c4}

  /* ---- controls ---------------------------------------------------------- */
  .btn{min-height:28px;background:var(--panel);border:1px solid #b4b9b1;color:var(--ink);padding:4px 11px;border-radius:2px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
  .btn:hover{background:var(--elev);border-color:#979e95}
  .btn:active{background:#e6e9e3}
  .btn.primary{background:var(--accent);border-color:var(--accent-2);color:var(--on-accent)}
  .btn.primary:hover{background:var(--accent-2)}
  .btn.sm{min-height:24px;padding:2px 8px;font-size:12px}
  .btn.danger{color:var(--red);border-color:#cba7a2;background:var(--panel)}
  .btn.danger:hover{background:var(--red-bg)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btnrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}

  label.f{display:block;font-size:12px;color:#454b46;margin:0 0 4px;font-weight:600}
  input,select,textarea{width:100%;min-height:30px;padding:5px 8px;border:1px solid #b4b9b1;border-radius:2px;font-size:13px;font-family:inherit;background:var(--panel);color:var(--ink)}
  input[type=number],input[type=date],input[type=datetime-local],input[type=search],input[type=password]{font-family:var(--mono);font-size:12.5px}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  input:disabled,select:disabled,textarea:disabled{background:var(--elev);color:#7b817b;cursor:not-allowed}
  input.bad{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  ::placeholder{color:var(--faint)}
  .field{margin-bottom:11px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:11px}

  /* ---- tables: a ledger, so rule every cell and stripe every other row --- */
  .tbl-wrap{overflow:auto;border:1px solid var(--line);max-height:70vh;background:var(--panel)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:5px 9px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2);border-right:1px solid var(--line-2)}
  th:last-child,td:last-child{border-right:none}
  /* identifiers and timestamps live in the first two columns of every table —
     set them in the mono face so serials and times line up down the page */
  td:first-child,td:first-child + td{font-family:var(--mono);font-size:12px}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  td.overlimit{color:var(--red);font-weight:700}
  .limit-mark{display:inline-block;margin-left:5px;padding:0 4px;border:1px solid currentColor;border-radius:1px;font-family:var(--ui);font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;vertical-align:1px}
  thead th{background:#dcdfd8;font-weight:700;color:#3b413c;position:sticky;top:0;font-size:11.5px;border-bottom:1px solid #a9afa6;white-space:nowrap;vertical-align:bottom}
  thead th.sortable{cursor:pointer;user-select:none} thead th.sortable:hover{color:var(--ink);background:#d2d6cd}
  thead th.sortable.sorted{color:var(--ink)} .sort-ind{font-size:9px;color:var(--accent);letter-spacing:0}
  tbody tr:nth-child(even) td{background:#f7f8f4}
  tbody tr:hover td{background:var(--accent-weak)}
  tbody tr:last-child td{border-bottom:none}

  /* ---- status marks: squared flags, never bubbles ------------------------ */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:0 6px;border:1px solid;border-radius:1px;font-family:var(--ui);font-size:11px;font-weight:650;line-height:17px;white-space:nowrap}
  .pill::before{display:none}
  .p-green{background:var(--green-bg);color:var(--green);border-color:#b7d3c1}
  .p-amber{background:var(--amber-bg);color:var(--amber);border-color:#dcc38b}
  .p-red{background:var(--red-bg);color:var(--red);border-color:#d9aca7}
  .p-grey{background:var(--grey-bg);color:#575d58;border-color:#c3c8bf}
  .p-blue{background:var(--blue-bg);color:var(--blue);border-color:#b6c8da}
  .p-violet,.p-purple{background:var(--violet-bg);color:var(--violet);border-color:#c5bcd9}
  .tag{display:inline-flex;align-items:center;gap:6px;background:var(--elev);border:1px solid var(--line);border-radius:1px;padding:1px 6px;font-size:11.5px;font-family:var(--mono);margin:2px 4px 0 0}
  .tag.flagbad{background:var(--red-bg);border-color:#d9aca7;color:var(--red)}

  /* ---- readout strip (replaces the stat-tile grid) ----------------------- */
  .kpis{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-right:0;background:var(--panel);margin:0 0 14px}
  .kpi{flex:1 1 112px;min-width:0;display:flex;flex-direction:column-reverse;justify-content:flex-end;padding:7px 11px;border:0;border-right:1px solid var(--line-2);background:var(--panel);border-radius:0}
  .kpi .v{font-family:var(--mono);font-size:19px;font-weight:600;letter-spacing:-.4px;line-height:1.25}
  .kpi .l{font-size:11px;color:var(--muted);margin:0 0 1px;font-weight:600;text-transform:none;letter-spacing:0}
  .kpi.warn{box-shadow:inset 3px 0 0 var(--red)} .kpi.warn .v{color:var(--red)} .kpi.good .v{color:var(--green)}

  /* ---- baths ------------------------------------------------------------- */
  .kv{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
  .kv span:first-child{color:var(--muted)} .kv span:last-child{font-family:var(--mono)}
  .dot{width:8px;height:8px;border-radius:0;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.22)}
  .dot.g{background:var(--green)} .dot.r{background:var(--red)} .dot.a{background:var(--amber)} .dot.x{background:#b3b8b1}
  .partline{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
  .partline:last-child{border-bottom:none} .partline .s{font-weight:600;font-family:var(--mono)} .partline .t{margin-left:auto;color:var(--muted);font-size:12px;font-family:var(--mono)}
  .tankgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:10px;margin-bottom:16px}
  .tankcard{background:var(--panel);border:1px solid var(--line);padding:0;cursor:pointer;display:flex;flex-direction:column}
  .tankcard:hover{border-color:#8b928a}
  .tank-h{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--elev);border-bottom:1px solid var(--line)}
  .tank-h b{font-size:13px;font-family:var(--mono);letter-spacing:0}
  .tank-meta{font-size:11.5px;color:var(--muted);padding:4px 10px;font-family:var(--mono);border-bottom:1px solid var(--line-2);min-height:22px}
  .tank{position:relative;flex:1;border:0;border-radius:0;min-height:68px;background:#edf0ec;padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px;align-content:flex-start;box-shadow:inset 0 1px 0 rgba(0,0,0,.05)}
  .tank.spent{background:#f5e5e3}
  /* hatched = out of service, the way it is marked up on a drawing */
  .tank.off{min-height:52px;background:repeating-linear-gradient(45deg,#e8ebe5,#e8ebe5 5px,#dfe2db 5px,#dfe2db 10px)}
  .tank-part{background:var(--panel);border:1px solid #b4bcb2;border-radius:1px;padding:0 5px;font-size:11px;line-height:17px;font-family:var(--mono);font-weight:600;color:var(--ink);height:fit-content}
  .tank-part.hot{background:var(--red-bg);border-color:#d9aca7;color:var(--red)}
  .tank-empty{color:#767d76;font-size:11.5px;margin:auto;font-family:var(--mono)}
  .tankcard > .warn-line{margin:0;border-left-width:3px;padding:4px 10px}
  .tank-acts{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:auto;padding:0;border-top:1px solid var(--line)}
  .tank-acts > :only-child{grid-column:1 / -1}
  .tank-acts .btn{border:0;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);border-radius:0;min-height:29px}
  .tank-acts .btn.primary{border-right-color:var(--accent-2)}

  /* ---- serial entry ------------------------------------------------------ */
  .chipbox{display:flex;flex-wrap:wrap;gap:5px;padding:6px;border:1px solid #b4b9b1;border-radius:2px;background:var(--panel);min-height:38px;align-content:flex-start}
  .chipbox.focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .chip{display:inline-flex;align-items:center;gap:5px;background:var(--accent-weak);color:var(--accent-ink);border:1px solid #b6c8da;border-radius:1px;padding:0 2px 0 6px;font-size:12px;line-height:19px;font-weight:600;font-family:var(--mono)}
  .chip i{cursor:pointer;font-style:normal;width:15px;height:15px;border-radius:1px;display:flex;align-items:center;justify-content:center}
  .chip i:hover{background:rgba(0,0,0,.12)}
  .chipbox input{border:none;outline:none;box-shadow:none!important;flex:1;min-width:120px;min-height:20px;padding:2px;background:transparent;color:var(--ink)}
  .idlechip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);color:var(--ink);border:1px solid #b4b9b1;border-radius:1px;padding:1px 7px;font-size:12px;font-family:var(--mono);font-weight:600;cursor:pointer}
  .idlechip:hover{background:var(--accent-weak);border-color:var(--accent)}
  .idlechip-tag{background:var(--violet-bg);color:var(--violet);border-radius:1px;padding:0 4px;font-size:10px}

  .contents{border:1px solid var(--line);margin-top:4px}
  .crow{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:6px 9px;border-bottom:1px solid var(--line-2)}
  .crow:last-child{border-bottom:none} .crow.on{background:var(--accent-weak)}
  .crow input[type=checkbox]{width:16px;height:16px;min-height:16px;accent-color:var(--accent)}
  .seg{display:inline-flex;border:1px solid #b4b9b1;border-radius:2px;overflow:hidden}
  .seg button{border:none;background:var(--panel);padding:3px 10px;font:inherit;font-size:12px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
  .seg.wrap{flex-wrap:wrap}
  .seg.wax button.on,.seg.wax button.on.partial{background:var(--amber);color:#fff}
  .seg.wax button.on.full{background:var(--red);color:#fff}
  .waxchk{display:inline-flex;align-items:center;gap:6px;border:1px solid #b4b9b1;border-radius:2px;padding:3px 8px;font-size:12px;cursor:pointer;background:var(--panel);color:var(--muted);user-select:none}
  .waxchk input{width:13px;height:13px;min-height:13px;margin:0;flex:none;accent-color:var(--red)}
  .waxchk.on{background:var(--red-bg);border-color:#d9aca7;color:var(--red);font-weight:600}
  .waxchk.on-rm{background:var(--violet-bg);border-color:#c5bcd9;color:var(--violet);font-weight:600}
  .waxchk.on-rm input{accent-color:var(--violet)}
  .chk{display:inline-flex;align-items:center;gap:7px;border:1px solid #b4b9b1;border-radius:2px;padding:4px 10px;font-size:12.5px;cursor:pointer;background:var(--panel);color:var(--muted);user-select:none}
  .chk input{width:14px;height:14px;min-height:14px;margin:0;flex:none;accent-color:var(--accent)}
  .chk.on{background:var(--accent-weak);border-color:#b6c8da;color:var(--accent-ink);font-weight:600}

  svg.chart{display:block;max-width:100%}
  .charts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
  .charts3 .ch{border:1px solid var(--line);padding:7px;background:var(--panel)}
  .chttl{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between;font-family:var(--mono)}
  .bar{height:9px;background:var(--line-2);border:1px solid var(--line);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

  /* ---- overlays ---------------------------------------------------------- */
  .scrim{position:fixed;inset:0;background:rgba(18,22,20,.44);z-index:60;opacity:0;animation:fade .1s forwards}
  @keyframes fade{to{opacity:1}}

  /* a11y: a clear, consistent keyboard-focus ring on every custom control (WCAG 2.4.7) */
  .btn:focus-visible,.navlink:focus-visible,.iconbtn:focus-visible,
  .chip i:focus-visible,.typetab:focus-visible,.tankcard:focus-visible,.seg button:focus-visible,

  @media(pointer:coarse){

    .twocol{grid-template-columns:1fr} .charts3{grid-template-columns:1fr} .crow{grid-template-columns:22px 1fr;row-gap:6px}
  }

  /* a phone matches the width query above as well as the coarse-pointer one,
     and it comes later — restate the touch minimum so it is not undercut */
  @media(pointer:coarse) and (max-width:900px){

<body>
<div id="app">
  <header id="chrome">
    <div id="idbar">
      <div class="brand"><b>Stripping Historian</b><small id="brandMode">offline · on this PC</small></div>
      <div class="idbar-sp"></div>
      <div class="tools">
        <button id="exportReport" title="Download a colour-coded HTML report">Report</button>
        <button id="exportJson" title="Download a full JSON backup">Backup</button>
        <button id="importBtn" title="Restore from a backup">Import</button>
        <button id="exportCsv" title="Export the dip log as CSV">CSV</button>
        <button id="signOutBtn" title="Sign out of the shared log" style="display:none">Sign out</button>
      </div>
    </div>
    <div id="topbar">
      <nav id="nav" aria-label="Primary"></nav>
      <div class="search"><input id="globalSearch" type="search" aria-label="Search serials, job cards and notes" placeholder="Search serial, J/C or notes"></div>
      <div id="syncPill" class="sync-pill" role="status" aria-live="polite" hidden></div>
      <button class="side-log" id="logBtn">Log event <span class="kbd">N</span></button>
      <button id="helpBtn" class="iconbtn" title="Keyboard shortcuts (press ?)" aria-label="Keyboard shortcuts">?</button>
    </div>
  </header>
  <main id="main" aria-labelledby="viewHeading"></main>
  <input type="file" id="importFile" accept="application/json" style="display:none">
</div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="printArea"></div>

<script>
"use strict";

/* =========================================================================
   Stripping Historian — a single-file, offline, event-sourced shop log for
   chemical stripping of turbine components.

   Dips are recorded as two separate events so the operator never has to know
   the out-time up front:
     • Load In   — N parts go INTO a bath  (event time = time in)
     • Extraction — SOME parts come OUT     (event time = time out, per-part result)
   The system pairs them per serial, counts cycles, and always knows what is
   still in each bath. Every view is a PURE function of the event stream.
   ========================================================================= */

const DB_NAME = "strip_historian_db", DB_VER = 2;
let db = null, EVENTS = [], CONFIG = {};

/* The app runs in two modes, decided by how it was opened.
 *
 *  - Offline (file://): everything lives in IndexedDB on this PC, exactly as it
 *    always has. No server, no login, no sharing. This is still a supported way
 *    to run it and every domain test exercises this path.
 *  - Shared (http/https): a Cloudflare D1 database behind /api/sync is the
 *    source of truth, so every operator and the dashboard see one log.
 *    IndexedDB stays on as a local mirror plus an outbox, so a dropped network
 *    never blocks anyone standing at a tank.
 */
const ONLINE = typeof location !== "undefined" && /^https?:$/.test(location.protocol);
let ROLE = null;             // "admin" | "operator" | null
let SYNC_STATE = "idle";     // idle | syncing | offline | error
let SYNC_NOTE = "";

// Offline mode has no roles, so the single local user can do everything.
function isAdmin(){ return !ONLINE || ROLE === "admin"; }

const DEFAULT_CONFIG = {
  tempSet: 90, tempTol: 3,
  hclMin: 16, hclMax: 22,
  feMax: 100,
  maxCycles: 3, maxHours: 24,
  maxBathAge: 30,
  bathCapacity: 0,   // 0 = no part limit
  chemEveryDays: 2,  // titration cadence; 0 = never prompt
  maskAreas: ["Cooling holes", "Part body"],
  baths: ["102-103", "106-107", "202-203", "206-207"],   // always shown; edit in Settings
  operators: ["Diang", "JM", "Bernabe", "Maint", "QA"]
};

/* ============================ DOMAIN START ===============================
   Pure functions only. No DOM, no IndexedDB, no module-level mutable state. */

function round(n, p = 1){ const f = Math.pow(10, p); return Math.round((+n) * f) / f; }
function num(v){ return (v === "" || v == null) ? null : (Number.isFinite(+v) ? +v : null); }
function fmtNum(v){ const n = num(v); return n == null ? "" : String(round(n, 2)); }

function byDate(a, b){
  return String(a.datetime || "").localeCompare(String(b.datetime || ""))
      || String(a.eventId || "").localeCompare(String(b.eventId || ""))
      || String(a.uid || "").localeCompare(String(b.uid || ""));
}

function hrsBetween(a, b){ // clock-time difference, tolerant of overnight roll-over
  if(!a || !b) return 0;
  const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1);
  if(d < 0) d += 1440;
  return round(d / 60, 2);
}
function hoursBetweenDT(a, b){ if(!a || !b) return 0; const d = (new Date(b) - new Date(a)) / 3600000; return d > 0 ? d : 0; }
function daysBetween(a, b){ if(!a || !b) return ""; return Math.round((new Date(b) - new Date(a)) / 86400000); }

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(dt){ if(!dt) return ""; const d = dt.slice(0,10).split("-"); return d[2] + " " + MONTHS[(+d[1]) - 1] + " " + d[0].slice(2); }
function fmtDT(dt){ if(!dt) return ""; return fmtDate(dt) + (dt.length > 10 ? " " + dt.slice(11,16) : ""); }

function nextEventId(dateStr, events){
  const ymd = (dateStr || "").slice(0,10).replace(/-/g, "");
  let mx = 0; // max suffix + 1, not count + 1: a same-day delete must never free an id for reuse
  events.forEach(e => { if(e.eventId && e.eventId.indexOf(ymd) === 0){ const n = parseInt(e.eventId.slice(ymd.length + 1), 10); if(Number.isFinite(n) && n > mx) mx = n; } });
  return ymd + "-" + String(mx + 1).padStart(4, "0");
}

// "7261-01..06" / "7261-01..7261-06" expands to a list; commas/spaces/newlines split.
function parseSerials(text){
  if(!text) return [];
  const out = [], add = s => { if(s && !out.includes(s)) out.push(s); };
  String(text).split(/[\s,;]+/).map(t => t.trim().replace(/^["']+|["']+$/g, "")).filter(Boolean).forEach(tok => {
    const parts = tok.split("..");
    if(parts.length === 2){
      const lm = parts[0].match(/^(.*?)(\d+)$/);
      if(lm){
        const prefix = lm[1], width = lm[2].length;
        // right side must be bare digits or carry the SAME prefix — otherwise
        // "7261-01..7300-06" would silently fabricate 7261-xx serials
        const rm = parts[1].match(/^(.*?)(\d+)$/);
        const hi = rm && (rm[1] === "" || rm[1] === prefix) ? rm[2] : null;
        if(hi != null){
          const a = parseInt(lm[2], 10), b = parseInt(hi, 10);
          if(b >= a && b - a < 10000){ for(let n = a; n <= b; n++) add(prefix + String(n).padStart(width, "0")); return; }
        }
      }
    }
    add(tok);
  });
  return out;
}

/* ---- event-type schema ---- */
const F = { // key -> [storedName, label, kind]
  bath:["bath","Bath","baths"], jc:["jc","J/C No.","text"], component:["component","Component","text"],
  serial:["serial","Serial","text"],
  hclPct:["hclPct","Free HCl %","num"], fePpm:["fePpm","Iron Fe (ppm)","num"], temp:["temp","Temp °C","num"],
  hcl:["hclAddedL","HCl added (L)","num"], water:["waterAddedL","Water added (L)","num"], h3po4:["h3po4AddedL","H₃PO₄ added (L)","num"],
  wax:["waxFailure","Wax failure","sel:None,Partial mask loss,Complete mask loss"],
  disp:["status","Disposition","sel:Accepted,Engineering review,Scrap,Return to vendor,Hold"],
  reason:["disposalReason","Disposal reason","sel:Iron limit reached,HCl exhausted,Contamination,Scheduled change,Other"],
  op:["operator","Operator","operator"], notes:["notes","Notes","text"]
};
const TYPES = {
  "Load In":          { desc:"parts INTO a bath (time in)",  custom:"load",    fields:[F.bath,F.jc,F.component,F.op,F.notes] },
  "Extraction":       { desc:"parts OUT of a bath (time out)",custom:"extract", fields:[F.bath,F.op,F.notes] },
  "Transfer":         { desc:"move parts to another bath",   custom:"move",    fields:[F.bath,F.op,F.notes] },
  "Parts Received":   { desc:"add serials to the waiting area (not in a bath)", custom:"received", hidden:true, fields:[F.jc,F.component,F.op,F.notes] },
  "Chemistry Check":  { desc:"titration result",   fields:[F.bath,F.temp,F.hclPct,F.fePpm,F.op,F.notes] },
  "Top-Up":           { desc:"partial top-up — add acid / water / H₃PO₄", fields:[F.bath,F.hcl,F.water,F.h3po4,F.op,F.notes] },
  "Bath Fill":        { desc:"complete fill — new charge",   fields:[F.bath,F.hcl,F.water,F.h3po4,F.op,F.notes] },
  "HCl Top-Up":       { desc:"add acid",            hidden:true, fields:[F.bath,F.hcl,F.op,F.notes] },
  "Water Top-Up":     { desc:"add water",           hidden:true, fields:[F.bath,F.water,F.op,F.notes] },
  "Wax Failure":      { desc:"masking defect (per area)", custom:"waxfail", hidden:true, fields:[F.bath,F.jc,F.serial,F.op,F.notes] },
  "Re-Masking":       { desc:"re-wax failed areas",  custom:"remask",  hidden:true, fields:[F.jc,F.serial,F.op,F.notes] },
  "Engineering Review":{ desc:"disposition a part", fields:[F.jc,F.serial,F.disp,F.op,F.notes] },
  "Bath Disposal":    { desc:"bath taken out",      fields:[F.bath,F.reason,F.op,F.notes] }
};
// Friendly UI labels for the operator-facing actions. The stored event `type`
// stays "Load In" / "Extraction" (the formal ledger); only the display changes.
const TYPE_LABEL = { "Load In":"Add parts", "Extraction":"Remove parts", "Parts Received":"Waiting area" };
const typeLabel = t => TYPE_LABEL[t] || t;
// Sentinel chosen in the Add-parts bath drop-down to park serials in the waiting
// area instead of a bath. Never stored: a save with it becomes a Parts Received.
const WAITING_AREA = "__waiting__";
const TYPE_PILL = {
  "Load In":"p-blue","Extraction":"p-grey","Immersion":"p-grey","Chemistry Check":"p-grey",
  "Bath Fill":"p-green","Bath Disposal":"p-red","Wax Failure":"p-red","Re-Masking":"p-amber",
  "Engineering Review":"p-amber","HCl Top-Up":"p-grey","Water Top-Up":"p-grey",
  "Top-Up":"p-grey","Transfer":"p-blue","Parts Received":"p-purple"
};

// Events that mention a serial (it now lives inside arrays on load/extract events).
function eventsForSerial(events, serial){
  return events.filter(e =>
    e.serial === serial ||
    ((e.type === "Load In" || e.type === "Transfer" || e.type === "Parts Received") && (e.serials || []).includes(serial)) ||
    (e.type === "Extraction" && (e.items || []).some(i => i.serial === serial))
  ).slice().sort(byDate);
}

/* ---- the backbone: pair Load In + Extraction (and legacy Immersion) into
        per-part "dip" records, and report what is still in each bath ---- */
const _immersionsMemo = new WeakMap(); // events array -> { now, val }
function deriveImmersions(events, nowDT){
  // Every derive* helper walks the ledger through here, so a single render can
  // rebuild it dozens of times. Keyed on the events array identity: any write
  // replaces the array, so a stale entry is never reachable.
  const memoHit = _immersionsMemo.get(events);
  if(memoHit && memoHit.now === nowDT) return memoHit.val;
  const seq = events.slice().sort(byDate);
  const records = [];
  const open = new Map();   // serial -> currently-open record
  const cyc = new Map();    // serial -> loads so far
  const bump = s => { const n = (cyc.get(s) || 0) + 1; cyc.set(s, n); return n; };
  for(const e of seq){
    if(e.type === "Load In"){
      (e.serials || []).forEach(s => {
        const rec = { serial:s, bath:e.bath || "", jc:e.jc || "", component:e.component || "",
          cycle:bump(s), inDT:e.datetime, outDT:null, result:null, waxFailure:null,
          hours:null, elapsedH:null, open:true, anomaly:null, loadEvent:e, extractEvent:null };
        if(open.has(s)){ const old = open.get(s); old.open = false; old.anomaly = (old.anomaly ? old.anomaly + "; " : "") + "no extraction logged"; rec.anomaly = "was already in " + old.bath; }
        open.set(s, rec); records.push(rec);
      });
    } else if(e.type === "Extraction"){
      (e.items || []).forEach(it => {
        const s = it.serial, r = open.get(s);
        if(r){ r.outDT = e.datetime; r.result = it.result || ""; r.waxFailure = it.waxFailure || "None"; r.wax = it.wax || null; r.open = false; r.hours = round(hoursBetweenDT(r.inDT, e.datetime), 2); r.extractEvent = e; open.delete(s); }
        else records.push({ serial:s, bath:e.bath || "", jc:"", component:"", cycle:(cyc.get(s) || 0),
          inDT:null, outDT:e.datetime, result:it.result || "", waxFailure:it.waxFailure || "None", wax:it.wax || null,
          hours:null, elapsedH:null, open:false, anomaly:"extracted but was not in bath", loadEvent:null, extractEvent:e });
      });
    } else if(e.type === "Transfer"){
      // Move parts to another bath, or OUT to the waiting area (no destination
      // bath). To a bath: close the source record and open a same-cycle
      // continuation, flagged `moved` so it isn't counted as a new dip. To the
      // waiting area: just close the source — the part is now out, awaiting.
      const toBath = e.toBath || "";
      (e.serials || []).forEach(s => {
        const r = open.get(s);
        if(r){ r.outDT = e.datetime; r.result = "Moved"; r.open = false; r.hours = round(hoursBetweenDT(r.inDT, e.datetime), 2); r.extractEvent = e; open.delete(s); }
        if(toBath){
          const cont = { serial:s, bath:toBath, jc:(r && r.jc) || e.jc || "", component:(r && r.component) || e.component || "",
            cycle:r ? r.cycle : (cyc.get(s) || 0), inDT:e.datetime, outDT:null, result:null, waxFailure:null,
            hours:null, elapsedH:null, open:true, anomaly:r ? null : "moved but was not in a bath", loadEvent:e, extractEvent:null, moved:true };
          open.set(s, cont); records.push(cont);
        } else if(!r){
          records.push({ serial:s, bath:"", jc:e.jc || "", component:e.component || "", cycle:(cyc.get(s) || 0),
            inDT:null, outDT:e.datetime, result:"Moved", waxFailure:null, hours:null, elapsedH:null, open:false,
            anomaly:"moved out but was not in a bath", loadEvent:null, extractEvent:e });
        }
      });
    } else if(e.type === "Immersion"){ // legacy self-contained dip
      if(!e.serial) continue;
      records.push({ serial:e.serial, bath:e.bath || "", jc:e.jc || "", component:e.component || "",
        cycle:bump(e.serial), inDT:e.datetime, outDT:e.datetime, result:e.result || "", waxFailure:e.waxFailure || "None",
        hours:hrsBetween(e.timeIn, e.timeOut), elapsedH:null, open:false, anomaly:null, loadEvent:e, extractEvent:e });
    }
  }
  open.forEach(r => { r.elapsedH = round(hoursBetweenDT(r.inDT, nowDT), 2); });
  const val = { records, open };
  _immersionsMemo.set(events, { now:nowDT, val });
  return val;
}
function bathContents(events, nowDT, bath){
  const { open } = deriveImmersions(events, nowDT);
  return [...open.values()].filter(r => !bath || r.bath === bath).sort((a, b) => String(a.inDT).localeCompare(String(b.inDT)));
}
// Reporting status for one dip record: still in a bath = Ongoing, cleared =
// Completed, otherwise the removal reason (Re-strip / Re-mask / Hold / Moved).
function dipStatus(r){
  if(r.open) return "Ongoing";
  if(r.result === "Cleared") return "Completed";
  return r.result || "—";
}

// A wax failure is recorded by which masked AREA failed (e.g. cooling holes vs
// the part body) — just the area name. Reads the simple {wax:[name]} shape, the
// older {wax:[{area}]} shape, and the legacy {waxFailure} field for back-compat.
function waxAreasOf(obj){
  if(obj && Array.isArray(obj.wax)) return obj.wax.map(x => typeof x === "string" ? x : (x && x.area)).filter(Boolean);
  if(obj && obj.waxFailure && obj.waxFailure !== "None") return [obj.waxArea || "Mask"];
  return [];
}
function remaskAreasOf(e){ return (Array.isArray(e.areas) && e.areas.length) ? e.areas : null; } // null = covers all areas
// Re-masking is recorded as part of the re-dip (on the Load In event), or, for
// legacy data, as a standalone Re-Masking event. Both count as resolving wax.
function remaskActions(events, serial){
  const out = [];
  events.forEach(e => {
    if(e.type === "Re-Masking" && e.serial === serial) out.push({ datetime:e.datetime, areas:remaskAreasOf(e), event:e });
    else if(e.type === "Load In" && Array.isArray(e.remask)){ const r = e.remask.find(x => x.serial === serial); if(r) out.push({ datetime:e.datetime, areas:(Array.isArray(r.areas) && r.areas.length) ? r.areas : null, event:e }); }
  });
  return out;
}
function waxSummary(obj){ return waxAreasOf(obj).join(", "); }

// A part's wax configuration: which masked areas it actually has (some parts have
// no cooling holes, etc.). Taken from the most recent Add-parts / waiting entry
// that specified it; defaults to every configured area for parts not yet set.
function maskConfigFor(events, config, serial){
  let cfg = null;
  events.slice().sort(byDate).forEach(e => {
    if((e.type === "Load In" || e.type === "Parts Received") && (e.serials || []).includes(serial) && Array.isArray(e.maskAreas)) cfg = e.maskAreas.slice();
  });
  return cfg != null ? cfg : (config.maskAreas || []);
}

// Every wax-failed area observed for a serial (discovered at extraction).
function waxFailures(events, serial){
  const out = [];
  const add = (datetime, areas, event) => areas.forEach(area => out.push({ datetime, area, event }));
  events.forEach(e => {
    if(e.type === "Extraction") (e.items || []).forEach(it => { if(it.serial === serial) add(e.datetime, waxAreasOf(it), e); });
    else if((e.type === "Wax Failure" || e.type === "Immersion") && e.serial === serial) add(e.datetime, waxAreasOf(e), e);
  });
  return out.sort((a, b) => String(a.datetime).localeCompare(String(b.datetime)));
}
// Areas whose most-recent failure has not been resolved by a later re-masking
// that covers that area. The part can't be re-stripped while any remain.
function unresolvedWaxAreas(events, serial){
  const fails = waxFailures(events, serial);
  if(!fails.length) return [];
  const latest = new Map();
  fails.forEach(f => { const c = latest.get(f.area); if(!c || f.datetime > c.datetime) latest.set(f.area, f); });
  const remasks = remaskActions(events, serial);
  // a re-mask resolves a failure only if it is not BEFORE it in event order —
  // compare (datetime, eventId) so same-minute sequences still resolve correctly
  const notBefore = (r, f) => byDate(f.event || { datetime:f.datetime }, r.event || { datetime:r.datetime }) <= 0;
  const out = [];
  latest.forEach((f, area) => { if(!remasks.some(r => notBefore(r, f) && (r.areas == null || r.areas.includes(area)))) out.push(f); });
  return out.sort((a, b) => String(a.datetime).localeCompare(String(b.datetime)));
}
// Back-compat single-value accessor: the most recent unresolved area failure.
function lastUnresolvedWax(events, serial){ const u = unresolvedWaxAreas(events, serial); return u.length ? u[u.length - 1] : null; }

function pieceStatusFor(recs, engEvents, config, needsRemask){
  const open = recs.some(r => r.open);
  // real dips have a load (inDT); orphan "extracted but was not in bath"
  // records must not inflate the cycle count or drive the status
  const real = recs.filter(r => r.inDT != null);
  const lastRec = (real.length ? real : recs)[(real.length ? real : recs).length - 1];
  // "Cleared" is the piece's CURRENT state, not history: only the latest dip
  // counts — a cleared part that is re-loaded is "In bath" again, not Cleared
  const cleared = !!lastRec && !lastRec.open && lastRec.result === "Cleared";
  const cycles = real.filter(r => !r.moved).length;   // a bath-to-bath move is not a new dip
  const closedH = round(recs.filter(r => !r.open).reduce((a, r) => a + (r.hours || 0), 0));
  const totalH = round(closedH + recs.filter(r => r.open).reduce((a, r) => a + (r.elapsedH || 0), 0));
  const engDisp = engEvents.length ? engEvents[engEvents.length - 1].status : "";
  const base = { cycles, hours:closedH, totalH, open };
  // a disposition recorded after the fact overrides an earlier clear
  if(engDisp === "Scrap")            return { s:"Scrap",            cls:"p-red",   ...base };
  if(engDisp === "Return to vendor") return { s:"Returned",         cls:"p-grey",  ...base };
  // if disposition is dated after the last dip ended, it overrides cleared
  const lastDipEnded = lastRec ? lastRec.outDT : null;
  const latestEng = engEvents.length ? engEvents[engEvents.length - 1] : null;
  // >= not >: datetimes are minute-granular, and a part is often pulled and
  // dispositioned within the same minute — that review still governs.
  const engAfterDip = latestEng && lastDipEnded && latestEng.datetime >= lastDipEnded;
  if(engAfterDip){
    if(engDisp === "Accepted")         return { s:"Accepted",         cls:"p-green", ...base };
    if(engEvents.length)               return { s:"→ Engineering",    cls:"p-red",   ...base };
  }
  if(cleared)                        return { s:"Cleared",          cls:"p-green", ...base };
  if(engDisp === "Accepted")         return { s:"Accepted",         cls:"p-green", ...base };
  if(engEvents.length)               return { s:"→ Engineering",    cls:"p-red",   ...base };
  if(open)                           return { s:"In bath",          cls:"p-blue",  ...base };
  if(cycles >= config.maxCycles || totalH >= config.maxHours){
    const why = [];
    if(cycles >= config.maxCycles) why.push(cycles + " cycles ≥ " + config.maxCycles);
    if(totalH >= config.maxHours) why.push(totalH + " h ≥ " + config.maxHours);
    return { s:"→ Engineering", cls:"p-red", reason:why.join(", "), ...base };
  }
  if(needsRemask)                    return { s:"Needs re-mask",    cls:"p-purple", ...base };
  if(cycles > 0)                     return { s:"Awaiting re-strip", cls:"p-amber", ...base };
  return { s:"—", cls:"p-grey", ...base };
}

function derivePieces(events, config, nowDT){
  const { records } = deriveImmersions(events, nowDT);
  const map = new Map();
  records.forEach(r => { const o = map.get(r.serial) || { serial:r.serial, jc:"", component:"", recs:[] }; o.recs.push(r); if(r.jc) o.jc = r.jc; if(r.component) o.component = r.component; map.set(r.serial, o); });
  events.forEach(e => { if(e.serial && !map.has(e.serial)) map.set(e.serial, { serial:e.serial, jc:e.jc || "", component:e.component || "", recs:[] }); });
  const rows = [];
  map.forEach(o => {
    const recs = o.recs.slice().sort((a, b) => String(a.inDT || a.outDT).localeCompare(String(b.inDT || b.outDT)));
    const evs = eventsForSerial(events, o.serial);
    const eng = evs.filter(e => e.type === "Engineering Review");
    const unresolvedWax = unresolvedWaxAreas(events, o.serial);
    const st = pieceStatusFor(recs, eng, config, unresolvedWax.length > 0);
    const openRec = recs.find(r => r.open);
    rows.push({
      serial:o.serial, jc:o.jc || (evs[0] && evs[0].jc) || "", component:o.component || (evs[0] && evs[0].component) || "",
      cycles:st.cycles, hours:st.hours,
      wax: recs.filter(r => r.result !== "Re-mask").reduce((a, r) => a + waxAreasOf(r).length, 0) + evs.filter(e => e.type === "Wax Failure").reduce((a, e) => a + waxAreasOf(e).length, 0),
      reStrips: recs.filter(r => r.result === "Re-strip").length,
      inBath: !!openRec, currentBath: openRec ? openRec.bath : "",
      lastBath: recs.length ? recs[recs.length - 1].bath : "",
      firstPass: recs.some(r => r.result === "Cleared") && !recs.some(r => r.result === "Re-strip"),
      decided: recs.some(r => !r.open && !r.moved && r.inDT != null),   // has at least one real extraction result — counts toward first-pass yield (a part still on its first, never-pulled dip does not; nor does an orphan extraction)
      needsRemask: unresolvedWax.length > 0,
      waxFail: unresolvedWax.length ? { areas:unresolvedWax.map(u => u.area), detail:unresolvedWax.map(u => u.area).join(", "), event:unresolvedWax[unresolvedWax.length - 1].event } : null,
      status:st, recs, events:evs
    });
  });
  rows.sort((a, b) => String(a.jc).localeCompare(String(b.jc)) || String(a.serial).localeCompare(String(b.serial)));
  return rows;
}

function deriveBath(events, config, bath, nowDT){
  const evs = events.filter(e => e.bath === bath).slice().sort(byDate);
  const fills = evs.filter(e => e.type === "Bath Fill");
  const lastFill = fills.length ? fills[fills.length - 1] : null;
  const start = lastFill ? lastFill.datetime : null;
  const inCharge = dt => !start || dt >= start;
  const disposal = evs.filter(e => e.type === "Bath Disposal" && inCharge(e.datetime)).slice(-1)[0] || null;
  const end = disposal ? disposal.datetime : nowDT;
  const within = e => inCharge(e.datetime) && e.datetime <= end;
  const chem = evs.filter(e => e.type === "Chemistry Check" && within(e));
  const lastChem = chem.length ? chem[chem.length - 1] : null;

  const { records, open } = deriveImmersions(events, nowDT);
  const recTime = r => r.inDT || r.outDT;
  const recs = records.filter(r => r.bath === bath && recTime(r) && inCharge(recTime(r)) && recTime(r) <= end);
  const contents = [...open.values()].filter(r => r.bath === bath).sort((a, b) => String(a.inDT).localeCompare(String(b.inDT)));
  const loadH = round(recs.reduce((a, r) => a + (r.open ? (r.elapsedH || 0) : (r.hours || 0)), 0));
  const parts = new Set(recs.map(r => r.serial)).size;
  const wax = recs.filter(r => r.result !== "Re-mask").reduce((a, r) => a + waxAreasOf(r).length, 0) + evs.filter(e => within(e) && e.type === "Wax Failure").reduce((a, e) => a + waxAreasOf(e).length, 0);
  // Volumes added *since* the charge — top-ups only, so the charge fill itself
  // isn't double-counted (it's shown separately as the charge).
  const sinceCharge = e => within(e) && e !== lastFill;
  const hclAdded = evs.filter(sinceCharge).reduce((a, e) => a + (+e.hclAddedL || 0), 0);
  const waterAdded = evs.filter(sinceCharge).reduce((a, e) => a + (+e.waterAddedL || 0), 0);
  const h3po4Added = evs.filter(sinceCharge).reduce((a, e) => a + (+e.h3po4AddedL || 0), 0);
  const age = lastFill ? daysBetween(lastFill.datetime, end) : "";
  const active = !!lastFill && !disposal;

  const flags = [];
  if(lastChem){
    if(num(lastChem.fePpm) != null && +lastChem.fePpm > config.feMax) flags.push("Iron " + lastChem.fePpm + " ppm > " + config.feMax);
    if(num(lastChem.hclPct) != null && (+lastChem.hclPct < config.hclMin || +lastChem.hclPct > config.hclMax)) flags.push("HCl " + lastChem.hclPct + "% out of band");
    if(num(lastChem.temp) != null && Math.abs(+lastChem.temp - config.tempSet) > config.tempTol) flags.push("Temp " + lastChem.temp + "°C out of band");
  }
  if(active && age !== "" && age >= config.maxBathAge) flags.push("Age " + age + " d ≥ " + config.maxBathAge);
  const capacity = config.bathCapacity || 0;
  const free = capacity ? Math.max(0, capacity - contents.length) : null;
  if(active && capacity && contents.length > capacity) flags.push("Over capacity " + contents.length + "/" + capacity);
  if(disposal && contents.length) flags.push(contents.length + " part(s) still recorded as inside a disposed bath");

  return { bath, lastFill, disposal, active, chem, lastChem, loadH, parts, wax, hclAdded, waterAdded, h3po4Added, age, flags, contents, capacity, free };
}
// The baths to show/offer: the ones configured in Settings (always shown), plus
// any extra bath that appears in the event log — so the standard tanks are always
// present, and no bath with real data is ever hidden.
function bathList(events, config){
  const out = (config.baths || []).slice(), seen = new Set(out);
  events.forEach(e => [e.bath, e.toBath].forEach(b => { if(b && b !== WAITING_AREA && !seen.has(b)){ seen.add(b); out.push(b); } }));
  return out;
}
function deriveBaths(events, config, nowDT){ return bathList(events, config).map(b => deriveBath(events, config, b, nowDT)); }

function deriveJobCards(events, config, nowDT){
  const map = new Map();
  derivePieces(events, config, nowDT).forEach(r => {
    const k = r.jc || "(none)";
    const o = map.get(k) || { jc:r.jc || "(none)", component:r.component, pieces:0, decided:0, cleared:0, fp:0, eng:0, inBath:0, reStrips:0, wax:0 };
    o.pieces++; if(r.decided) o.decided++; if(r.status.s === "Cleared") o.cleared++; if(r.firstPass) o.fp++;
    if(r.status.s === "→ Engineering") o.eng++; if(r.inBath) o.inBath++;
    o.reStrips += r.reStrips; o.wax += r.wax;
    if(!o.component && r.component) o.component = r.component;
    map.set(k, o);
  });
  return [...map.values()].map(o => ({ ...o, fpy: o.decided ? Math.round(o.fp / o.decided * 100) : 0 }))
    .sort((a, b) => String(a.jc).localeCompare(String(b.jc)));
}

function deriveKpis(events, config, nowDT){
  const pr = derivePieces(events, config, nowDT);
  const { records, open } = deriveImmersions(events, nowDT);
  // exclude bath-to-bath move continuations and orphan "extracted but was not
  // in bath" records — neither is a dip that actually happened
  const realDips = records.filter(r => !r.moved && r.inDT != null).length;
  const reStrip = records.filter(r => r.result === "Re-strip" && r.inDT != null).length;
  const baths = deriveBaths(events, config, nowDT);
  const clearedPieces = pr.filter(r => r.status.s === "Cleared");
  const decidedPieces = pr.filter(r => r.decided);   // exclude parts still on their first, never-extracted dip from yield
  return {
    total: pr.length, cleared: clearedPieces.length,
    fp: pr.filter(r => r.firstPass).length,
    eng: pr.filter(r => r.status.s === "→ Engineering").length,
    awaiting: pr.filter(r => r.status.s === "Awaiting re-strip").length,
    inBath: open.size,
    fpyBase: decidedPieces.length,
    fpy: decidedPieces.length ? Math.round(decidedPieces.filter(r => r.firstPass).length / decidedPieces.length * 100) : 0,
    dips: realDips, reStrip, reStripRate: realDips ? Math.round(reStrip / realDips * 100) : 0,
    wax: records.filter(r => r.result !== "Re-mask").reduce((a, r) => a + waxAreasOf(r).length, 0) + events.filter(e => e.type === "Wax Failure").reduce((a, e) => a + waxAreasOf(e).length, 0),
    bathsOver: baths.filter(b => b.active && b.flags.length).length,
    activeBaths: baths.filter(b => b.active).length,
    avgCycles: clearedPieces.length ? round(clearedPieces.reduce((a, r) => a + r.cycles, 0) / clearedPieces.length, 2) : 0
  };
}

function deriveDefects(events){
  const out = [];
  events.forEach(e => {
    if(e.type === "Engineering Review") out.push({ e, kind:"Eng review", detail:e.status || "", serial:e.serial || "", bath:e.bath || "" });
    else if(e.type === "Re-Masking"){ const ar = remaskAreasOf(e); out.push({ e, kind:"Re-mask", detail:"resolves " + (ar ? ar.join(", ") : (e.waxFailure || "wax failure")) + (e.notes ? " · " + e.notes : ""), serial:e.serial || "", bath:e.bath || "" }); }
    else if(e.type === "Wax Failure") out.push({ e, kind:"Wax failure", detail:waxSummary(e), serial:e.serial || "", bath:e.bath || "" });
    else if(e.type === "Extraction") (e.items || []).forEach(it => {
      // A "Re-mask" removal is intentional re-masking (logged even with no areas), not a wax defect.
      if(it.result === "Re-mask") out.push({ e, kind:"Re-mask", detail:waxSummary(it), serial:it.serial, bath:e.bath || "" });
      else if(waxAreasOf(it).length) out.push({ e, kind:"Wax failure", detail:waxSummary(it), serial:it.serial, bath:e.bath || "" });
      if(it.result === "Re-strip") out.push({ e, kind:"Re-strip", detail:"", serial:it.serial, bath:e.bath || "" });
    });
    else if(e.type === "Immersion"){
      if(waxAreasOf(e).length) out.push({ e, kind:"Wax failure", detail:waxSummary(e), serial:e.serial || "", bath:e.bath || "" });
      if(e.result === "Re-strip") out.push({ e, kind:"Re-strip", detail:"", serial:e.serial || "", bath:e.bath || "" });
    }
  });
  return out.sort((a, b) => byDate(a.e, b.e)).reverse();
}

// Relationship-aware checks: does this draft contradict the current state of
// its bath or its pieces? Soft (non-blocking) — guidance, not gates.
function eventWarnings(d, events, config, nowDT, isEdit){
  const w = [], add = (level, msg) => w.push({ level, msg });
  const others = events.filter(e => e.id == null || e.id !== d.id);
  let _pi = null;
  const pieceOf = s => { if(!_pi) _pi = new Map(derivePieces(others, config, nowDT).map(p => [p.serial, p])); return _pi.get(s); };
  const lastSerialDT = s => { const evs = eventsForSerial(others, s); return evs.length ? evs[evs.length - 1].datetime : null; };

  if(d.type === "Chemistry Check"){
    const fe = num(d.fePpm); if(fe != null && fe > config.feMax) add("red", `Iron ${fe} ppm exceeds limit ${config.feMax} — bath may be spent`);
    const hp = num(d.hclPct); if(hp != null && (hp < config.hclMin || hp > config.hclMax)) add("amber", `Free HCl ${hp}% outside band ${config.hclMin}–${config.hclMax}%`);
    const t = num(d.temp); if(t != null && Math.abs(t - config.tempSet) > config.tempTol) add("amber", `Temp ${t}°C outside ${config.tempSet}±${config.tempTol}°C`);
    if(d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.disposal) add("amber", `Bath ${d.bath} was disposed ${fmtDate(bs.disposal.datetime)} — this check is on an inactive bath`); else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`); }
  }
  if(d.type === "Load In"){
    if(d.bath){
      const bs = deriveBath(others, config, d.bath, nowDT);
      if(bs.disposal) add("red", `Bath ${d.bath} was disposed ${fmtDate(bs.disposal.datetime)} — fill it before loading`);
      else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`);
      else if(bs.flags.length) add("amber", `Bath ${d.bath}: ${bs.flags.join("; ")}`);
      if(bs.capacity){
        const adding = (d.serials || []).filter(s => !bs.contents.some(r => r.serial === s)).length;
        if(bs.contents.length + adding > bs.capacity) add("red", `Bath ${d.bath} would hold ${bs.contents.length + adding} parts (capacity ${bs.capacity})`);
      }
    }
    // Per-serial checks assume you're loading these parts *now* (re-load sequencing,
    // wax gate, back-dating). When editing an existing load in place they would
    // fire against the load's own downstream history, so skip them on edit.
    if(!isEdit) (d.serials || []).forEach(s => {
      const p = pieceOf(s);
      if(p){
        if(p.inBath) add("amber", `${s} is already in bath ${p.currentBath}`);
        else if(p.status.s === "Cleared" || p.status.s === "Accepted") add("amber", `${s} is already ${p.status.s} — re-loading starts a new cycle`);
        else if(p.status.s === "Scrap" || p.status.s === "Returned") add("red", `${s} was dispositioned ${p.status.s} — it should not be re-stripped`);
        else if(p.status.s === "→ Engineering") add("red", `${s} is awaiting engineering review — disposition it before re-stripping`);
        if((p.cycles + 1) > config.maxCycles) add("red", `${s} would be cycle ${p.cycles + 1} (> max ${config.maxCycles}) — route to engineering`);
      }
      const uw = unresolvedWaxAreas(others, s);
      if(uw.length){
        const rm = (d.remask || []).find(x => x.serial === s);
        const covered = rm ? (Array.isArray(rm.areas) && rm.areas.length ? rm.areas : null) : [];
        const remaining = covered == null ? [] : uw.filter(a => !covered.includes(a.area));
        if(remaining.length) add("red", `${s} has a wax failure (${remaining.map(x => x.area).join(", ")}) — re-mask it before re-loading`);
      }
      const last = lastSerialDT(s); if(last && d.datetime && d.datetime < last) add("amber", `${s}: this load is dated before its last recorded event (${fmtDT(last)})`);
    });
  }
  if(d.type === "Extraction" && d.bath){
    const bs = deriveBath(others, config, d.bath, nowDT);
    if(bs.disposal) add("red", `Bath ${d.bath} is disposed`);
    const idx = new Map(bathContents(others, nowDT, d.bath).map(r => [r.serial, r]));
    (d.items || []).forEach(it => {
      const r = idx.get(it.serial);
      if(!r) add("amber", `${it.serial} is not currently in bath ${d.bath}`);
      else if(r.inDT && d.datetime && d.datetime < r.inDT) add("red", `${it.serial}: time out is before it went in (${fmtDT(r.inDT)})`);
    });
  }
  if(d.type === "Bath Disposal" && d.bath){
    const bs = deriveBath(others, config, d.bath, nowDT);
    if(!bs.lastFill) add("amber", `Bath ${d.bath} has no charge to dispose`);
    else if(!bs.active) add("amber", `Bath ${d.bath} is already disposed (${fmtDate(bs.disposal.datetime)})`);
    if(bs.contents.length) add("red", `Bath ${d.bath} still holds ${bs.contents.length} part(s): ${bs.contents.map(r => r.serial).join(", ")} — extract them first`);
  }
  if(d.type === "Bath Fill" && d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.active) add("amber", `Bath ${d.bath} is already active (filled ${fmtDate(bs.lastFill.datetime)}); dispose before re-filling`); }
  if((d.type === "HCl Top-Up" || d.type === "Water Top-Up" || d.type === "Top-Up") && d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.disposal) add("red", `Bath ${d.bath} is disposed`); else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`); }
  if(d.type === "Transfer"){
    if(d.bath && d.toBath && d.bath === d.toBath) add("red", "Source and destination are the same bath");
    if(d.toBath && d.toBath !== WAITING_AREA){
      const bd = deriveBath(others, config, d.toBath, nowDT);
      if(bd.disposal) add("red", `Bath ${d.toBath} was disposed ${fmtDate(bd.disposal.datetime)} — fill it before moving parts in`);
      else if(!bd.lastFill) add("amber", `Bath ${d.toBath} has no fill logged`);
      else if(bd.flags.length) add("amber", `Bath ${d.toBath}: ${bd.flags.join("; ")}`);
      if(bd.capacity){
        const adding = (d.serials || []).filter(s => !bd.contents.some(r => r.serial === s)).length;
        if(bd.contents.length + adding > bd.capacity) add("red", `Bath ${d.toBath} would hold ${bd.contents.length + adding} parts (capacity ${bd.capacity})`);
      }
    }
    if(d.bath){
      const idx = new Map(bathContents(others, nowDT, d.bath).map(r => [r.serial, r]));
      (d.serials || []).forEach(s => { if(!idx.has(s)) add("amber", `${s} is not currently in bath ${d.bath}`); });
    }
  }
  if(d.type === "Parts Received"){
    (d.serials || []).forEach(s => { const p = pieceOf(s); if(p && p.inBath) add("amber", `${s} is currently in bath ${p.currentBath} — it can't also be waiting`); });
  }
  if(d.type === "Re-Masking" && d.serial){
    const p = pieceOf(d.serial);
    if(p && p.inBath) add("red", `${d.serial} is currently in bath ${p.currentBath} — extract it before re-masking`);
    else if(!lastUnresolvedWax(others, d.serial)) add("amber", `No unresolved wax failure for ${d.serial} — re-masking may be unnecessary`);
  }
  if(d.type === "Engineering Review" && d.serial){
    const p = pieceOf(d.serial);
    if(p){
      if(p.status.s === "Cleared") add("amber", `${d.serial} has already cleared — engineering review may be unnecessary`);
      else if(p.inBath) add("amber", `${d.serial} is still in bath ${p.currentBath}`);
      const eng = p.events.filter(e => e.type === "Engineering Review");
      if(eng.length && d.id == null) add("amber", `${d.serial} already has a disposition (${eng[eng.length - 1].status})`);
    }
  }
  return w;
}

// Autofill: a serial's last-known job card / component from history.
function lookupSerial(events, serial){
  let jc = "", component = "";
  // date order, not storage order — a backfilled older event must not override
  events.slice().sort(byDate).forEach(e => { if(e.serial === serial || (e.serials || []).includes(serial)){ if(e.jc) jc = e.jc; if(e.component) component = e.component; } });
  return { jc, component };
}
// Active, in-band baths ranked by lowest iron — candidates to receive a re-strip.
// A bath with no titration on record ranks LAST: unverified chemistry is not
// a reason to prefer it over a bath measured at low iron.
function healthyBaths(events, config, nowDT){
  const fe = b => { const v = num((b.lastChem || {}).fePpm); return v == null ? Infinity : v; };
  return deriveBaths(events, config, nowDT).filter(b => b.active && !b.flags.length)
    .sort((a, b) => fe(a) - fe(b));
}
function suggestRescueBath(events, config, nowDT, exclude){
  const h = healthyBaths(events, config, nowDT).filter(b => b.bath !== exclude && (b.free === null || b.free > 0));
  return h.length ? h[0].bath : "";
}

// The smart layer: given the current state, what should happen next? Each
// suggestion carries an `action` that prefills the log drawer.
function deriveSuggestions(events, config, nowDT){
  const out = [];
  const pieces = derivePieces(events, config, nowDT);
  const baths = deriveBaths(events, config, nowDT);

  baths.forEach(b => {
    if(!b.active){ if(b.contents.length) out.push({ level:"red", title:`Bath ${b.bath}: ${b.contents.length} part(s) recorded inside a disposed bath`, detail:b.contents.map(r => r.serial).join(", "), action:{ type:"extract", bath:b.bath, preselect:b.contents.map(r => r.serial) } }); return; }
    const overH = b.contents.filter(r => r.elapsedH >= config.maxHours);
    if(overH.length) out.push({ level:"red", title:`Bath ${b.bath}: ${overH.length} part(s) over ${config.maxHours} h immersion`, detail:overH.map(r => r.serial).join(", "), action:{ type:"extract", bath:b.bath, preselect:overH.map(r => r.serial) } });
    const lc = b.lastChem;
    if(lc && num(lc.fePpm) != null && +lc.fePpm > config.feMax) out.push({ level:"red", title:`Bath ${b.bath}: iron ${lc.fePpm} ppm over limit`, detail:"Spent — dispose and refill.", action:{ type:"dispose", bath:b.bath } });
    else if(lc && num(lc.hclPct) != null && +lc.hclPct < config.hclMin) out.push({ level:"amber", title:`Bath ${b.bath}: free HCl ${lc.hclPct}% below ${config.hclMin}%`, detail:"Top up acid.", action:{ type:"topup-hcl", bath:b.bath } });
    if(b.age !== "" && b.age >= config.maxBathAge) out.push({ level:"amber", title:`Bath ${b.bath}: ${b.age} days old (≥ ${config.maxBathAge})`, detail:"Scheduled change due.", action:{ type:"dispose", bath:b.bath } });
    const lastChemDT = b.chem.length ? b.chem[b.chem.length - 1].datetime : b.lastFill.datetime;
    const dd = daysBetween(lastChemDT, nowDT);
    const chemDue = config.chemEveryDays == null ? 2 : config.chemEveryDays;
    if(chemDue > 0 && dd !== "" && dd >= chemDue) out.push({ level:"info", title:`Bath ${b.bath}: no chemistry check in ${dd} days`, detail:"Log a titration.", action:{ type:"chem", bath:b.bath } });
  });

  // Assign rescue baths capacity-aware: each part consumes a free slot, so a
  // group is never suggested into a bath that cannot actually hold it.
  const healthy = healthyBaths(events, config, nowDT);
  const freeLeft = new Map(healthy.map(b => [b.bath, b.free === null ? Infinity : b.free]));
  const takeRescue = exclude => {
    const h = healthy.find(b => b.bath !== exclude && freeLeft.get(b.bath) > 0);
    if(!h) return "";
    freeLeft.set(h.bath, freeLeft.get(h.bath) - 1);
    return h.bath;
  };
  const groups = new Map();
  pieces.forEach(p => {
    if(p.status.s !== "Awaiting re-strip" && p.status.s !== "Needs re-mask") return;
    const last = p.recs[p.recs.length - 1];
    const rb = takeRescue(last ? last.bath : "");
    const key = (p.jc || "") + "|" + rb;
    const g = groups.get(key) || { jc:p.jc, component:p.component, bath:rb, serials:[], remask:0 };
    g.serials.push(p.serial); if(p.status.s === "Needs re-mask") g.remask++;
    groups.set(key, g);
  });
  groups.forEach(g => out.push({ level:"amber", title:`Re-load ${g.serials.length > 1 ? g.serials.length + " parts" : g.serials[0]}${g.jc ? " (" + g.jc + ")" : ""}`, detail:(g.bath ? "→ bath " + g.bath : "no healthy bath available") + (g.remask ? " · re-mask " + g.remask + " first" : ""), action:{ type:"reload", serials:g.serials, bath:g.bath, jc:g.jc, component:g.component } }));
  pieces.filter(p => p.status.s === "→ Engineering").forEach(p => out.push({ level:"red", title:`Engineering review: ${p.serial}`, detail:`${p.cycles} cycles${p.hours ? ", " + p.hours + " h" : ""}${p.jc ? " · " + p.jc : ""}`, action:{ type:"engineering", serial:p.serial, jc:p.jc } }));

  const rank = { red:0, amber:1, info:2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level]);
}

// Parked parts: serials a tech logged as received in their area (a "Parts
// Received" event) but has not yet loaded into a bath since — staged, awaiting
// a first dip. A part drops off this list once it is loaded. Newest first.
function parkedParts(events, config, nowDT){
  const latest = new Map();
  events.forEach(e => { if(e.type === "Parts Received") (e.serials || []).forEach(s => {
    const c = latest.get(s);
    if(!c || String(e.datetime) > String(c.datetime)) latest.set(s, { datetime:e.datetime, jc:e.jc || "", component:e.component || "", operator:e.operator || "" });
  }); });
  if(!latest.size) return [];
  const out = [];
  latest.forEach((info, s) => {
    const loaded = events.some(e => e.type === "Load In" && (e.serials || []).includes(s) && String(e.datetime) >= String(info.datetime));
    if(loaded) return;
    const look = lookupSerial(events, s);
    out.push({ serial:s, jc:info.jc || look.jc || "", component:info.component || look.component || "", datetime:info.datetime, operator:info.operator || "" });
  });
  return out.sort((a, b) => String(b.datetime).localeCompare(String(a.datetime)));
}

// The waiting area: everything physically out of a tank but not finished — parts
// that came out without re-entry (awaiting re-strip, needs re-mask, or flagged for
// engineering review), plus serials parked on receipt. One per serial, newest first.
function waitingParts(events, config, nowDT){
  const out = [], seen = new Set();
  const WAIT = { "Awaiting re-strip":"awaiting re-strip", "Needs re-mask":"needs re-mask", "→ Engineering":"review" };
  derivePieces(events, config, nowDT).forEach(p => {
    if(p.inBath || seen.has(p.serial)) return;
    const kind = WAIT[p.status.s];
    if(!kind) return;   // terminal (Cleared / Accepted / Scrap / Returned) — not on the bench
    seen.add(p.serial);
    out.push({ serial:p.serial, jc:p.jc || "", component:p.component || "", kind, lastBath:p.lastBath || "", datetime:(p.recs[p.recs.length - 1] || {}).outDT || "" });
  });
  parkedParts(events, config, nowDT).forEach(p => {
    if(seen.has(p.serial)) return; seen.add(p.serial);
    out.push({ serial:p.serial, jc:p.jc || "", component:p.component || "", kind:"received", lastBath:"", datetime:p.datetime });
  });
  return out.sort((a, b) => String(b.datetime).localeCompare(String(a.datetime)));
}

/* ----------------------------- storage -------------------------------- */
function openDB(){ return new Promise((res, rej) => {
  const r = indexedDB.open(DB_NAME, DB_VER);
  r.onupgradeneeded = e => { const d = e.target.result;
    if(!d.objectStoreNames.contains("events")) d.createObjectStore("events", { keyPath:"id", autoIncrement:true });
    if(!d.objectStoreNames.contains("config")) d.createObjectStore("config", { keyPath:"k" });
    // v2: work recorded while the network was down, waiting to reach the server.
    if(!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath:"seq", autoIncrement:true }); };
  r.onsuccess = e => { db = e.target.result; res(); };
  r.onerror = e => rej(e.target.error);
}); }
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function getAll(store){ return new Promise((res, rej) => { const r = tx(store, "readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
function putRec(store, obj){ return new Promise((res, rej) => { const r = tx(store, "readwrite").put(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function delRec(store, key){ return new Promise((res, rej) => { const r = tx(store, "readwrite").delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function clearStore(store){ return new Promise((res, rej) => { const r = tx(store, "readwrite").clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

async function loadAll(){
  EVENTS = (await getAll("events")).sort(byDate);
  CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  (await getAll("config")).forEach(o => { if(Object.prototype.hasOwnProperty.call(DEFAULT_CONFIG, o.k)) CONFIG[o.k] = o.v; });
}
// Accept only known keys, coerced to the type the default declares — an imported
// backup must not introduce junk settings or reach the prototype chain.
function sanitizeConfig(raw){
  const out = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  if(!raw || typeof raw !== "object") return out;
  Object.keys(DEFAULT_CONFIG).forEach(k => {
    const v = raw[k];
    if(Array.isArray(DEFAULT_CONFIG[k])){ if(Array.isArray(v)) out[k] = v.map(x => String(x)).filter(Boolean); }
    else { const n = num(v); if(n != null) out[k] = n; }
  });
  return out;
}
async function saveConfig(keys = Object.keys(CONFIG)){
  if(ONLINE && !isAdmin()) throw new Error("Only an admin can change settings.");
  for(const k of keys){
    await putRec("config", { k, v:CONFIG[k] });
    await queueOp({ op:"config", k, v:CONFIG[k] });
  }
}

function nowLocalDT(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function todayISODate(){ return nowLocalDT().slice(0,10); }

/* --------------------------- server sync ------------------------------ */
/* Every one of these is a no-op offline, so the local-only mode keeps the
 * exact behaviour it had before there was a server. */

function newUid(){
  if(typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

// The local mirror carries an auto-increment `id` that is meaningless to anyone
// else; `uid` is what identifies an event across machines.
function forServer(obj){ const o = Object.assign({}, obj); delete o.id; return o; }

function cachedRole(){ try { return localStorage.getItem("sh_role"); } catch(e){ return null; } }
function cacheRole(r){ try { r ? localStorage.setItem("sh_role", r) : localStorage.removeItem("sh_role"); } catch(e){ /* private mode */ } }
function cachedOperator(){ try { return localStorage.getItem("sh_operator") || ""; } catch(e){ return ""; } }
function cacheOperator(name){ try { name ? localStorage.setItem("sh_operator", name) : localStorage.removeItem("sh_operator"); } catch(e){ /* private mode */ } }

async function api(path, opts){
  const r = await fetch(path, Object.assign({
    headers: { "Content-Type":"application/json" }, credentials: "same-origin"
  }, opts || {}));
  let body = null;
  try { body = await r.json(); } catch(e){ /* non-JSON error page */ }
  if(!r.ok){
    const err = new Error((body && body.error) || ("Request failed (" + r.status + ")"));
    err.status = r.status;
    if(body && Number.isInteger(body.opIndex)) err.opIndex = body.opIndex;
    throw err;
  }
  return body;
}

// Replace the local mirror with exactly what the server holds.
async function adoptServerState(state){
  if(state.role){ ROLE = state.role; cacheRole(ROLE); }
  await clearStore("events");
  for(const ev of (state.events || [])) await putRec("events", forServer(ev));
  await clearStore("config");
  const cfg = sanitizeConfig(state.config || {});
  for(const k of Object.keys(cfg)) await putRec("config", { k, v:cfg[k] });
  await loadAll();
}

let syncTimer = null;
function scheduleSync(delay = 250){
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; syncNow(); }, delay);
}
async function queueOp(op){
  if(!ONLINE) return;
  await putRec("outbox", { op });
  // Debounced: a config restore writes every key and a whole import writes
  // hundreds of events. Those should be one upload sequence, not hundreds.
  scheduleSync();
}

let syncing = false;
let syncAgain = false;
async function syncNow(){
  if(!ONLINE || !ROLE) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  syncAgain = false;
  SYNC_STATE = "syncing"; paintSync();
  let rejectedNote = "";
  try {
    while(ROLE){
      const queued = (await getAll("outbox")).sort((a, b) => a.seq - b.seq);
      if(!queued.length){
        const state = await api("/api/sync");
        await adoptServerState(state);
        // A save may have landed while the GET and mirror replacement were in
        // flight. Its outbox row is authoritative; loop and upload it now.
        if((await getAll("outbox")).length) continue;
        break;
      }

      // The API accepts at most 500 operations. Process large offline queues in
      // bounded chunks instead of submitting one oversized request and losing it.
      const batch = queued.slice(0, 500);
      let state;
      try {
        state = await api("/api/sync", { method:"POST", body: JSON.stringify({ ops: batch.map(q => q.op) }) });
      } catch(err){
        // The server validates the batch before applying it and identifies the
        // rejected operation. Remove only that row; every valid row remains and
        // is retried in the next pass.
        if(err.status >= 400 && err.status < 500 && Number.isInteger(err.opIndex) && batch[err.opIndex]){
          await delRec("outbox", batch[err.opIndex].seq);
          rejectedNote = err.message;
          flash("One queued change was rejected: " + err.message);
          continue;
        }
        throw err;
      }

      // Delete exactly what this request submitted. clearStore() is unsafe: a
      // second save can append a row while fetch is in flight.
      for(const q of batch) await delRec("outbox", q.seq);

      // Do not replace the mirror until every pending local operation has been
      // accepted. Otherwise the server snapshot would temporarily erase later
      // offline work from the UI.
      if((await getAll("outbox")).length) continue;
      await adoptServerState(state);
      if((await getAll("outbox")).length) continue;
      break;
    }
    SYNC_STATE = rejectedNote ? "error" : "idle";
    SYNC_NOTE = rejectedNote;
  } catch(err){
    if(err.status === 401){
      // The session expired. Keep the queued work — it will go up after login.
      ROLE = null; cacheRole(null); syncing = false; SYNC_STATE = "error";
      render(); return;
    }
    if(err.status >= 400 && err.status < 500){
      // Preserve the queue when the server cannot identify one bad operation.
      // Losing valid shop-floor work is worse than leaving a visible retry error.
      SYNC_STATE = "error"; SYNC_NOTE = err.message;
      flash("Not saved to the server: " + err.message);
    } else {
      SYNC_STATE = "offline";
      SYNC_NOTE = "Working offline — your entries are saved here and will upload when the network returns.";
    }
  }
  syncing = false;
  paintSync();
  if(typeof render === "function" && SYNC_STATE !== "syncing") render();
  // A debounced call may have fired while this pass was busy. Never leave its
  // outbox rows waiting for the 20-second poll.
  try { if(syncAgain || (await getAll("outbox")).length) scheduleSync(0); } catch(e){ /* database is closing */ }
}

async function addEvent(obj){
  obj.datetime = obj.datetime || nowLocalDT();
  obj.uid = obj.uid || newUid();
  const baseId = nextEventId(obj.datetime, EVENTS);
  // Daily counters are local and two shared clients can choose the same number.
  // Keep the readable counter, plus a short UID suffix, so the ledger reference
  // remains unique without needing an online round trip.
  obj.eventId = obj.eventId || (ONLINE ? baseId + "-" + String(obj.uid).replace(/-/g, "").slice(0, 12).toUpperCase() : baseId);
  const id = await putRec("events", obj); obj.id = id;
  await loadAll();
  await queueOp({ op:"put", uid:obj.uid, event:forServer(obj) });
}
async function updateEvent(obj){
  if(ONLINE && !isAdmin()) throw new Error("Only an admin can edit an event.");
  obj.uid = obj.uid || newUid();
  await putRec("events", obj);
  await loadAll();
  await queueOp({ op:"put", uid:obj.uid, event:forServer(obj) });
}
async function removeEvent(id){
  if(ONLINE && !isAdmin()) throw new Error("Only an admin can delete an event.");
  const gone = EVENTS.find(e => e.id === id);
  await delRec("events", id);
  await loadAll();
  if(gone && gone.uid) await queueOp({ op:"del", uid:gone.uid });
}

const $ = (s, el = document) => el.querySelector(s);
function esc(s){ return (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function cel(tag, attrs = {}, kids = []){
  const e = document.createElement(tag);
  for(const k in attrs){ const v = attrs[k];
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if(v != null && v !== false) e.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}

/* --- click-to-sort for data tables --- */
const tableSort = { pieces:{ key:null, dir:1 }, events:{ key:null, dir:1 } };
function toggleSort(table, key){ const st = tableSort[table]; if(st.key === key) st.dir = -st.dir; else { st.key = key; st.dir = 1; } render(); }
function sortableTH(table, key, label, extraCls, titleText){
  const st = tableSort[table], active = st.key === key;
  return cel("th", { class:"sortable" + (extraCls ? " " + extraCls : "") + (active ? " sorted" : ""), role:"button", tabindex:"0",
    title:titleText || ("Sort by " + label), "aria-sort":active ? (st.dir > 0 ? "ascending" : "descending") : "none",
    onclick:() => toggleSort(table, key),
    onkeydown:e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleSort(table, key); } }
  }, [label, cel("span", { class:"sort-ind" }, active ? (st.dir > 0 ? " ▲" : " ▼") : "")]);
}
function applySort(table, rows, acc){
  const st = tableSort[table]; if(!st.key || !acc[st.key]) return rows;   // no key → keep the view's natural order
  const f = acc[st.key];
  return rows.slice().sort((a, b) => {
    const va = f(a), vb = f(b);
    if(typeof va === "number" && typeof vb === "number") return (va - vb) * st.dir;
    return String(va == null ? "" : va).localeCompare(String(vb == null ? "" : vb), undefined, { numeric:true, sensitivity:"base" }) * st.dir;
  });
}
function flash(msg, action){
  const b = cel("div", { style:"position:fixed;bottom:0;left:0;right:0;background:var(--chrome);color:#fff;padding:7px 14px;z-index:80;font-size:12.5px;display:flex;align-items:center;gap:14px;border-top:1px solid #000" }, msg);
  if(action) b.append(cel("button", { style:"background:none;border:none;color:#8fb9de;font-weight:700;cursor:pointer;font-size:12.5px;text-decoration:underline", onclick:() => { b.remove(); action.fn(); } }, action.label));

}

const SVGNS = "http://www.w3.org/2000/svg";
