<div id="modalRoot"></div>
<div id="printArea"></div>

<script>
"use strict";

/* =========================================================================
   Stripping Historian — a single-file, offline, event-sourced shop log for
   chemical stripping of turbine components.

   Everything is recorded by SET NUMBER and a COUNT OF PARTS — there are no
   serial numbers anywhere. "Set 7261, six parts" is what the floor writes on
   the basket tag, and it is all anyone has to type at a hot tank.

   Dips are recorded as two separate events so the operator never has to know
   the out-time up front:
     • Load In   — N parts of a set go INTO a bath  (event time = time in)
     • Extraction — SOME of them come OUT            (event time = time out, reason per quantity)
   The system pairs them per lot — N parts of one set sharing a place and a
   history — counts cycles, and always knows what is still in each bath. Every
   view is a PURE function of the event stream.
   ========================================================================= */

const DB_NAME = "strip_historian_db", DB_VER = 2;
let db = null, EVENTS = [], CONFIG = {};

/* The app runs in two modes, decided by how it was opened.
 *
 *  - Offline (file://): everything lives in IndexedDB on this PC, exactly as it
 *    always has. No server, no login, no sharing. This is still a supported way
 *    to run it and every domain test exercises this path.
 *  - Shared (http/https): a Cloudflare D1 database behind /api/sync is the
 *    source of truth, so every operator and the dashboard see one log.
 *    IndexedDB stays on as a local mirror plus an outbox, so a dropped network
 *    never blocks anyone standing at a tank.
 */
const ONLINE = typeof location !== "undefined" && /^https?:$/.test(location.protocol);
let ROLE = null;             // "admin" | "operator" | null
let SYNC_STATE = "idle";     // idle | syncing | offline | error
let SYNC_NOTE = "";

// Offline mode has no roles, so the single local user can do everything.
function isAdmin(){ return !ONLINE || ROLE === "admin"; }

const DEFAULT_CONFIG = {
  tempSet: 90, tempTol: 3,
  hclMin: 16, hclMax: 22,
  feMax: 100,
  maxCycles: 3, maxHours: 24,
  maxBathAge: 30,
  bathCapacity: 0,   // 0 = no part limit
  chemEveryDays: 2,  // titration cadence; 0 = never prompt
  maskAreas: ["Cooling holes", "Part body"],
  baths: ["102-103", "106-107", "202-203", "206-207"],   // always shown; edit in Settings
  operators: ["Diang", "JM", "Bernabe", "Maint", "QA"]
};

/* ============================ DOMAIN START ===============================
   Pure functions only. No DOM, no IndexedDB, no module-level mutable state. */
function round(n, p = 1){ const f = Math.pow(10, p); return Math.round((+n) * f) / f; }
function num(v){ return (v === "" || v == null) ? null : (Number.isFinite(+v) ? +v : null); }
function fmtNum(v){ const n = num(v); return n == null ? "" : String(round(n, 2)); }

function byDate(a, b){
  return String(a.datetime || "").localeCompare(String(b.datetime || ""))
      || String(a.eventId || "").localeCompare(String(b.eventId || ""))
      || String(a.uid || "").localeCompare(String(b.uid || ""));
}

function hrsBetween(a, b){ // clock-time difference, tolerant of overnight roll-over
  if(!a || !b) return 0;
  const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1);
  if(d < 0) d += 1440;
  return round(d / 60, 2);
}
function hoursBetweenDT(a, b){ if(!a || !b) return 0; const d = (new Date(b) - new Date(a)) / 3600000; return d > 0 ? d : 0; }
// Times are entered to the minute, so minutes — not decimal hours — are the
// exact quantity. Everything shown to an operator is derived from these, which
// is why a 95-minute dip reads "1 h 35 min" and not "1.6 h".
function minsBetweenDT(a, b){ if(!a || !b) return 0; const d = Math.round((new Date(b) - new Date(a)) / 60000); return d > 0 ? d : 0; }
function minsBetween(a, b){ // clock-time difference, tolerant of overnight roll-over
  if(!a || !b) return 0;
  const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1);
  if(d < 0) d += 1440;
  return d;
}
function daysBetween(a, b){ if(!a || !b) return ""; return Math.round((new Date(b) - new Date(a)) / 86400000); }

// Nobody on the floor reads "1.58 h" off a tank. Decimal hours are kept for the
// CSV, where they still aggregate in a pivot; on screen a duration always reads
// the way a clock does: "1 h 35 min", "45 min", "3 h".
function fmtMins(m){
  const n = num(m);
  if(n == null) return "";
  const t = Math.max(0, Math.round(n));
  const hh = Math.floor(t / 60), mm = t % 60;
  if(!hh) return mm + " min";
  if(!mm) return hh + " h";
  return hh + " h " + mm + " min";
}
// For the few values that are genuinely configured in hours (the immersion limit).
function fmtDur(h){ const n = num(h); return n == null ? "" : fmtMins(n * 60); }
function fmtParts(n){ const q = parseQty(n); return q + " part" + (q === 1 ? "" : "s"); }

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(dt){ if(!dt) return ""; const d = dt.slice(0,10).split("-"); return d[2] + " " + MONTHS[(+d[1]) - 1] + " " + d[0].slice(2); }
function fmtDT(dt){ if(!dt) return ""; return fmtDate(dt) + (dt.length > 10 ? " " + dt.slice(11,16) : ""); }

function nextEventId(dateStr, events){
  const ymd = (dateStr || "").slice(0,10).replace(/-/g, "");
  let mx = 0; // max suffix + 1, not count + 1: a same-day delete must never free an id for reuse
  events.forEach(e => { if(e.eventId && e.eventId.indexOf(ymd) === 0){ const n = parseInt(e.eventId.slice(ymd.length + 1), 10); if(Number.isFinite(n) && n > mx) mx = n; } });
  return ymd + "-" + String(mx + 1).padStart(4, "0");
}

/* ---- a set number and a count: the only two things an operator types ----

   The floor works in sets, not serials. "Set 7261, six parts" is what is
   written on the tag that travels with the basket, and it is all anyone is
   willing to type at a hot tank. Older ledgers carried a job-card number and a
   list of serials; both are read as the same thing — the set, and how many
   parts were in it — so an imported backup still derives correctly. */
function parseQty(v){ const n = num(v); return n == null ? 0 : Math.max(0, Math.floor(n)); }
function setOf(o){ if(!o) return ""; const s = o.set != null ? o.set : o.jc; return String(s == null ? "" : s).trim(); }
function qtyOf(o){
  if(!o) return 0;
  // A present-but-blank count is zero, not one: a half-filled form must fail
  // its own required check rather than quietly record a single part. Only an
  // ABSENT `qty` falls through to the legacy shapes below.
  if(o.qty !== undefined){ const n = num(o.qty); return n == null ? 0 : Math.max(0, Math.floor(n)); }
  if(Array.isArray(o.serials)) return o.serials.length;          // legacy serial list
  return (o.serial || o.set != null || o.jc != null) ? 1 : 0;    // legacy single-serial event
}
// Every set the ledger knows about, for the drop-downs and the autofill.
function setList(events){
  const out = [], seen = new Set();
  events.slice().sort(byDate).forEach(e => {
    const s = setOf(e);
    if(s && !seen.has(s)){ seen.add(s); out.push(s); }
  });
  return out.sort((a, b) => String(a).localeCompare(String(b), undefined, { numeric:true }));
}

/* ---- event-type schema ---- */
const F = { // key -> [storedName, label, kind]
  bath:["bath","Bath","baths"], set:["set","Set No.","set"], qty:["qty","Number of parts","qty"],
  component:["component","Component","text"],
  hclPct:["hclPct","Free HCl %","num"], fePpm:["fePpm","Iron Fe (ppm)","num"], temp:["temp","Temp °C","num"],
  hcl:["hclAddedL","HCl added (L)","num"], water:["waterAddedL","Water added (L)","num"], h3po4:["h3po4AddedL","H₃PO₄ added (L)","num"],
  disp:["status","Disposition","sel:Accepted,Engineering review,Scrap,Return to vendor,Hold"],
  reason:["disposalReason","Disposal reason","sel:Iron limit reached,HCl exhausted,Contamination,Scheduled change,Other"],
  op:["operator","Operator","operator"], notes:["notes","Notes","text"]
};
const TYPES = {
  "Load In":          { desc:"parts INTO a bath (time in)",  custom:"load",    fields:[F.bath,F.set,F.qty,F.component,F.op,F.notes] },
  "Extraction":       { desc:"parts OUT of a bath (time out)",custom:"extract", fields:[F.bath,F.op,F.notes] },
  "Transfer":         { desc:"move parts to another bath",   custom:"move",    fields:[F.bath,F.op,F.notes] },
  "Parts Received":   { desc:"park a set in the waiting area (not in a bath)", custom:"received", hidden:true, fields:[F.set,F.qty,F.component,F.op,F.notes] },
  "Chemistry Check":  { desc:"titration result",   fields:[F.bath,F.temp,F.hclPct,F.fePpm,F.op,F.notes] },
  "Top-Up":           { desc:"partial top-up — add acid / water / H₃PO₄", fields:[F.bath,F.hcl,F.water,F.h3po4,F.op,F.notes] },
  "Bath Fill":        { desc:"complete fill — new charge",   fields:[F.bath,F.hcl,F.water,F.h3po4,F.op,F.notes] },
  "HCl Top-Up":       { desc:"add acid",            hidden:true, fields:[F.bath,F.hcl,F.op,F.notes] },
  "Water Top-Up":     { desc:"add water",           hidden:true, fields:[F.bath,F.water,F.op,F.notes] },
  "Wax Failure":      { desc:"masking defect (per area)", custom:"waxfail", hidden:true, fields:[F.bath,F.set,F.qty,F.op,F.notes] },
  "Re-Masking":       { desc:"re-wax failed areas",  custom:"remask",  hidden:true, fields:[F.set,F.qty,F.op,F.notes] },
  "Engineering Review":{ desc:"disposition parts", custom:"engreview", fields:[F.set,F.qty,F.disp,F.op,F.notes] },
  "Bath Disposal":    { desc:"bath taken out",      fields:[F.bath,F.reason,F.op,F.notes] }
};
// Friendly UI labels for the operator-facing actions. The stored event `type`
// stays "Load In" / "Extraction" (the formal ledger); only the display changes.
const TYPE_LABEL = { "Load In":"Add parts", "Extraction":"Remove parts", "Parts Received":"Waiting area" };
const typeLabel = t => TYPE_LABEL[t] || t;
// Sentinel chosen in the Add-parts bath drop-down to park a set in the waiting
// area instead of a bath. Never stored: a save with it becomes a Parts Received.
const WAITING_AREA = "__waiting__";
const TYPE_PILL = {
  "Load In":"p-blue","Extraction":"p-grey","Immersion":"p-grey","Chemistry Check":"p-grey",
  "Bath Fill":"p-green","Bath Disposal":"p-red","Wax Failure":"p-red","Re-Masking":"p-amber",
  "Engineering Review":"p-amber","HCl Top-Up":"p-grey","Water Top-Up":"p-grey",
  "Top-Up":"p-grey","Transfer":"p-blue","Parts Received":"p-purple"
};
const REMOVAL_RESULTS = ["Cleared", "Re-strip", "Re-mask", "Hold"];

// Every event that mentions a set — the ledger filtered down to one job.
function eventsForSet(events, set){
  const want = String(set || "");
  return events.filter(e => setOf(e) === want || (e.items || []).some(i => setOf(i) === want)).slice().sort(byDate);
}

// A wax failure is recorded by which masked AREA failed (e.g. cooling holes vs
// the part body) — just the area name. Reads the simple {wax:[name]} shape, the
// older {wax:[{area}]} shape, and the legacy {waxFailure} field for back-compat.
function waxAreasOf(obj){
  if(obj && Array.isArray(obj.wax)) return obj.wax.map(x => typeof x === "string" ? x : (x && x.area)).filter(Boolean);
  if(obj && obj.waxFailure && obj.waxFailure !== "None") return [obj.waxArea || "Mask"];
  return [];
}
function waxSummary(obj){ return waxAreasOf(obj).join(", "); }
// Areas covered by a re-mask. `null` means "all of them" — the shape legacy
// standalone Re-Masking events used when they named no areas at all.
function remaskAreasOf(e){ return (Array.isArray(e.areas) && e.areas.length) ? e.areas.slice() : null; }
// Re-masking is recorded as part of the re-dip, on the Load In event: `remask`
// is the list of areas that were re-waxed before the parts went back in. The
// legacy per-serial shape ([{serial, areas}]) flattens to the same list.
function loadRemaskAreas(e){
  const r = e && e.remask;
  if(!Array.isArray(r) || !r.length) return [];
  if(typeof r[0] === "string") return r.slice();
  let all = false;
  const out = [];
  r.forEach(x => {
    if(!x || typeof x !== "object") return;
    if(!Array.isArray(x.areas) || !x.areas.length){ all = true; return; }
    x.areas.forEach(a => { if(a && !out.includes(a)) out.push(a); });
  });
  return all ? null : out;
}

/* ---- the backbone: fold the ledger into LOTS ----

   A lot is the unit the shop physically handles: N parts of one set that share
   a place (a bath, or the bench) and a history — cycles run, immersion time
   accumulated, mask areas still open. There are no part identities below that.

     • Add parts    draws parts off the bench (oldest first) and puts a lot in a bath
     • Remove parts takes a quantity out of a lot; if it is not the whole lot,
                    the lot SPLITS and each half carries the same history forward
     • Move         closes the dip and re-opens it in the destination bath, same cycle

   Splitting is what makes counting honest: pull four of six parts as Cleared and
   the two left behind keep their own cycle count and clock, because they are
   still in the tank.                                                          */

const _lotStateMemo = new WeakMap(); // events array -> { now, val }

// The order the ledger consumes bench lots of a set. Parts still in play come
// first (they are why the bench exists), then anything already finished; within
// a rank, whatever has been waiting longest. The Add-parts form previews the
// very same order, so what an operator is shown is what gets recorded.
function benchRank(lot){
  if(lot.eng === "Scrap" || lot.eng === "Return to vendor") return 3;
  if(lot.eng && lot.eng !== "Accepted") return 1;      // held for engineering
  if(lot.result === "Cleared" || lot.eng === "Accepted") return 2;
  return 0;
}
// `prefer` are lot keys the operator pointed at — they tapped that chip on the
// bench, so those parts go in first whatever the default order would say.
function drawOrder(lots, set, prefer){
  const rank = l => (prefer && prefer.indexOf(l.key) >= 0) ? -1 : benchRank(l);
  return lots
    .filter(l => !l.inBath && l.qty > 0 && setOf(l) === String(set || "") && benchRank(l) < 3)
    .sort((a, b) => rank(a) - rank(b) || String(a.since).localeCompare(String(b.since)) || String(a.seq).localeCompare(String(b.seq)));
}
// How a load of `want` parts from `set` will be made up: which bench lots it
// draws on, and how many parts have no history at all (a brand-new set, or more
// parts than the bench holds — both are ordinary and both start at cycle 1).
function planDraw(lots, set, want, prefer){
  const picks = [];
  let left = parseQty(want);
  drawOrder(lots, set, prefer).forEach(lot => {
    if(left <= 0) return;
    const take = Math.min(left, lot.qty);
    left -= take;
    picks.push({ lot, take });
  });
  return { picks, fresh:left };
}
// Lot keys a Load In recorded as its source. Stale keys (the ledger was edited
// underneath them) simply stop matching and the default order takes over.
function loadFromKeys(e){ return (e && Array.isArray(e.from) && e.from.length) ? e.from.slice() : null; }

function deriveLotState(events, nowDT){
  // Every derive* helper walks the ledger through here, so a single render can
  // rebuild it dozens of times. Keyed on the events array identity: any write
  // replaces the array, so a stale entry is never reachable.
  const memoHit = _lotStateMemo.get(events);
  if(memoHit && memoHit.now === nowDT) return memoHit.val;

  const seq = events.slice().sort(byDate);
  const lots = [];      // every lot the ledger ever created, live and finished
  const records = [];   // one dip record per (lot, time in a bath)
  let n = 0;
  // A lot key has to survive a re-derivation: the Remove-parts form writes the
  // key of the lot it is pulling from into the event. Deriving it from the
  // event that created the lot plus a running counter keeps it stable for the
  // same ledger, and simply falls back to set matching when it is not.
  const ref = e => String((e && (e.uid || e.eventId)) || (e && e.id != null ? "id" + e.id : "x"));
  const mkLot = (e, base) => {
    const lot = Object.assign({
      key:ref(e) + "#" + (++n), seq:String(n).padStart(6, "0"),
      set:"", component:"", maskAreas:null,
      qty:0, inBath:false, bath:"", lastBath:"", inDT:null, cycle:0, viaMove:false,
      cycles:0, closedMins:0, wax:[], waxCount:0, reStrips:0,
      result:null, resultDT:null, eng:null, engDT:null,
      everCleared:false, everReStrip:false, decided:false, anomaly:null,
      since:(e && e.datetime) || "", loadEvent:null, recs:[], events:[]
    }, base || {});
    lots.push(lot);
    return lot;
  };
  // Take `take` parts off a lot. Below the full quantity the lot splits and the
  // new half inherits the whole history — same cycles, same clock, same open
  // wax areas — because those parts really have been through all of it.
  const splitLot = (e, lot, take) => {
    if(take >= lot.qty) return lot;
    const child = mkLot(e, {});
    Object.keys(lot).forEach(k => { if(k !== "key" && k !== "seq") child[k] = lot[k]; });
    child.wax = lot.wax.slice(); child.recs = lot.recs.slice(); child.events = lot.events.slice();
    child.qty = take;
    child.waxCount = Math.round(lot.waxCount * take / lot.qty);
    lot.waxCount -= child.waxCount;
    lot.qty -= take;
    return child;
  };
  const touch = (lot, e) => { if(lot.events[lot.events.length - 1] !== e) lot.events = lot.events.concat([e]); };
  // Close the dip a lot is currently in and put it back on the bench.
  const closeDip = (lot, e, result, areas) => {
    const mins = minsBetweenDT(lot.inDT, e.datetime);
    const rec = { key:lot.key, set:lot.set, qty:lot.qty, bath:lot.bath, component:lot.component,
      cycle:lot.cycle, inDT:lot.inDT, outDT:e.datetime, result:result || "", wax:(areas || []).slice(),
      hours:round(hoursBetweenDT(lot.inDT, e.datetime), 2), mins,
      elapsedH:null, elapsedMins:null, open:false, moved:!!lot.viaMove,
      anomaly:lot.anomaly, loadEvent:lot.loadEvent, extractEvent:e };
    records.push(rec);
    lot.recs = lot.recs.concat([rec]);
    lot.closedMins += mins;
    lot.lastBath = lot.bath;
    lot.inBath = false; lot.inDT = null; lot.viaMove = false;
    lot.result = result || ""; lot.resultDT = e.datetime;
    lot.since = e.datetime;
    if(result !== "Moved") lot.decided = true;      // a move is not a verdict on the parts
    if(result === "Cleared") lot.everCleared = true;
    if(result === "Re-strip") lot.everReStrip = true;
    addWax(lot, areas, result);
    return rec;
  };
  // A failed mask area stays open until it is re-waxed. A deliberate "Re-mask"
  // removal opens the same areas but is not counted as a defect — the operator
  // pulled the parts *in order to* re-mask them.
  const addWax = (lot, areas, result) => {
    const list = (areas || []).filter(Boolean);
    if(!list.length) return;
    list.forEach(a => { if(!lot.wax.includes(a)) lot.wax.push(a); });
    if(result !== "Re-mask") lot.waxCount += list.length * lot.qty;
  };
  // Which open lots an extraction / move item is pulling from: the exact lot it
  // named, then the rest of its set, then anything else in that bath.
  const openIn = (bath, it) => {
    const want = setOf(it);
    const here = lots.filter(l => l.inBath && l.qty > 0 && l.bath === (bath || ""));
    // Oldest time-in first; between lots that went in together, the one already
    // carrying the most immersion time. Parts of a set are interchangeable, so
    // something has to break the tie — taking the most-worn parts out first is
    // the reading that keeps the rest furthest from the cycle/hour limits.
    const byAge = here.slice().sort((a, b) => String(a.inDT).localeCompare(String(b.inDT))
      || (b.closedMins - a.closedMins) || String(a.seq).localeCompare(String(b.seq)));
    const named = it && it.lot ? byAge.filter(l => l.key === it.lot) : [];
    const sameSet = want ? byAge.filter(l => setOf(l) === want && named.indexOf(l) < 0) : [];
    const rest = byAge.filter(l => named.indexOf(l) < 0 && sameSet.indexOf(l) < 0);
    return named.concat(sameSet, want ? [] : rest);
  };
  // Bench lots an after-the-fact event (a review, a standalone re-mask) applies
  // to: what is on the bench first, then what is still submerged.
  const benchFor = (set, prefer) => {
    const mine = lots.filter(l => l.qty > 0 && setOf(l) === String(set || "") && benchRank(l) < 3);
    const score = l => (prefer && prefer(l) ? 0 : 1) + (l.inBath ? 2 : 0);
    return mine.sort((a, b) => score(a) - score(b) || String(a.since).localeCompare(String(b.since)) || String(a.seq).localeCompare(String(b.seq)));
  };
  const orphanRec = (e, set, qty, result, areas, why) => {
    const lot = mkLot(e, { set, qty, anomaly:why, since:e.datetime });
    const rec = { key:lot.key, set, qty, bath:e.bath || "", component:"", cycle:0,
      inDT:null, outDT:e.datetime, result:result || "", wax:(areas || []).slice(),
      hours:null, mins:null, elapsedH:null, elapsedMins:null, open:false, moved:false,
      anomaly:why, loadEvent:null, extractEvent:e };
    records.push(rec);
    lot.recs = [rec]; lot.events = [e];
    lot.result = result || ""; lot.resultDT = e.datetime;
    if(result === "Cleared") lot.everCleared = true;
    if(result === "Re-strip") lot.everReStrip = true;
    addWax(lot, areas, result);
    return lot;
  };

  for(const e of seq){
    if(e.type === "Load In"){
      const set = setOf(e), want = qtyOf(e);
      if(!want) continue;
      const remask = loadRemaskAreas(e);
      const maskAreas = Array.isArray(e.maskAreas) ? e.maskAreas.slice() : null;
      const { picks, fresh } = planDraw(lots, set, want, loadFromKeys(e));
      const drawn = picks.map(p => splitLot(e, p.lot, p.take));
      if(fresh > 0) drawn.push(mkLot(e, { set, qty:fresh, since:e.datetime }));
      // Parts of a set on the same cycle are interchangeable, so a load that
      // draws several such lots puts ONE lot in the tank — otherwise the tank
      // fills up with look-alike rows nobody can tell apart. The merged lot
      // carries the LONGEST immersion clock of the lots it came from: the safe
      // reading, because it is the one that trips the hours limit soonest.
      // Lots on different cycles are never merged — the cycle count is what
      // routes parts to engineering.
      const groups = [];
      drawn.forEach(lot => {
        const into = groups.find(g => g.cycles === lot.cycles);
        if(!into){ groups.push(lot); return; }
        into.qty += lot.qty;
        into.closedMins = Math.max(into.closedMins, lot.closedMins);
        into.waxCount += lot.waxCount;
        into.reStrips += lot.reStrips;
        into.everCleared = into.everCleared || lot.everCleared;
        into.everReStrip = into.everReStrip || lot.everReStrip;
        into.decided = into.decided || lot.decided;
        lot.wax.forEach(a => { if(into.wax.indexOf(a) < 0) into.wax.push(a); });
        lot.recs.forEach(r => { if(into.recs.indexOf(r) < 0) into.recs = into.recs.concat([r]); });
        lot.events.forEach(x => { if(into.events.indexOf(x) < 0) into.events = into.events.concat([x]); });
        into.recs.sort((a, b) => String(a.inDT || a.outDT).localeCompare(String(b.inDT || b.outDT)));
        into.events.sort(byDate);
        if(!into.component && lot.component) into.component = lot.component;
        lot.qty = 0;   // absorbed: dropped when the fold returns
      });
      groups.forEach(lot => {
        if(lot.wax.length) lot.wax = remask == null ? [] : lot.wax.filter(a => remask.indexOf(a) < 0);
        if(maskAreas) lot.maskAreas = maskAreas;
        if(e.component) lot.component = e.component;
        if(set) lot.set = set;
        lot.inBath = true; lot.bath = e.bath || ""; lot.lastBath = e.bath || lot.lastBath;
        lot.inDT = e.datetime; lot.since = e.datetime; lot.viaMove = false;
        lot.cycles += 1; lot.cycle = lot.cycles;
        lot.loadEvent = e;
        if(!e.bath) lot.anomaly = "loaded with no bath";
        touch(lot, e);
      });
    } else if(e.type === "Parts Received"){
      const set = setOf(e), want = qtyOf(e);
      if(!want) continue;
      const lot = mkLot(e, { set, qty:want, component:e.component || "", since:e.datetime,
        maskAreas:Array.isArray(e.maskAreas) ? e.maskAreas.slice() : null });
      touch(lot, e);
    } else if(e.type === "Extraction"){
      (e.items || []).forEach(it => {
        let need = qtyOf(it);
        if(!need) return;
        const cands = openIn(e.bath, it);
        while(need > 0 && cands.length){
          const lot = cands.shift();
          const take = Math.min(need, lot.qty);
          need -= take;
          const part = splitLot(e, lot, take);
          touch(part, e);
          closeDip(part, e, it.result || "", waxAreasOf(it));
          if(it.result === "Re-strip") part.reStrips += 1;
        }
        if(need > 0) orphanRec(e, setOf(it) || setOf(e), need, it.result || "", waxAreasOf(it), "removed but was not in the bath");
      });
    } else if(e.type === "Transfer"){
      // Move parts to another bath, or OUT to the waiting area. To a bath the
      // dip continues — same cycle, the clock carries on — so it is closed here
      // and re-opened there, flagged so it is never counted as a second dip.
      const toBath = e.toBath || "";
      const items = (e.items && e.items.length) ? e.items
        : (Array.isArray(e.serials) && e.serials.length ? [{ set:setOf(e), qty:e.serials.length }] : []);
      items.forEach(it => {
        let need = qtyOf(it);
        if(!need) return;
        const cands = openIn(e.bath, it);
        while(need > 0 && cands.length){
          const lot = cands.shift();
          const take = Math.min(need, lot.qty);
          need -= take;
          const part = splitLot(e, lot, take);
          touch(part, e);
          const cycle = part.cycle;
          closeDip(part, e, "Moved", []);
          if(toBath){
            part.inBath = true; part.bath = toBath; part.lastBath = toBath;
            part.inDT = e.datetime; part.cycle = cycle; part.viaMove = true;
            part.result = null; part.resultDT = null; part.loadEvent = e;
          }
        }
        if(need > 0) orphanRec(e, setOf(it) || setOf(e), need, "Moved", [], "moved but was not in a bath");
      });
    } else if(e.type === "Engineering Review"){
      const set = setOf(e), want = qtyOf(e) || 1;
      let need = want;
      const cands = benchFor(set, l => !l.inBath && (l.eng || l.cycles > 0));
      while(need > 0 && cands.length){
        const lot = cands.shift();
        const take = Math.min(need, lot.qty);
        need -= take;
        const part = splitLot(e, lot, take);
        part.eng = e.status || ""; part.engDT = e.datetime; part.since = e.datetime;
        touch(part, e);
      }
      if(need > 0){
        const lot = mkLot(e, { set, qty:need, since:e.datetime, anomaly:"reviewed but not recorded on the floor" });
        lot.eng = e.status || ""; lot.engDT = e.datetime;
        touch(lot, e);
      }
    } else if(e.type === "Re-Masking"){   // legacy: re-masking is part of the re-dip now
      const areas = remaskAreasOf(e);
      let need = qtyOf(e) || 1;
      const cands = benchFor(setOf(e), l => l.wax.length > 0);
      while(need > 0 && cands.length){
        const lot = cands.shift();
        const take = Math.min(need, lot.qty);
        need -= take;
        const part = splitLot(e, lot, take);
        part.wax = areas == null ? [] : part.wax.filter(a => areas.indexOf(a) < 0);
        part.since = e.datetime;
        touch(part, e);
      }
    } else if(e.type === "Wax Failure"){  // legacy: wax loss is found at extraction now
      const areas = waxAreasOf(e);
      let need = qtyOf(e) || 1;
      const cands = benchFor(setOf(e), l => l.inBath || l.cycles > 0);
      while(need > 0 && cands.length){
        const lot = cands.shift();
        const take = Math.min(need, lot.qty);
        need -= take;
        const part = splitLot(e, lot, take);
        addWax(part, areas, "");
        touch(part, e);
      }
    } else if(e.type === "Immersion"){    // legacy self-contained dip
      const set = setOf(e), want = qtyOf(e);
      if(!want) continue;
      const lot = mkLot(e, { set, qty:want, component:e.component || "", since:e.datetime });
      lot.cycles = 1; lot.cycle = 1; lot.bath = e.bath || ""; lot.lastBath = e.bath || "";
      lot.loadEvent = e;
      const mins = minsBetween(e.timeIn, e.timeOut);
      const rec = { key:lot.key, set, qty:want, bath:e.bath || "", component:e.component || "", cycle:1,
        inDT:e.datetime, outDT:e.datetime, result:e.result || "", wax:waxAreasOf(e),
        hours:hrsBetween(e.timeIn, e.timeOut), mins, elapsedH:null, elapsedMins:null,
        open:false, moved:false, anomaly:null, loadEvent:e, extractEvent:e };
      records.push(rec);
      lot.recs = [rec]; lot.closedMins = mins;
      lot.result = e.result || ""; lot.resultDT = e.datetime; lot.decided = true;
      if(e.result === "Cleared") lot.everCleared = true;
      if(e.result === "Re-strip"){ lot.everReStrip = true; lot.reStrips = 1; }
      addWax(lot, waxAreasOf(e), e.result);
      touch(lot, e);
    }
  }

  // The dips still running: one open record per lot sitting in a tank.
  const open = new Map();
  lots.forEach(l => {
    if(!l.inBath || l.qty <= 0) return;
    const rec = { key:l.key, set:l.set, qty:l.qty, bath:l.bath, component:l.component, cycle:l.cycle,
      inDT:l.inDT, outDT:null, result:null, wax:[], hours:null, mins:null,
      elapsedH:round(hoursBetweenDT(l.inDT, nowDT), 2), elapsedMins:minsBetweenDT(l.inDT, nowDT),
      open:true, moved:!!l.viaMove, anomaly:l.anomaly, loadEvent:l.loadEvent, extractEvent:null };
    records.push(rec);
    l.recs = l.recs.concat([rec]);
    open.set(l.key, rec);
  });

  const val = { lots:lots.filter(l => l.qty > 0), records, open };
  _lotStateMemo.set(events, { now:nowDT, val });
  return val;
}

// Kept as the reporting view of the fold: every time a lot sat in a bath.
function deriveImmersions(events, nowDT){
  const { records, open } = deriveLotState(events, nowDT);
  return { records, open };
}
function bathContents(events, nowDT, bath){
  const { open } = deriveLotState(events, nowDT);
  return [...open.values()].filter(r => !bath || r.bath === bath).sort((a, b) => String(a.inDT).localeCompare(String(b.inDT)));
}
// How many parts of a set are on the bench right now, and what they are waiting for.
function benchStock(events, config, nowDT, set){
  const { lots } = deriveLotState(events, nowDT);
  const picks = drawOrder(lots, set);
  const wax = [];
  let qty = 0;
  picks.forEach(l => { qty += l.qty; l.wax.forEach(a => { if(wax.indexOf(a) < 0) wax.push(a); }); });
  return { qty, lots:picks, wax };
}
// What an Add-parts entry will actually draw on — shown in the form before it is
// saved, and the same allocation the ledger performs when it is.
function drawPreview(events, config, nowDT, set, want, prefer){
  const { lots } = deriveLotState(events, nowDT);
  const plan = planDraw(lots, set, want, prefer);
  const wax = [];
  plan.picks.forEach(p => p.lot.wax.forEach(a => { if(wax.indexOf(a) < 0) wax.push(a); }));
  return {
    fresh: plan.fresh,
    drawn: plan.picks.reduce((a, p) => a + p.take, 0),
    picks: plan.picks.map(p => ({ key:p.lot.key, qty:p.take, cycles:p.lot.cycles, wax:p.lot.wax.slice(),
      totalMins:p.lot.closedMins, lastBath:p.lot.lastBath, since:p.lot.since })),
    wax
  };
}
// Reporting status for one dip record: still in a bath = Ongoing, cleared =
// Completed, otherwise the removal reason (Re-strip / Re-mask / Hold / Moved).
function dipStatus(r){
  if(r.open) return "Ongoing";
  if(r.result === "Cleared") return "Completed";
  return r.result || "—";
}

// Where a lot stands right now. A lot is only ever in one state — that is what
// makes it a lot — so a set with four parts cleared and two waiting simply has
// two lots, and each carries its own answer.
function lotStatusFor(lot, config, nowDT){
  const openMins = lot.inBath ? minsBetweenDT(lot.inDT, nowDT) : 0;
  const totalMins = lot.closedMins + openMins;
  const totalH = round(totalMins / 60, 2);
  const base = { cycles:lot.cycles, mins:lot.closedMins, totalMins,
    hours:round(lot.closedMins / 60, 2), totalH, open:lot.inBath };
  if(lot.eng === "Scrap")            return { s:"Scrap",            cls:"p-red",    ...base };
  if(lot.eng === "Return to vendor") return { s:"Returned",         cls:"p-grey",   ...base };
  if(lot.inBath)                     return { s:"In bath",          cls:"p-blue",   ...base };
  // a disposition recorded after the parts came out governs what happens next
  const engAfter = !!lot.engDT && (!lot.resultDT || lot.engDT >= lot.resultDT);
  if(engAfter && lot.eng === "Accepted") return { s:"Accepted",     cls:"p-green",  ...base };
  if(engAfter && lot.eng)                return { s:"→ Engineering",cls:"p-red",    ...base };
  if(lot.result === "Cleared")       return { s:"Cleared",          cls:"p-green",  ...base };
  if(lot.eng === "Accepted")         return { s:"Accepted",         cls:"p-green",  ...base };
  if(lot.eng)                        return { s:"→ Engineering",    cls:"p-red",    ...base };
  if(lot.cycles >= config.maxCycles || totalH >= config.maxHours){
    const why = [];
    if(lot.cycles >= config.maxCycles) why.push(lot.cycles + " cycles ≥ " + config.maxCycles);
    if(totalH >= config.maxHours) why.push(fmtMins(totalMins) + " ≥ " + fmtDur(config.maxHours));
    return { s:"→ Engineering", cls:"p-red", reason:why.join(", "), ...base };
  }
  if(lot.wax.length)                 return { s:"Needs re-mask",    cls:"p-purple", ...base };
  if(lot.cycles > 0)                 return { s:"Awaiting re-strip",cls:"p-amber",  ...base };
  return { s:"Waiting", cls:"p-grey", ...base };
}

const _lotRowsMemo = new WeakMap(); // events array -> { now, cfg, val }
// One row per lot: what the Sets screen, the KPIs and the suggestions all read.
function deriveLots(events, config, nowDT){
  const cfgKey = JSON.stringify(config);
  const memoHit = _lotRowsMemo.get(events);
  if(memoHit && memoHit.now === nowDT && memoHit.cfg === cfgKey) return memoHit.val;
  const { lots } = deriveLotState(events, nowDT);
  const rows = lots.map(l => {
    const st = lotStatusFor(l, config, nowDT);
    return {
      key:l.key, set:l.set, qty:l.qty, component:l.component, maskAreas:l.maskAreas,
      cycles:st.cycles, hours:st.hours, mins:st.mins, totalMins:st.totalMins,
      wax:l.wax.slice(), waxCount:l.waxCount, reStrips:l.reStrips,
      inBath:l.inBath, currentBath:l.inBath ? l.bath : "", lastBath:l.lastBath || "",
      firstPass: l.everCleared && !l.everReStrip,
      decided: l.decided,          // has a real removal result — counts toward first-pass yield
      needsRemask: l.wax.length > 0,
      since:l.since, anomaly:l.anomaly,
      status:st, recs:l.recs, events:l.events
    };
  });
  rows.sort((a, b) => String(a.set).localeCompare(String(b.set), undefined, { numeric:true })
    || String(a.since).localeCompare(String(b.since)) || String(a.key).localeCompare(String(b.key)));
  _lotRowsMemo.set(events, { now:nowDT, cfg:cfgKey, val:rows });
  return rows;
}
function lotByKey(events, config, nowDT, key){ return deriveLots(events, config, nowDT).find(r => r.key === key) || null; }

function deriveBath(events, config, bath, nowDT){
  const evs = events.filter(e => e.bath === bath).slice().sort(byDate);
  const fills = evs.filter(e => e.type === "Bath Fill");
  const lastFill = fills.length ? fills[fills.length - 1] : null;
  const start = lastFill ? lastFill.datetime : null;
  const inCharge = dt => !start || dt >= start;
  const disposal = evs.filter(e => e.type === "Bath Disposal" && inCharge(e.datetime)).slice(-1)[0] || null;
  const end = disposal ? disposal.datetime : nowDT;
  const within = e => inCharge(e.datetime) && e.datetime <= end;
  const chem = evs.filter(e => e.type === "Chemistry Check" && within(e));
  const lastChem = chem.length ? chem[chem.length - 1] : null;

  const { records, open } = deriveLotState(events, nowDT);
  const recTime = r => r.inDT || r.outDT;
  const recs = records.filter(r => r.bath === bath && recTime(r) && inCharge(recTime(r)) && recTime(r) <= end);
  const contents = [...open.values()].filter(r => r.bath === bath).sort((a, b) => String(a.inDT).localeCompare(String(b.inDT)));
  const inTank = contents.reduce((a, r) => a + r.qty, 0);
  const loadH = round(recs.reduce((a, r) => a + (r.qty || 0) * (r.open ? (r.elapsedH || 0) : (r.hours || 0)), 0));
  const parts = recs.filter(r => !r.moved && r.inDT != null).reduce((a, r) => a + (r.qty || 0), 0);
  const wax = recs.filter(r => r.result !== "Re-mask").reduce((a, r) => a + waxAreasOf(r).length * (r.qty || 0), 0)
    + evs.filter(e => within(e) && e.type === "Wax Failure").reduce((a, e) => a + waxAreasOf(e).length * qtyOf(e), 0);
  // Volumes added *since* the charge — top-ups only, so the charge fill itself
  // isn't double-counted (it's shown separately as the charge).
  const sinceCharge = e => within(e) && e !== lastFill;
  const hclAdded = evs.filter(sinceCharge).reduce((a, e) => a + (+e.hclAddedL || 0), 0);
  const waterAdded = evs.filter(sinceCharge).reduce((a, e) => a + (+e.waterAddedL || 0), 0);
  const h3po4Added = evs.filter(sinceCharge).reduce((a, e) => a + (+e.h3po4AddedL || 0), 0);
  const age = lastFill ? daysBetween(lastFill.datetime, end) : "";
  const active = !!lastFill && !disposal;

  const flags = [];
  if(lastChem){
    if(num(lastChem.fePpm) != null && +lastChem.fePpm > config.feMax) flags.push("Iron " + lastChem.fePpm + " ppm > " + config.feMax);
    if(num(lastChem.hclPct) != null && (+lastChem.hclPct < config.hclMin || +lastChem.hclPct > config.hclMax)) flags.push("HCl " + lastChem.hclPct + "% out of band");
    if(num(lastChem.temp) != null && Math.abs(+lastChem.temp - config.tempSet) > config.tempTol) flags.push("Temp " + lastChem.temp + "°C out of band");
  }
  if(active && age !== "" && age >= config.maxBathAge) flags.push("Age " + age + " d ≥ " + config.maxBathAge);
  const capacity = config.bathCapacity || 0;
  const free = capacity ? Math.max(0, capacity - inTank) : null;
  if(active && capacity && inTank > capacity) flags.push("Over capacity " + inTank + "/" + capacity);
  if(disposal && inTank) flags.push(inTank + " part(s) still recorded as inside a disposed bath");

  return { bath, lastFill, disposal, active, chem, lastChem, loadH, parts, wax, hclAdded, waterAdded, h3po4Added, age, flags, contents, inTank, capacity, free };
}
// The baths to show/offer: the ones configured in Settings (always shown), plus
// any extra bath that appears in the event log — so the standard tanks are always
// present, and no bath with real data is ever hidden.
function bathList(events, config){
  const out = (config.baths || []).slice(), seen = new Set(out);
  events.forEach(e => [e.bath, e.toBath].forEach(b => { if(b && b !== WAITING_AREA && !seen.has(b)){ seen.add(b); out.push(b); } }));
  return out;
}
function deriveBaths(events, config, nowDT){ return bathList(events, config).map(b => deriveBath(events, config, b, nowDT)); }

// Parts that are finished with the strip line: nothing more will happen to them.
const TERMINAL_STATUS = { "Cleared":1, "Accepted":1, "Scrap":1, "Returned":1 };
// One row per set: how the whole job is doing, rolled up from its lots.
function deriveSets(events, config, nowDT){
  const map = new Map();
  deriveLots(events, config, nowDT).forEach(r => {
    const k = r.set || "(none)";
    const o = map.get(k) || { set:r.set || "(none)", component:r.component, parts:0, lots:0, decided:0, cleared:0, fp:0, eng:0, inBath:0, waiting:0, reStrips:0, wax:0 };
    o.parts += r.qty; o.lots++;
    if(r.decided) o.decided += r.qty;
    if(r.status.s === "Cleared" || r.status.s === "Accepted") o.cleared += r.qty;
    if(r.firstPass) o.fp += r.qty;
    if(r.status.s === "→ Engineering") o.eng += r.qty;
    if(r.inBath) o.inBath += r.qty; else if(!TERMINAL_STATUS[r.status.s]) o.waiting += r.qty;
    o.reStrips += r.reStrips; o.wax += r.waxCount;
    if(!o.component && r.component) o.component = r.component;
    map.set(k, o);
  });
  return [...map.values()].map(o => ({ ...o, fpy: o.decided ? Math.round(o.fp / o.decided * 100) : 0 }))
    .sort((a, b) => String(a.set).localeCompare(String(b.set), undefined, { numeric:true }));
}

function deriveKpis(events, config, nowDT){
  const rows = deriveLots(events, config, nowDT);
  const { records } = deriveLotState(events, nowDT);
  const sum = (list, f) => list.reduce((a, r) => a + (f ? f(r) : r.qty), 0);
  const byStatus = s => rows.filter(r => r.status.s === s);
  // exclude bath-to-bath move continuations and orphan "was not in the bath"
  // records — neither is a dip that actually happened
  const realDips = records.filter(r => !r.moved && r.inDT != null);
  const reStrip = records.filter(r => r.result === "Re-strip" && r.inDT != null);
  const baths = deriveBaths(events, config, nowDT);
  const decided = rows.filter(r => r.decided);
  const decidedParts = sum(decided);
  return {
    total: sum(rows), sets: new Set(rows.map(r => r.set)).size,
    cleared: sum(byStatus("Cleared")) + sum(byStatus("Accepted")),
    fp: sum(rows.filter(r => r.firstPass)),
    eng: sum(byStatus("→ Engineering")),
    awaiting: sum(byStatus("Awaiting re-strip")), needsRemask: sum(byStatus("Needs re-mask")),
    inBath: sum(rows.filter(r => r.inBath)),
    fpyBase: decidedParts,
    fpy: decidedParts ? Math.round(sum(decided.filter(r => r.firstPass)) / decidedParts * 100) : 0,
    dips: sum(realDips), reStrip: sum(reStrip),
    reStripRate: sum(realDips) ? Math.round(sum(reStrip) / sum(realDips) * 100) : 0,
    wax: sum(rows, r => r.waxCount),
    bathsOver: baths.filter(b => b.active && b.flags.length).length,
    activeBaths: baths.filter(b => b.active).length,
    avgCycles: sum(byStatus("Cleared")) ? round(byStatus("Cleared").reduce((a, r) => a + r.cycles * r.qty, 0) / sum(byStatus("Cleared")), 2) : 0
  };
}

function deriveDefects(events){
  const out = [];
  events.forEach(e => {
    const set = setOf(e);
    if(e.type === "Engineering Review") out.push({ e, kind:"Eng review", detail:e.status || "", set, qty:qtyOf(e), bath:e.bath || "" });
    else if(e.type === "Re-Masking"){ const ar = remaskAreasOf(e); out.push({ e, kind:"Re-mask", detail:"resolves " + (ar ? ar.join(", ") : "wax failure") + (e.notes ? " · " + e.notes : ""), set, qty:qtyOf(e), bath:e.bath || "" }); }
    else if(e.type === "Wax Failure") out.push({ e, kind:"Wax failure", detail:waxSummary(e), set, qty:qtyOf(e), bath:e.bath || "" });
    else if(e.type === "Load In"){
      const ar = loadRemaskAreas(e);
      if(ar === null || (ar && ar.length)) out.push({ e, kind:"Re-mask", detail:"re-masked " + (ar == null ? "all areas" : ar.join(", ")) + " before the re-dip", set, qty:qtyOf(e), bath:e.bath || "" });
    }
    else if(e.type === "Extraction") (e.items || []).forEach(it => {
      const s = setOf(it) || set, q = qtyOf(it);
      // A "Re-mask" removal is intentional re-masking (logged even with no areas), not a wax defect.
      if(it.result === "Re-mask") out.push({ e, kind:"Re-mask", detail:waxSummary(it), set:s, qty:q, bath:e.bath || "" });
      else if(waxAreasOf(it).length) out.push({ e, kind:"Wax failure", detail:waxSummary(it), set:s, qty:q, bath:e.bath || "" });
      if(it.result === "Re-strip") out.push({ e, kind:"Re-strip", detail:"", set:s, qty:q, bath:e.bath || "" });
    });
    else if(e.type === "Immersion"){
      if(waxAreasOf(e).length) out.push({ e, kind:"Wax failure", detail:waxSummary(e), set, qty:qtyOf(e), bath:e.bath || "" });
      if(e.result === "Re-strip") out.push({ e, kind:"Re-strip", detail:"", set, qty:qtyOf(e), bath:e.bath || "" });
    }
  });
  return out.sort((a, b) => byDate(a.e, b.e)).reverse();
}

// Shared by removals and moves: are these quantities actually in the tank, and
// is the time out after the time in? An entry made in the app names the lot it
// is pulling from; one typed by hand or imported may only name the set, so the
// check falls back to the set's total the same way the ledger itself does.
function takeChecks(d, events, config, nowDT, verb){
  const msgs = [];
  const contents = bathContents(events, nowDT, d.bath);
  const left = new Map(contents.map(r => [r.key, r.qty]));
  const pick = it => {
    const named = it && it.lot ? contents.filter(r => r.key === it.lot) : [];
    if(named.length) return named;
    const want = setOf(it);
    return want ? contents.filter(r => setOf(r) === want) : contents.slice();
  };
  (d.items || []).forEach(it => {
    const n = qtyOf(it);
    if(!n) return;
    const cands = pick(it);
    const avail = cands.reduce((a, r) => a + (left.get(r.key) || 0), 0);
    const what = fmtParts(n) + " of set " + (setOf(it) || (cands[0] && cands[0].set) || "—");
    if(!avail){ msgs.push({ level:"amber", text:`${what} is not currently in bath ${d.bath}` }); return; }
    if(n > avail) msgs.push({ level:"red", text:`${what} ${verb}, but only ${avail} are in bath ${d.bath}` });
    let need = n;
    cands.forEach(r => {
      const take = Math.min(need, left.get(r.key) || 0);
      if(take <= 0) return;
      need -= take;
      left.set(r.key, (left.get(r.key) || 0) - take);
      if(r.inDT && d.datetime && d.datetime < r.inDT) msgs.push({ level:"red", text:`${fmtParts(take)} of set ${r.set}: time out is before it went in (${fmtDT(r.inDT)})` });
    });
  });
  return msgs;
}

// Relationship-aware checks: does this draft contradict the current state of
// its bath or its parts? Soft (non-blocking) — guidance, not gates.
function eventWarnings(d, events, config, nowDT, isEdit){
  const w = [], add = (level, msg) => w.push({ level, msg });
  const others = events.filter(e => e.id == null || e.id !== d.id);
  const set = setOf(d), qty = qtyOf(d);

  if(d.type === "Chemistry Check"){
    const fe = num(d.fePpm); if(fe != null && fe > config.feMax) add("red", `Iron ${fe} ppm exceeds limit ${config.feMax} — bath may be spent`);
    const hp = num(d.hclPct); if(hp != null && (hp < config.hclMin || hp > config.hclMax)) add("amber", `Free HCl ${hp}% outside band ${config.hclMin}–${config.hclMax}%`);
    const t = num(d.temp); if(t != null && Math.abs(t - config.tempSet) > config.tempTol) add("amber", `Temp ${t}°C outside ${config.tempSet}±${config.tempTol}°C`);
    if(d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.disposal) add("amber", `Bath ${d.bath} was disposed ${fmtDate(bs.disposal.datetime)} — this check is on an inactive bath`); else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`); }
  }
  if(d.type === "Load In"){
    if(d.bath){
      const bs = deriveBath(others, config, d.bath, nowDT);
      if(bs.disposal) add("red", `Bath ${d.bath} was disposed ${fmtDate(bs.disposal.datetime)} — fill it before loading`);
      else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`);
      else if(bs.flags.length) add("amber", `Bath ${d.bath}: ${bs.flags.join("; ")}`);
      if(bs.capacity && bs.inTank + qty > bs.capacity) add("red", `Bath ${d.bath} would hold ${bs.inTank + qty} parts (capacity ${bs.capacity})`);
    }
    // These read the parts as if they were going in *now* (which bench lots the
    // load draws on, the wax gate, back-dating). Editing a load in place would
    // fire them against its own downstream history, so skip them on edit.
    if(!isEdit && set && qty){
      const stock = benchStock(others, config, nowDT, set);
      const plan = drawPreview(others, config, nowDT, set, qty, loadFromKeys(d));
      if(plan.fresh > 0 && stock.qty > 0) add("amber", `Only ${stock.qty} part(s) of set ${set} are waiting — ${plan.fresh} will be recorded as new`);
      const covered = loadRemaskAreas(d);
      const remaining = covered == null ? [] : plan.wax.filter(a => covered.indexOf(a) < 0);
      if(remaining.length) add("red", `Set ${set} has a wax failure (${remaining.join(", ")}) — re-mask it before re-loading`);
      const rows = deriveLots(others, config, nowDT).filter(r => r.set === set);
      const blocked = rows.filter(r => !r.inBath && (r.status.s === "Scrap" || r.status.s === "Returned"));
      const engHold = rows.filter(r => !r.inBath && r.status.s === "→ Engineering");
      const drawnKeys = plan.picks.map(p => p.key);
      if(engHold.some(r => drawnKeys.indexOf(r.key) >= 0)) add("red", `Part of this load is awaiting engineering review — disposition it before re-stripping`);
      if(blocked.some(r => drawnKeys.indexOf(r.key) >= 0)) add("red", `Part of this load was dispositioned Scrap / Returned — it should not be re-stripped`);
      plan.picks.forEach(p => { if(p.cycles + 1 > config.maxCycles) add("red", `${fmtParts(p.qty)} would be on cycle ${p.cycles + 1} (> max ${config.maxCycles}) — route to engineering`); });
      const evs = eventsForSet(others, set);
      const last = evs.length ? evs[evs.length - 1].datetime : null;
      if(last && d.datetime && d.datetime < last) add("amber", `Set ${set}: this load is dated before its last recorded event (${fmtDT(last)})`);
    }
  }
  if(d.type === "Extraction" && d.bath){
    const bs = deriveBath(others, config, d.bath, nowDT);
    if(bs.disposal) add("red", `Bath ${d.bath} is disposed`);
    takeChecks(d, others, config, nowDT, "taken out").forEach(msg => add(msg.level, msg.text));
  }
  if(d.type === "Bath Disposal" && d.bath){
    const bs = deriveBath(others, config, d.bath, nowDT);
    if(!bs.lastFill) add("amber", `Bath ${d.bath} has no charge to dispose`);
    else if(!bs.active) add("amber", `Bath ${d.bath} is already disposed (${fmtDate(bs.disposal.datetime)})`);
    if(bs.inTank) add("red", `Bath ${d.bath} still holds ${bs.inTank} part(s): ${bs.contents.map(r => r.set + " × " + r.qty).join(", ")} — remove them first`);
  }
  if(d.type === "Bath Fill" && d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.active) add("amber", `Bath ${d.bath} is already active (filled ${fmtDate(bs.lastFill.datetime)}); dispose before re-filling`); }
  if((d.type === "HCl Top-Up" || d.type === "Water Top-Up" || d.type === "Top-Up") && d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.disposal) add("red", `Bath ${d.bath} is disposed`); else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`); }
  if(d.type === "Transfer"){
    const moving = (d.items || []).reduce((a, it) => a + qtyOf(it), 0);
    if(d.bath && d.toBath && d.bath === d.toBath) add("red", "Source and destination are the same bath");
    if(d.toBath && d.toBath !== WAITING_AREA){
      const bd = deriveBath(others, config, d.toBath, nowDT);
      if(bd.disposal) add("red", `Bath ${d.toBath} was disposed ${fmtDate(bd.disposal.datetime)} — fill it before moving parts in`);
      else if(!bd.lastFill) add("amber", `Bath ${d.toBath} has no fill logged`);
      else if(bd.flags.length) add("amber", `Bath ${d.toBath}: ${bd.flags.join("; ")}`);
      if(bd.capacity && bd.inTank + moving > bd.capacity) add("red", `Bath ${d.toBath} would hold ${bd.inTank + moving} parts (capacity ${bd.capacity})`);
    }
    if(d.bath) takeChecks(d, others, config, nowDT, "moved").forEach(msg => add(msg.level, msg.text));
  }
  if(d.type === "Parts Received" && set){
    const rows = deriveLots(others, config, nowDT).filter(r => r.set === set && r.inBath);
    const inBath = rows.reduce((a, r) => a + r.qty, 0);
    if(inBath) add("amber", `${inBath} part(s) of set ${set} are in bath ${rows[0].currentBath} — they can't also be waiting`);
  }
  if(d.type === "Engineering Review" && set){
    const rows = deriveLots(others, config, nowDT).filter(r => r.set === set);
    if(!rows.length) add("amber", `Set ${set} has no parts on the floor`);
    else {
      const flagged = rows.filter(r => !r.inBath && r.status.s === "→ Engineering").reduce((a, r) => a + r.qty, 0);
      const inBath = rows.filter(r => r.inBath).reduce((a, r) => a + r.qty, 0);
      if(!flagged && inBath) add("amber", `${inBath} part(s) of set ${set} are still in a bath`);
      if(flagged && qty > flagged) add("amber", `Only ${flagged} part(s) of set ${set} are flagged for review`);
      const cleared = rows.filter(r => r.status.s === "Cleared").reduce((a, r) => a + r.qty, 0);
      if(!flagged && cleared) add("amber", `${cleared} part(s) of set ${set} have already cleared — a review may be unnecessary`);
    }
  }
  if(d.type === "Re-Masking" && set){
    const rows = deriveLots(others, config, nowDT).filter(r => r.set === set);
    if(rows.some(r => r.inBath) && !rows.some(r => !r.inBath && r.wax.length)) add("red", `Set ${set} is currently in a bath — take the parts out before re-masking`);
    else if(!rows.some(r => r.wax.length)) add("amber", `No unresolved wax failure for set ${set} — re-masking may be unnecessary`);
  }
  return w;
}

// Autofill: a set's last-known component and mask configuration.
function lookupSet(events, set){
  let component = "";
  // date order, not storage order — a backfilled older event must not override
  events.slice().sort(byDate).forEach(e => { if(setOf(e) === String(set || "") && e.component) component = e.component; });
  return { component };
}
// A set's wax configuration: which masked areas its parts actually have (some
// have no cooling holes, etc.). Taken from the most recent Add-parts / waiting
// entry that specified it; defaults to every configured area.
function maskConfigFor(events, config, set){
  let cfg = null;
  events.slice().sort(byDate).forEach(e => {
    if((e.type === "Load In" || e.type === "Parts Received") && setOf(e) === String(set || "") && Array.isArray(e.maskAreas)) cfg = e.maskAreas.slice();
  });
  return cfg != null ? cfg : (config.maskAreas || []);
}
// Mask areas still open across every lot of a set that is out of a bath.
function unresolvedWaxAreas(events, config, nowDT, set){
  const out = [];
  deriveLots(events, config, nowDT).forEach(r => { if(r.set === String(set || "") && !r.inBath) r.wax.forEach(a => { if(out.indexOf(a) < 0) out.push(a); }); });
  return out;
}

// Active, in-band baths ranked by lowest iron — candidates to receive a re-strip.
// A bath with no titration on record ranks LAST: unverified chemistry is not
// a reason to prefer it over a bath measured at low iron.
function healthyBaths(events, config, nowDT){
  const fe = b => { const v = num((b.lastChem || {}).fePpm); return v == null ? Infinity : v; };
  return deriveBaths(events, config, nowDT).filter(b => b.active && !b.flags.length)
    .sort((a, b) => fe(a) - fe(b));
}
function suggestRescueBath(events, config, nowDT, exclude, need){
  const want = parseQty(need) || 1;
  const h = healthyBaths(events, config, nowDT).filter(b => b.bath !== exclude && (b.free === null || b.free >= want));
  if(h.length) return h[0].bath;
  const any = healthyBaths(events, config, nowDT).filter(b => b.bath !== exclude && (b.free === null || b.free > 0));
  return any.length ? any[0].bath : "";
}

// The smart layer: given the current state, what should happen next? Each
// suggestion carries an `action` that prefills the log drawer.
function deriveSuggestions(events, config, nowDT){
  const out = [];
  const rows = deriveLots(events, config, nowDT);
  const baths = deriveBaths(events, config, nowDT);

  baths.forEach(b => {
    if(!b.active){
      if(b.inTank) out.push({ level:"red", icon:"⚠", title:`Bath ${b.bath}: ${b.inTank} part(s) recorded inside a disposed bath`, detail:b.contents.map(r => r.set + " × " + r.qty).join(", "), action:{ type:"extract", bath:b.bath, preselect:b.contents.map(r => r.key) } });
      return;
    }
    const overH = b.contents.filter(r => r.elapsedH >= config.maxHours);
    if(overH.length) out.push({ level:"red", icon:"⏱", title:`Bath ${b.bath}: ${overH.reduce((a, r) => a + r.qty, 0)} part(s) over ${fmtDur(config.maxHours)} immersion`, detail:overH.map(r => r.set + " × " + r.qty).join(", "), action:{ type:"extract", bath:b.bath, preselect:overH.map(r => r.key) } });
    const lc = b.lastChem;
    if(lc && num(lc.fePpm) != null && +lc.fePpm > config.feMax) out.push({ level:"red", icon:"⚗", title:`Bath ${b.bath}: iron ${lc.fePpm} ppm over limit`, detail:"Spent — dispose and refill.", action:{ type:"dispose", bath:b.bath } });
    else if(lc && num(lc.hclPct) != null && +lc.hclPct < config.hclMin) out.push({ level:"amber", icon:"⚗", title:`Bath ${b.bath}: free HCl ${lc.hclPct}% below ${config.hclMin}%`, detail:"Top up acid.", action:{ type:"topup-hcl", bath:b.bath } });
    if(b.age !== "" && b.age >= config.maxBathAge) out.push({ level:"amber", icon:"⌛", title:`Bath ${b.bath}: ${b.age} days old (≥ ${config.maxBathAge})`, detail:"Scheduled change due.", action:{ type:"dispose", bath:b.bath } });
    const lastChemDT = b.chem.length ? b.chem[b.chem.length - 1].datetime : b.lastFill.datetime;
    const dd = daysBetween(lastChemDT, nowDT);
    const chemDue = config.chemEveryDays == null ? 2 : config.chemEveryDays;
    if(chemDue > 0 && dd !== "" && dd >= chemDue) out.push({ level:"info", icon:"⚗", title:`Bath ${b.bath}: no chemistry check in ${dd} days`, detail:"Log a titration.", action:{ type:"chem", bath:b.bath } });
  });

  // Assign rescue baths capacity-aware: every part consumes a free slot, so a
  // set is never suggested into a bath that cannot actually hold it.
  const healthy = healthyBaths(events, config, nowDT);
  const freeLeft = new Map(healthy.map(b => [b.bath, b.free === null ? Infinity : b.free]));
  const takeRescue = (exclude, need) => {
    const h = healthy.find(b => b.bath !== exclude && freeLeft.get(b.bath) >= need)
      || healthy.find(b => b.bath !== exclude && freeLeft.get(b.bath) > 0);
    if(!h) return "";
    freeLeft.set(h.bath, Math.max(0, freeLeft.get(h.bath) - need));
    return h.bath;
  };
  const groups = new Map();
  rows.forEach(r => {
    if(r.status.s !== "Awaiting re-strip" && r.status.s !== "Needs re-mask") return;
    const rb = takeRescue(r.lastBath, r.qty);
    const key = r.set + "|" + rb;
    const g = groups.get(key) || { set:r.set, component:r.component, bath:rb, qty:0, remask:0, wax:[], from:[] };
    g.qty += r.qty; g.from.push(r.key);
    if(r.status.s === "Needs re-mask"){ g.remask += r.qty; r.wax.forEach(a => { if(g.wax.indexOf(a) < 0) g.wax.push(a); }); }
    groups.set(key, g);
  });
  groups.forEach(g => out.push({ level:"amber", icon:"↻", title:`Re-load ${fmtParts(g.qty)} of set ${g.set || "—"}`,
    detail:(g.bath ? "→ bath " + g.bath : "no healthy bath available") + (g.remask ? " · re-mask " + g.remask + " first (" + g.wax.join(", ") + ")" : ""),
    action:{ type:"reload", set:g.set, qty:g.qty, bath:g.bath, component:g.component, from:g.from } }));

  const engBySet = new Map();
  rows.filter(r => r.status.s === "→ Engineering" && !r.inBath).forEach(r => {
    const g = engBySet.get(r.set) || { set:r.set, qty:0, cycles:0, totalMins:0 };
    g.qty += r.qty; g.cycles = Math.max(g.cycles, r.cycles); g.totalMins = Math.max(g.totalMins, r.totalMins);
    engBySet.set(r.set, g);
  });
  engBySet.forEach(g => out.push({ level:"red", icon:"⚑", title:`Engineering review: ${fmtParts(g.qty)} of set ${g.set || "—"}`,
    detail:`${g.cycles} cycles${g.totalMins ? ", " + fmtMins(g.totalMins) : ""}`,
    action:{ type:"engineering", set:g.set, qty:g.qty } }));

  const rank = { red:0, amber:1, info:2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level]);
}

// The waiting area: every lot physically out of a tank but not finished — parts
// that came out awaiting another strip, blocked needing a re-mask, or flagged
// for engineering, plus sets parked on receipt. Newest first.
const WAIT_KIND = { "Awaiting re-strip":"awaiting re-strip", "Needs re-mask":"needs re-mask", "→ Engineering":"review", "Waiting":"received" };
function waitingLots(events, config, nowDT){
  return deriveLots(events, config, nowDT)
    .filter(r => !r.inBath && WAIT_KIND[r.status.s])
    .map(r => ({ key:r.key, set:r.set, qty:r.qty, component:r.component, kind:WAIT_KIND[r.status.s],
      lastBath:r.lastBath || "", datetime:r.since || "", cycles:r.cycles, wax:r.wax.slice(), status:r.status }))
    .sort((a, b) => String(b.datetime).localeCompare(String(a.datetime)) || String(a.set).localeCompare(String(b.set)));
}
// Parked sets: received at the bench and not yet dipped at all.
function parkedLots(events, config, nowDT){ return waitingLots(events, config, nowDT).filter(r => r.kind === "received"); }

/* ----------------------------- storage -------------------------------- */
function openDB(){ return new Promise((res, rej) => {
  const r = indexedDB.open(DB_NAME, DB_VER);
  r.onupgradeneeded = e => { const d = e.target.result;
    if(!d.objectStoreNames.contains("events")) d.createObjectStore("events", { keyPath:"id", autoIncrement:true });
    if(!d.objectStoreNames.contains("config")) d.createObjectStore("config", { keyPath:"k" });
    // v2: work recorded while the network was down, waiting to reach the server.
    if(!d.objectStoreNames.contains("outbox")) d.createObjectStore("outbox", { keyPath:"seq", autoIncrement:true }); };
  r.onsuccess = e => { db = e.target.result; res(); };
  r.onerror = e => rej(e.target.error);
}); }
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function getAll(store){ return new Promise((res, rej) => { const r = tx(store, "readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
function putRec(store, obj){ return new Promise((res, rej) => { const r = tx(store, "readwrite").put(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function delRec(store, key){ return new Promise((res, rej) => { const r = tx(store, "readwrite").delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function clearStore(store){ return new Promise((res, rej) => { const r = tx(store, "readwrite").clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
// Recording an event and queueing its upload must be one atomic write. As two
// separate transactions there is a window — widened by the loadAll() between
// them — where a crash leaves the event on disk with no outbox row; the next
// sync then replaces the local mirror with a server snapshot that never
// received it, and the operator's saved entry disappears with no error.
function putEventQueued(obj, op){
  return new Promise((res, rej) => {
    const t = db.transaction(["events", "outbox"], "readwrite");
    let id = null;
    const r = t.objectStore("events").put(obj);
    r.onsuccess = () => { id = r.result; };
    if(op) t.objectStore("outbox").put({ op });
    t.oncomplete = () => res(id);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}

async function loadAll(){
  EVENTS = (await getAll("events")).sort(byDate);
  CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));

}
// Accept only known keys, coerced to the type the default declares — an imported
// backup must not introduce junk settings or reach the prototype chain.
function sanitizeConfig(raw){
  const out = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  if(!raw || typeof raw !== "object") return out;
  Object.keys(DEFAULT_CONFIG).forEach(k => {
    const v = raw[k];
    if(Array.isArray(DEFAULT_CONFIG[k])){ if(Array.isArray(v)) out[k] = v.map(x => String(x)).filter(Boolean); }
    else { const n = num(v); if(n != null) out[k] = n; }
  });
  return out;
}

/* Every one of these is a no-op offline, so the local-only mode keeps the
 * exact behaviour it had before there was a server. */

function newUid(){
  if(typeof crypto !== "undefined" && crypto.randomUUID) return crypto.randomUUID();
  return "u" + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

// The local mirror carries an auto-increment `id` that is meaningless to anyone
// else; `uid` is what identifies an event across machines.
function forServer(obj){ const o = Object.assign({}, obj); delete o.id; return o; }

function cachedRole(){ try { return localStorage.getItem("sh_role"); } catch(e){ return null; } }
function cacheRole(r){ try { r ? localStorage.setItem("sh_role", r) : localStorage.removeItem("sh_role"); } catch(e){ /* private mode */ } }

async function api(path, opts){
  const r = await fetch(path, Object.assign({
    headers: { "Content-Type":"application/json" }, credentials: "same-origin"
  }, opts || {}));
  let body = null;
  try { body = await r.json(); } catch(e){ /* non-JSON error page */ }
  if(!r.ok){
    const err = new Error((body && body.error) || ("Request failed (" + r.status + ")"));
    err.status = r.status;
    if(body && Number.isInteger(body.opIndex)) err.opIndex = body.opIndex;
    throw err;
  }
  return body;
}

// The exact server answer the local mirror was last built from. The poll runs
// every 20 seconds and almost always finds the same log it found last time;
// comparing first means an unchanged answer costs nothing instead of clearing
// and re-writing every event — and, more importantly, leaves the DOM alone.
let adoptedSnapshot = null;
function serverSnapshot(state){
  try { return JSON.stringify([state.events || [], state.config || {}]); }
  catch(e){ return null; }   // unstringifiable -> always treat as changed
}
// Anything that rewrites the mirror behind adoptServerState()'s back must say
// so, or the next matching snapshot would be skipped over a stale mirror.
function invalidateAdoptedSnapshot(){ adoptedSnapshot = null; }

// Replace the local mirror with exactly what the server holds.
// Returns true when the mirror actually changed.
async function adoptServerState(state){
  if(state.role){ ROLE = state.role; cacheRole(ROLE); }
  const snap = serverSnapshot(state);
  if(snap != null && snap === adoptedSnapshot) return false;
  await clearStore("events");
  for(const ev of (state.events || [])) await putRec("events", forServer(ev));
  await clearStore("config");
  const cfg = sanitizeConfig(state.config || {});
  for(const k of Object.keys(cfg)) await putRec("config", { k, v:cfg[k] });
  await loadAll();
  adoptedSnapshot = snap;
  return true;
}

let syncTimer = null;
function scheduleSync(delay = 250){
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(() => { syncTimer = null; syncNow(); }, delay);
}
async function queueOp(op){
  if(!ONLINE) return;
  await putRec("outbox", { op });
  // Debounced: a config restore writes every key and a whole import writes
  // hundreds of events. Those should be one upload sequence, not hundreds.
  scheduleSync();
}

let syncing = false;
let syncAgain = false;
async function syncNow(){
  if(!ONLINE || !ROLE) return;
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  syncAgain = false;
  SYNC_STATE = "syncing"; paintSync();
  let rejectedNote = "";
  let changed = false;
  try {
    while(ROLE){
      const queued = (await getAll("outbox")).sort((a, b) => a.seq - b.seq);
      if(!queued.length){
        const state = await api("/api/sync");
        if(await adoptServerState(state)) changed = true;
        // A save may have landed while the GET and mirror replacement were in
        // flight. Its outbox row is authoritative; loop and upload it now.
        if((await getAll("outbox")).length) continue;
        break;
      }

      // The API accepts at most 500 operations. Process large offline queues in
      // bounded chunks instead of submitting one oversized request and losing it.
      const batch = queued.slice(0, 500);
      let state;
      try {
        state = await api("/api/sync", { method:"POST", body: JSON.stringify({ ops: batch.map(q => q.op) }) });
      } catch(err){
        // The server validates the batch before applying it and identifies the
        // rejected operation. Remove only that row; every valid row remains and
        // is retried in the next pass.
        if(err.status >= 400 && err.status < 500 && Number.isInteger(err.opIndex) && batch[err.opIndex]){
          await delRec("outbox", batch[err.opIndex].seq);
          rejectedNote = err.message;
          flash("One queued change was rejected: " + err.message);
          continue;
        }
        throw err;
      }

      // Delete exactly what this request submitted. clearStore() is unsafe: a
      // second save can append a row while fetch is in flight.
      for(const q of batch) await delRec("outbox", q.seq);

      // Do not replace the mirror until every pending local operation has been
      // accepted. Otherwise the server snapshot would temporarily erase later
      // offline work from the UI.
      if((await getAll("outbox")).length) continue;
      if(await adoptServerState(state)) changed = true;
      if((await getAll("outbox")).length) continue;
      break;
    }
    SYNC_STATE = rejectedNote ? "error" : "idle";
    SYNC_NOTE = rejectedNote;
  } catch(err){
    if(err.status === 401){
      // The session expired. Keep the queued work — it will go up after login.
      ROLE = null; cacheRole(null); syncing = false; SYNC_STATE = "error";
      render(); return;
    }
    if(err.status >= 400 && err.status < 500){
      // Preserve the queue when the server cannot identify one bad operation.
      // Losing valid shop-floor work is worse than leaving a visible retry error.
      SYNC_STATE = "error"; SYNC_NOTE = err.message;
      flash("Not saved to the server: " + err.message);
    } else {
      SYNC_STATE = "offline";
      SYNC_NOTE = "Working offline — your entries are saved here and will upload when the network returns.";
    }
  }
  syncing = false;
  paintSync();
  // Only repaint when the shared log actually moved. A poll that finds nothing
  // new has to be invisible: re-rendering on a timer was throwing away the
  // operator's scroll position every 20 seconds, mid-job.
  if((changed || pendingRepaint) && typeof render === "function" && SYNC_STATE !== "syncing") repaintFromSync();
  // A debounced call may have fired while this pass was busy. Never leave its
  // outbox rows waiting for the 20-second poll.
  try { if(syncAgain || (await getAll("outbox")).length) scheduleSync(0); } catch(e){ /* database is closing */ }
}

async function addEvent(obj){
  obj.datetime = obj.datetime || nowLocalDT();
  obj.uid = obj.uid || newUid();
  const baseId = nextEventId(obj.datetime, EVENTS);
  // Daily counters are local and two shared clients can choose the same number.
  // Keep the readable counter, plus a short UID suffix, so the ledger reference
  // remains unique without needing an online round trip.
  obj.eventId = obj.eventId || (ONLINE ? baseId + "-" + String(obj.uid).replace(/-/g, "").slice(0, 12).toUpperCase() : baseId);
  // forServer() only strips the local autoincrement id, so the outbox payload is
  // known before the write and both rows can go in together.
  const op = ONLINE ? { op:"put", uid:obj.uid, event:forServer(obj) } : null;
  obj.id = await putEventQueued(obj, op);
  await loadAll();
  if(op) scheduleSync();
}
async function updateEvent(obj){
  if(ONLINE && !isAdmin()) throw new Error("Only an admin can edit an event.");
  obj.uid = obj.uid || newUid();
  await putRec("events", obj);
  await loadAll();
  await queueOp({ op:"put", uid:obj.uid, event:forServer(obj) });
}
async function removeEvent(id){
  if(ONLINE && !isAdmin()) throw new Error("Only an admin can delete an event.");
  const gone = EVENTS.find(e => e.id === id);
  await delRec("events", id);
  await loadAll();
  if(gone && gone.uid) await queueOp({ op:"del", uid:gone.uid });
}

const $ = (s, el = document) => el.querySelector(s);

const tableSort = { lots:{ key:null, dir:1 }, events:{ key:null, dir:1 } };
function toggleSort(table, key){ const st = tableSort[table]; if(st.key === key) st.dir = -st.dir; else { st.key = key; st.dir = 1; } render(); }

    title:titleText || ("Sort by " + label), "aria-sort":active ? (st.dir > 0 ? "ascending" : "descending") : "none",

  }, [label, cel("span", { class:"sort-ind" }, active ? (st.dir > 0 ? " ▲" : " ▼") : "")]);

function applySort(table, rows, acc){
  const st = tableSort[table]; if(!st.key || !acc[st.key]) return rows;   // no key → keep the view's natural order
  const f = acc[st.key];
  return rows.slice().sort((a, b) => {
    const va = f(a), vb = f(b);
    if(typeof va === "number" && typeof vb === "number") return (va - vb) * st.dir;
    return String(va == null ? "" : va).localeCompare(String(vb == null ? "" : vb), undefined, { numeric:true, sensitivity:"base" }) * st.dir;
  });

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){ const e = document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function svgText(x, y, s, anchor){ const t = svgEl("text", { x, y, "font-size":9, fill:"#8c8c8c", "text-anchor":anchor || "start" }); t.textContent = s; return t; }
function trendChart(points, opt = {}){
  const w = opt.w || 260, h = opt.h || 92, mini = !!opt.mini;
  const padL = mini ? 4 : 30, padR = mini ? 4 : 8, padT = mini ? 4 : 10, padB = mini ? 4 : 16;
  const fmtY = opt.fmtY || (v => String(round(v, 1)));
  const ys = points.map(p => p.y).filter(Number.isFinite);
  let hi = Math.max(...ys, opt.limit != null ? opt.limit : -Infinity, opt.band ? opt.band.hi : -Infinity);
  let lo = Math.min(...ys, opt.band ? opt.band.lo : Infinity);
  if(!Number.isFinite(hi)) hi = 1; if(!Number.isFinite(lo)) lo = 0;
  lo = Math.min(lo, hi); if(hi === lo) hi = lo + 1;
  const span = hi - lo; hi += span * 0.12; lo -= span * 0.08;
  const X = i => padL + (points.length <= 1 ? (w - padL - padR) / 2 : i * (w - padL - padR) / (points.length - 1));
  const Y = v => padT + (h - padT - padB) * (1 - (v - lo) / (hi - lo));
  const svg = svgEl("svg", { class:"chart", width:"100%", height:h, viewBox:`0 0 ${w} ${h}`, preserveAspectRatio:"none" });
  if(opt.band) svg.appendChild(svgEl("rect", { x:padL, y:Y(opt.band.hi), width:w - padL - padR, height:Math.max(0, Y(opt.band.lo) - Y(opt.band.hi)), fill:"rgba(15,118,110,.14)" }));
  if(opt.limit != null){ const ly = Y(opt.limit); svg.appendChild(svgEl("line", { x1:padL, y1:ly, x2:w - padR, y2:ly, stroke:"#dc2626", "stroke-dasharray":"4 3", "stroke-width":1 })); }
  if(!mini){ svg.appendChild(svgText(padL - 4, Y(hi - span * 0.05) + 3, fmtY(hi - span * 0.05), "end")); svg.appendChild(svgText(padL - 4, Y(lo + span * 0.05), fmtY(lo + span * 0.05), "end")); }
  const d = points.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  svg.appendChild(svgEl("path", { d, fill:"none", stroke:opt.color || "#2563eb", "stroke-width":2, "stroke-linejoin":"round" }));
  if(!mini) points.forEach((p, i) => { const over = opt.limit != null && p.y > opt.limit; svg.appendChild(svgEl("circle", { cx:X(i), cy:Y(p.y), r:2.6, fill:over ? "#dc2626" : (opt.color || "#2563eb") })); });
  return svg;
}

/* presentation helpers (DOM-free, app layer) */
function setLabel(e){ const s = setOf(e); return s ? "set " + s : "set —"; }
function eventDetail(e){
  const d = [];
  if(e.type === "Chemistry Check") d.push(`HCl ${fmtNum(e.hclPct)}%, Fe ${fmtNum(e.fePpm)} ppm, ${fmtNum(e.temp)}°C`);
  if(e.type === "Load In") d.push(`${fmtParts(qtyOf(e))} of ${setLabel(e)} in${e.bath ? " → " + e.bath : ""}`);
  if(e.type === "Extraction"){
    const it = e.items || [];
    const by = r => it.filter(i => i.result === r).reduce((a, i) => a + qtyOf(i), 0);
    const parts = []; REMOVAL_RESULTS.forEach(r => { const n = by(r); if(n) parts.push(n + " " + r.toLowerCase()); });
    const wax = it.filter(i => i.result !== "Re-mask" && waxAreasOf(i).length).reduce((a, i) => a + qtyOf(i), 0);
    const sets = [...new Set(it.map(i => setOf(i)).filter(Boolean))];
    d.push(`${fmtParts(it.reduce((a, i) => a + qtyOf(i), 0))} out${e.bath ? " ← " + e.bath : ""}${sets.length ? " (set " + sets.join(", ") + ")" : ""} · ${parts.join(", ")}${wax ? ` · ${wax} wax` : ""}`);
  }

  if(e.type === "Bath Fill") d.push(`HCl ${e.hclAddedL || 0} L · H₂O ${e.waterAddedL || 0} L · H₃PO₄ ${e.h3po4AddedL || 0} L`);
  if(e.type === "HCl Top-Up") d.push(`+${e.hclAddedL || 0} L HCl`);
  if(e.type === "Water Top-Up") d.push(`+${e.waterAddedL || 0} L water`);
  if(e.type === "Top-Up"){ const p = []; if(+e.hclAddedL) p.push(`+${e.hclAddedL} L HCl`); if(+e.waterAddedL) p.push(`+${e.waterAddedL} L water`); if(+e.h3po4AddedL) p.push(`+${e.h3po4AddedL} L H₃PO₄`); d.push(p.join(" · ") || "top-up"); }
  if(e.type === "Transfer"){
    const it = e.items || [];
    const sets = [...new Set(it.map(i => setOf(i)).filter(Boolean))];
    d.push(`${fmtParts(it.reduce((a, i) => a + qtyOf(i), 0) || qtyOf(e))} moved${e.bath ? " " + e.bath : ""} → ${e.toBath || "waiting area"}${sets.length ? " (set " + sets.join(", ") + ")" : ""}`);
  }
  if(e.type === "Parts Received") d.push(`${fmtParts(qtyOf(e))} of ${setLabel(e)} → waiting area`);
  if(e.type === "Wax Failure") d.push(waxSummary(e));
  if(e.type === "Engineering Review") d.push(`${fmtParts(qtyOf(e))} of ${setLabel(e)} — ${e.status || ""}`);

// The same event, told from one lot's point of view — what happened to *these*

function eventDetailForLot(e, lot){

// A repaint nobody asked for — someone else's work arriving on the poll — must
// not move the page under the operator's hands. Hold the scroll positions across
// the rebuild, and never tear down a drawer being filled in: that would drop the
// caret and any count half-typed into a form.
function renderInPlace(){
  const qsa = sel => (document.querySelectorAll ? [].slice.call(document.querySelectorAll(sel)) : []);
  const doc = document.documentElement || {};
  const x = (typeof window !== "undefined" && window.scrollX) || doc.scrollLeft || 0;
  const y = (typeof window !== "undefined" && window.scrollY) || doc.scrollTop || 0;
  const kept = qsa(".tbl-wrap").map(el => ({ top:el.scrollTop, left:el.scrollLeft }));

  render({ keepDrawer: drawerOpen && formType != null });

  // The wrappers are fresh nodes; the view is the same, so match them by position.
  qsa(".tbl-wrap").forEach((el, i) => { const p = kept[i]; if(p){ el.scrollTop = p.top; el.scrollLeft = p.left; } });
  if(typeof window !== "undefined" && window.scrollTo && (x || y)) window.scrollTo(x, y);
}

// Rebuilding the view under a field someone is filling in would take their focus

// dropped: it lands the moment they leave the control, or on the next poll.
let pendingRepaint = false;
function busyWithInput(){
  const a = document.activeElement;
  if(!a || !a.tagName) return false;
  if(["INPUT", "SELECT", "TEXTAREA"].indexOf(String(a.tagName).toUpperCase()) < 0) return false;
  return String(a.type || "").toLowerCase() !== "button";
}
function repaintFromSync(){
  pendingRepaint = true;
  // A modal owns the screen; repainting behind it is only ever a surprise.
  const modal = document.querySelector && document.querySelector("#modalRoot");
  if(busyWithInput() || (modal && modal.children && modal.children.length)) return;
  pendingRepaint = false;

}

function draftRec(){ const rec = {}; Object.keys(formData).forEach(k => { if(!k.startsWith("_")) rec[k] = formData[k]; }); return rec; }
