<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stripping Historian — Process Engineering Log</title>
<style>
  *{box-sizing:border-box}
  :root{
    --ink:#172832; --muted:#52636f; --faint:#687783; --line:#dbe3e8; --line-2:#edf1f3;
    --bg:#f4f7f9; --panel:#ffffff; --elev:#f0f4f6;
    --brand:#102632; --brand-2:#14313f; --brand-ink:#f7fafb;
    --accent:#0f766e; --accent-2:#0b625d; --accent-weak:#e7f3f1; --accent-ink:#0b625d; --on-accent:#ffffff;
    --green:#18794e; --green-bg:#e8f5ee; --amber:#946200; --amber-bg:#fff4ce;
    --red:#b42318; --red-bg:#fcebea; --blue:#2458a6; --blue-bg:#e7effb; --grey-bg:#eef2f4;
    --focus:#0f766e; --r:9px; --r-s:7px; --r-xs:5px;
    --sh-sm:0 1px 2px rgba(17,38,50,.06); --sh:0 5px 18px rgba(17,38,50,.09); --sh-lg:0 22px 58px rgba(17,38,50,.22);
  }
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;color-scheme:light;font-variant-numeric:tabular-nums}

  #app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  #sidebar{background:var(--brand);color:var(--brand-ink);border-right:1px solid #0b1d26;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:16px 12px 14px;gap:4px}
  .brand{display:flex;align-items:center;gap:11px;padding:4px 8px 18px}
  .brand .logo{width:34px;height:34px;border-radius:8px;background:#22b89d;display:flex;align-items:center;justify-content:center;font-weight:800;color:#082d29;font-size:13px;letter-spacing:-.4px;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
  .brand b{font-size:14.5px;font-weight:700;letter-spacing:.1px;display:block;line-height:1.15;color:#fff}
  .brand small{display:block;color:#9fb2bd;font-size:10.5px;margin-top:3px;text-transform:uppercase;letter-spacing:.45px}
  #nav{display:flex;flex-direction:column;gap:2px}
  .navlink{display:flex;align-items:center;gap:10px;min-height:42px;padding:10px 12px;border-radius:var(--r-s);color:#c4d0d7;cursor:pointer;font-size:13.5px;font-weight:560;border:none;background:none;text-align:left;width:100%}
  .navlink .ic{width:18px;text-align:center;opacity:.85;font-size:13px;color:#90a6b1}
  .navlink:hover{background:rgba(255,255,255,.07);color:#fff}
  .navlink.on{background:rgba(34,184,157,.14);color:#fff;box-shadow:inset 3px 0 0 #22b89d}
  .navlink.on .ic{color:#49d4ba;opacity:1}
  .navlink .badge{margin-left:auto;min-width:18px;text-align:center;padding:1px 6px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
  .navlink .badge.info{background:#22b89d;color:#082d29}
  .side-sp{flex:1}
  .side-log{min-height:44px;margin:8px 2px 12px;padding:11px;border-radius:var(--r-s);background:#22b89d;color:#082d29;border:none;cursor:pointer;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 14px rgba(0,0,0,.16)}
  .side-log:hover{background:#34c7ac}
  .side-foot{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:2px}
  .side-foot button{min-width:0;min-height:38px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.12);color:#c4d0d7;border-radius:var(--r-xs);padding:7px 6px;font-size:11.5px;cursor:pointer}
  .side-foot button:hover{background:rgba(255,255,255,.10);color:#fff;border-color:rgba(255,255,255,.22)}
  .side-foot button:disabled{opacity:.38;cursor:not-allowed;background:rgba(255,255,255,.025)}
  #signOutBtn{grid-column:1 / -1}

  #content{display:flex;flex-direction:column;min-width:0}
  #topbar{position:sticky;top:0;z-index:20;min-height:64px;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:8px 20px;backdrop-filter:blur(8px)}
  .page-head{min-width:210px;line-height:1.2}
  #topbar h1{font-size:17px;margin:0;font-weight:720;letter-spacing:-.2px}
  #pageSubtitle{font-size:11.5px;color:var(--muted);margin:4px 0 0}
  .search{margin-left:auto}
  .search input{width:286px;height:36px;padding:8px 13px;border:1px solid var(--line);border-radius:18px;background:var(--elev);font-size:13px}
  .sync-pill{display:inline-flex;align-items:center;gap:7px;min-height:30px;padding:5px 10px;border-radius:999px;border:1px solid transparent;font-size:11.5px;font-weight:650;white-space:nowrap}
  .sync-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
  .sync-idle{background:var(--green-bg);color:var(--green);border-color:#cce8d8}
  .sync-syncing{background:var(--blue-bg);color:var(--blue);border-color:#cadbf4}
  .sync-offline{background:var(--amber-bg);color:var(--amber);border-color:#eadcaa}
  .sync-error{background:var(--red-bg);color:var(--red);border-color:#edcac7}
  .kbd{display:inline-block;border:1px solid #d0d0d0;border-radius:5px;padding:0 5px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--elev);color:var(--muted);cursor:pointer;font-size:14px;font-weight:700;flex:none;line-height:1}
  .iconbtn:hover{background:#ececec;color:var(--ink)} .iconbtn:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
  #main{padding:24px 28px 34px;flex:1;min-width:0;max-width:1440px;width:100%;margin:0 auto}

  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);font-family:inherit}
  .login-card{max-width:390px;width:100%;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:12px;padding:26px;box-shadow:0 18px 45px rgba(17,38,50,.12)}
  .login-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .login-mark{width:38px;height:38px;border-radius:9px;background:var(--brand);color:#49d4ba;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
  .login-card h1{margin:0;font-size:19px;letter-spacing:-.25px}.login-card .login-sub{color:var(--muted);font-size:12.5px;margin-top:2px}
  .login-error{color:var(--red);font-size:12.5px;min-height:20px;margin:7px 0}
  .login-submit{width:100%;min-height:42px;font-size:14px}
  .login-footnote{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2);color:var(--faint);font-size:11px;text-align:center;text-transform:uppercase;letter-spacing:.55px}

  .attn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--red-bg);color:var(--red);border:1px solid #f3c4c0;border-radius:var(--r);padding:9px 14px;margin-bottom:16px;font-size:13px}
  .attn b{font-weight:700} .attn .sp{flex:1}

  h2.sec{font-size:15px;margin:0 0 16px;font-weight:700;letter-spacing:-.1px}
  h3.sub{font-size:11.5px;margin:24px 0 10px;color:#40535f;font-weight:750;text-transform:uppercase;letter-spacing:.8px}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh-sm)}
  .linkish{color:var(--accent-ink);cursor:pointer;font-weight:500} .linkish:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)}
  .empty{min-height:220px;text-align:center;color:var(--muted);padding:44px 20px;background:var(--panel);border:1px dashed #cdd8de;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center} .flagok{color:var(--green)}
  .empty.compact{min-height:150px;padding:32px 20px}
  .filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:10px;box-shadow:var(--sh-sm)}
  .filterbar select{width:auto;min-width:132px}.filterbar input{width:230px;flex:0 1 280px}.filterbar .filter-count{margin-left:auto;padding:0 6px;color:var(--muted);font-size:12px;white-space:nowrap}
  .settings-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.85fr);gap:16px;align-items:start}
  .settings-stack{display:grid;gap:16px}
  .settings-grid .card{margin:0;max-width:none}
  .setting-note{font-size:12px;color:var(--muted);padding-top:2px}
  .danger-zone{border-color:#edcac7;background:#fffdfd}
  .danger-zone h2.sec{color:#7f1d1d}

  .btn{min-height:36px;background:#ffffff;border:1px solid #d4dde2;color:var(--ink);padding:8px 13px;border-radius:var(--r-s);cursor:pointer;font-size:13px;font-weight:620}
  .btn:hover{background:#f3f6f7;border-color:#bdcbd2}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.sm{min-height:32px;padding:6px 10px;font-size:12px}
  .btn.danger{color:var(--red);border-color:#f0c4c0;background:#fff}
  .btn.danger:hover{background:#fef2f2}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  label.f{display:block;font-size:12.5px;color:#40535f;margin:0 0 6px;font-weight:650}
  input,select,textarea{width:100%;min-height:40px;padding:9px 11px;border:1px solid #cfd9de;border-radius:var(--r-s);font-size:13.5px;font-family:inherit;background:#ffffff;color:var(--ink)}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(15,118,110,.17)}
  input:disabled,select:disabled,textarea:disabled{background:#eef2f4;color:#63727d;cursor:not-allowed}
  ::placeholder{color:var(--faint)}
  .field{margin-bottom:14px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:13px}

  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:68vh;background:var(--panel);box-shadow:var(--sh-sm)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  thead th{background:#f1f5f7;font-weight:700;color:#4b5e69;position:sticky;top:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.65px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.sortable{cursor:pointer;user-select:none} thead th.sortable:hover{color:var(--ink);background:#eaf0f3}
  thead th.sortable.sorted{color:var(--ink)} .sort-ind{font-size:9px;color:var(--accent-ink);letter-spacing:0}
  thead th.sortable:focus-visible{outline:2px solid var(--accent-ink);outline-offset:-2px}
  tbody tr:hover{background:#f4f8f9} tbody tr:last-child td{border-bottom:none}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
  .pill.nodot::before{display:none}
  .p-green{background:var(--green-bg);color:var(--green)} .p-amber{background:var(--amber-bg);color:var(--amber)}
  .p-red{background:var(--red-bg);color:var(--red)} .p-grey{background:var(--grey-bg);color:#5b6470}
  .p-blue{background:var(--blue-bg);color:var(--blue)}
  .p-purple{background:#f3e8ff;color:#7c3aed}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#f3f3f3;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;margin:2px 4px 0 0}
  .tag.flagbad{background:var(--red-bg);border-color:#f3c4c0;color:var(--red)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:0 0 18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh-sm)}
  .kpi .v{font-size:25px;font-weight:750;letter-spacing:-.65px;line-height:1.1} .kpi .l{font-size:10.5px;color:var(--muted);margin-top:6px;font-weight:650;text-transform:uppercase;letter-spacing:.45px}
  .kpi.warn{box-shadow:inset 3px 0 0 var(--red),var(--sh-sm)} .kpi.warn .v{color:var(--red)} .kpi.good .v{color:var(--green)}

  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .bathcard{cursor:pointer;transition:box-shadow .12s,transform .12s}
  .bathcard:hover{box-shadow:var(--sh);transform:translateY(-1px)}
  .bathcard h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
  .kv span:first-child{color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .dot.g{background:var(--green)} .dot.r{background:var(--red)} .dot.a{background:var(--amber)} .dot.x{background:#c0c0c0}
  .partline{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .partline:last-child{border-bottom:none} .partline .s{font-weight:600} .partline .t{margin-left:auto;color:var(--muted);font-size:12px}
  .tankgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:12px;margin-bottom:18px}
  .tankcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--sh-sm);cursor:pointer;transition:box-shadow .12s,border-color .12s,transform .12s;display:flex;flex-direction:column}
  .tankcard:hover{box-shadow:var(--sh);border-color:#bfcdd4;transform:translateY(-1px)}
  .tank-acts{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:auto;padding-top:12px}
  .tank-acts > :only-child{grid-column:1 / -1}
  .tank-h{display:flex;align-items:center;gap:8px;margin-bottom:7px}.tank-h b{font-size:14px;letter-spacing:.1px}
  .tank-meta{font-size:11.5px;color:var(--muted);margin-bottom:9px;min-height:18px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tank{position:relative;border:1px solid #beded8;border-top:3px solid var(--accent);border-radius:5px 5px 9px 9px;min-height:78px;background:linear-gradient(180deg,#eef8f6,#dcefeb);padding:9px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .tank.spent{background:linear-gradient(180deg,#fdecec,#f8d6d6);border-color:#f0c4c0}
  .tank.off{min-height:58px;background:#f7f9fa;border:1px dashed #c8d3d9;border-top:3px solid #c8d3d9}
  .tank-part{background:#fff;border:1px solid #c3dcd7;border-radius:6px;padding:3px 7px;font-size:11.5px;font-weight:650;color:var(--ink);box-shadow:var(--sh-sm);height:fit-content}
  .tank-part.hot{background:var(--red-bg);border-color:#f0c4c0;color:var(--red)}
  .tank-empty{color:#6c7c87;font-size:11.5px;margin:auto;font-weight:600}

  .idlechip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);color:var(--accent-ink);border:1px solid #bfe8d6;border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:600;cursor:pointer}
  .idlechip:hover{background:#d6f3e6}
  .idlechip-tag{background:#f3e8ff;color:#7c3aed;border-radius:5px;padding:0 5px;font-size:10px}

  .contents{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;margin-top:4px}
  /* A bath can hold a lot of sets: cap the list and scroll inside the drawer,
     so the Save button never gets pushed out of reach. Tall enough for two
     removal rows — each carries a quantity, a reason and its mask areas. */
  .picklist{max-height:min(52vh,440px);overflow-y:auto}
  .crow{display:grid;grid-template-columns:1fr;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line-2)}
  .crow:last-child{border-bottom:none} .crow.on{background:var(--accent-weak)}
  .crow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  .crow .s{font-weight:650}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
  .seg.wrap{flex-wrap:wrap}
  .seg.wax button.on{background:var(--amber);color:#fff}
  .seg.wax button.on.partial{background:var(--amber);color:#fff}
  .seg.wax button.on.full{background:var(--red);color:#fff}
  .waxchk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:12px;cursor:pointer;background:#fff;color:var(--muted);user-select:none}
  .waxchk input{width:14px;height:14px;margin:0;flex:none;accent-color:var(--red)}
  .waxchk.on{background:var(--red-bg);border-color:#f0c4c0;color:var(--red);font-weight:600}
  .waxchk.on-rm{background:#f3e8ff;border-color:#dcc6f5;color:#7c3aed;font-weight:600}
  .waxchk.on-rm input{accent-color:#7c3aed}
  .chk{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:6px 11px;font-size:12.5px;cursor:pointer;background:#fff;color:var(--muted);user-select:none}
  .chk input{width:15px;height:15px;margin:0;flex:none;accent-color:var(--accent)}
  .chk.on{background:var(--accent-weak);border-color:#bfe8d6;color:var(--accent-ink);font-weight:600}

  svg.chart{display:block;max-width:100%}
  .charts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  .charts3 .ch{border:1px solid var(--line);border-radius:var(--r-s);padding:8px;background:#fcfdfd}
  .chttl{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between}
  .bar{height:8px;background:var(--line-2);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}

  .scrim{position:fixed;inset:0;background:rgba(10,27,36,.48);z-index:60;opacity:0;animation:fade .15s forwards;backdrop-filter:blur(1px)}
  @keyframes fade{to{opacity:1}}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(560px,96vw);background:var(--panel);z-index:61;box-shadow:var(--sh-lg);display:flex;flex-direction:column;transform:translateX(100%);animation:slide .18s forwards}
  @keyframes slide{to{transform:translateX(0)}}
  .drawer-h{display:flex;align-items:center;gap:10px;min-height:62px;padding:13px 18px;border-bottom:1px solid var(--line);background:#fbfcfd}
  .drawer-h h3{margin:0;font-size:16px;flex:1;font-weight:720;letter-spacing:-.15px}
  .drawer-b{padding:18px;overflow:auto;flex:1}
  .drawer-f{min-height:66px;padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;background:#fbfcfd}
  .form-hint{font-size:12px;align-self:center;color:var(--amber);font-weight:600;margin-left:2px}
  .form-hint.ready{color:var(--green)}
  .typetabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
  .typetab{min-height:62px;padding:10px 11px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;cursor:pointer;font-weight:650;font-size:13px;text-align:left;color:var(--ink);box-shadow:var(--sh-sm)}
  .typetab:hover{border-color:#aebfc7;background:#f7fafb}
  .typetab small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
  .typetab.on{background:var(--accent-weak);color:var(--ink);border-color:var(--accent)} .typetab.on small{color:#3f716c}
  .warn-line{display:flex;gap:7px;align-items:flex-start;padding:7px 11px;border-radius:var(--r-s);font-size:12.5px;margin-bottom:6px}
  .warn-red{background:var(--red-bg);color:var(--red)} .warn-amber{background:var(--amber-bg);color:var(--amber)}

<body>

  <aside id="sidebar" aria-label="Application navigation">

</div>
