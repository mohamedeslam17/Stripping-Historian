/* ------------------------------ log drawer ---------------------------- */
function openDrawer(){ drawerOpen = true; renderDrawer(); }
function closeDrawer(){ drawerOpen = false; formType = null; editId = null; formData = {}; renderDrawer(); }
function renderDrawer(){
  const root = $("#drawerRoot"); root.innerHTML = "";
  if(!drawerOpen) return;
  const panel = cel("div", { class:"drawer" });
  panel.append(cel("div", { class:"drawer-h" }, [
    cel("h3", {}, editId != null ? ("Edit · " + typeLabel(formType)) : (formType ? typeLabel(formType) : "Log event")),
    editId != null ? pill("Editing " + (formData.eventId || ""), "p-amber") : null,
    cel("button", { class:"x", title:"Close", onclick:closeDrawer }, "✕")
  ]));
  const body = cel("div", { class:"drawer-b" });
  const foot = cel("div", { class:"drawer-f" });
  if(!formType){
    const tabs = cel("div", { class:"typetabs" });
    Object.keys(TYPES).filter(t => !TYPES[t].hidden).forEach(t => tabs.append(cel("button", { class:"typetab", onclick:() => startNew(t) }, [cel("span", {}, typeLabel(t)), cel("small", {}, TYPES[t].desc)])));
    body.append(tabs);
    body.append(cel("div", { class:"muted", style:"font-size:12.5px;margin-top:2px" }, "Pick an event type. Dips are split into Add parts (into a bath) and Remove parts (out), so you never need the out-time up front."));
  } else {
    if(editId == null) body.append(cel("button", { class:"btn sm", style:"margin-bottom:12px", onclick:() => { formType = null; formData = { datetime:nowLocalDT() }; renderDrawer(); } }, "‹ Change event type"));
    body.append(cel("div", { class:"field" }, [cel("label", { class:"f" }, "Date / time" + (formType === "Load In" ? " (time in)" : formType === "Extraction" ? " (time out)" : "")), cel("input", { type:"datetime-local", value:formData.datetime || nowLocalDT(), oninput:e => { formData.datetime = e.target.value; refreshWarn(); } })]));
    if(formType === "Re-Masking" && formData.waxFailure) body.append(cel("div", { class:"warn-line", style:"background:#ece3f5;color:#6b3fa0" }, [cel("span", {}, "▦"), cel("span", {}, "Resolves wax failure: " + formData.waxFailure)]));
    const warnBox = cel("div", { style:"margin-top:4px" });
    const saveBtn = cel("button", { class:"btn primary", onclick:saveForm }, editId != null ? "Update" : "Save");
    const hint = cel("span", { class:"muted", style:"font-size:12px;align-self:center" });
    function formIncomplete(){
      if(formType === "Load In") return !formData.bath ? "Select a bath" : ((formData.serials || []).length ? "" : "Add at least one serial");
      if(formType === "Extraction") return !formData.bath ? "Select a bath" : ((formData.items || []).length ? "" : "Tick the parts you are pulling");
      if(formType === "Parts Received") return (formData.serials || []).length ? "" : "Add at least one serial";
      if(formType === "Top-Up") return (num(formData.hclAddedL) > 0 || num(formData.waterAddedL) > 0) ? "" : "Enter an HCl or water amount";
      if(formType === "Transfer") return !formData.bath ? "Select the source bath" : !formData.toBath ? "Select a destination bath" : ((formData.serials || []).length ? "" : "Tick the parts to move");
      return "";
    }
    function refreshWarn(){
      warnBox.innerHTML = "";
      // Adding to the waiting area is a "park", not a bath dip — check it as such.
      const draft = (formType === "Load In" && formData.bath === WAITING_AREA) ? Object.assign({}, formData, { type:"Parts Received", bath:"" }) : formData;
      eventWarnings(draft, EVENTS, CONFIG, nowLocalDT()).forEach(wn =>
        warnBox.append(cel("div", { class:"warn-line " + (wn.level === "red" ? "warn-red" : "warn-amber") }, [cel("span", {}, wn.level === "red" ? "⛔" : "⚠"), cel("span", {}, wn.msg)])));
      const inc = formIncomplete(); saveBtn.disabled = !!inc; hint.textContent = inc;
    }
    const fields = cel("div", {}); body.append(fields);
    const custom = TYPES[formType].custom;
    if(custom === "load") buildLoadFields(fields, refreshWarn);
    else if(custom === "extract") buildExtractFields(fields, refreshWarn);
    else if(custom === "move") buildMoveFields(fields, refreshWarn);
    else if(custom === "received") buildReceiveFields(fields, refreshWarn);
    else if(custom === "remask") buildRemaskFields(fields, refreshWarn);
    else if(custom === "waxfail") buildWaxFailFields(fields, refreshWarn);
    else buildGenericFields(fields, refreshWarn);
    body.append(warnBox);
    foot.append(saveBtn, cel("button", { class:"btn", onclick:closeDrawer }, "Cancel"), hint);
    refreshWarn();
    panel.addEventListener("keydown", e => { if((e.metaKey || e.ctrlKey) && e.key === "Enter") saveForm(); });
  }
  panel.append(body, foot);
  root.append(cel("div", { class:"scrim", onclick:closeDrawer }), panel);
}

/* --- Log event (drawer) --- */
function startNew(t){ formType = t; editId = null; formData = { datetime:nowLocalDT(), type:t }; if(t === "Extraction") formData._rows = {}; openDrawer(); }
function startEdit(e){ formType = e.type; editId = e.id; formData = Object.assign({}, e); if(e.type === "Load In") formData._serialText = (e.serials || []).join(", "); if(e.type === "Extraction") formData._rows = {}; openDrawer(); }
function startLoad(bath){ formType = "Load In"; editId = null; formData = { datetime:nowLocalDT(), type:"Load In", bath:bath || "" }; openDrawer(); }
function startExtraction(bath){ formType = "Extraction"; editId = null; formData = { datetime:nowLocalDT(), type:"Extraction", bath:bath || "", _rows:{} }; openDrawer(); }
function startMove(bath){ formType = "Transfer"; editId = null; formData = { datetime:nowLocalDT(), type:"Transfer", bath:bath || "", toBath:"", serials:[] }; openDrawer(); }
// "Complete fill" = a fresh full charge; prefill the volumes from the last fill.
function startCompleteFill(bath){
  const lf = (deriveBath(EVENTS, CONFIG, bath, nowLocalDT()).lastFill) || {};
  formType = "Bath Fill"; editId = null;
  formData = { datetime:nowLocalDT(), type:"Bath Fill", bath:bath || "", hclAddedL:lf.hclAddedL, waterAddedL:lf.waterAddedL, h3po4AddedL:lf.h3po4AddedL };
  openDrawer();
}
// Top up: a complete fill (new charge) or a partial addition of acid / water.
function startTopUp(bath){
  const body = cel("div", {});
  body.append(cel("div", { class:"muted", style:"margin-bottom:10px" }, "How are you topping up bath " + bath + "?"));
  const choice = (title, desc, fn) => cel("button", { class:"typetab", style:"width:100%;margin-bottom:8px", onclick:() => { closeModal(); fn(); } }, [cel("span", {}, title), cel("small", {}, desc)]);
  body.append(choice("Complete fill", "New full charge — HCl + water + H₃PO₄", () => startCompleteFill(bath)));
  body.append(choice("Partial addition", "Add some acid and/or water to the existing charge", () => startAction({ type:"topup", bath })));
  modal("Top up · Bath " + bath, body, [cel("button", { class:"btn", onclick:closeModal }, "Cancel")]);
}
// Open the drawer prefilled for a suggested next action.
function startAction(a){
  editId = null; const t = a.type;
  if(t === "reload") formData = { type:"Load In", datetime:nowLocalDT(), bath:a.bath || "", jc:a.jc || "", component:a.component || "", serials:(a.serials || []).slice() }, formType = "Load In";
  else if(t === "engineering") formData = { type:"Engineering Review", datetime:nowLocalDT(), jc:a.jc || "", serial:a.serial || "" }, formType = "Engineering Review";
  else if(t === "dispose") formData = { type:"Bath Disposal", datetime:nowLocalDT(), bath:a.bath || "" }, formType = "Bath Disposal";
  else if(t === "topup" || t === "topup-hcl" || t === "topup-water") formData = { type:"Top-Up", datetime:nowLocalDT(), bath:a.bath || "" }, formType = "Top-Up";
  else if(t === "move"){ startMove(a.bath); return; }
  else if(t === "chem") formData = { type:"Chemistry Check", datetime:nowLocalDT(), bath:a.bath || "" }, formType = "Chemistry Check";
  else if(t === "viewbath"){ showBath(a.bath); return; }
  else if(t === "viewpiece"){ showSerial(a.serial); return; }
  else if(t === "extract"){ formType = "Extraction"; formData = { type:"Extraction", datetime:nowLocalDT(), bath:a.bath || "", _rows:{} }; (a.preselect || []).forEach(s => formData._rows[s] = { result:"Cleared", wax:[], checked:true }); }
  else return;
  openDrawer();
}

function appendOpList(card){ const dl = cel("datalist", { id:"opList" }); (CONFIG.operators || []).forEach(o => dl.append(cel("option", { value:o }))); card.append(dl); }
function fieldNode(name, label, kind, onin){
  const wrap = cel("div", { class:"field" }, cel("label", { class:"f" }, label));
  let inp;
  if(kind === "baths"){ inp = cel("select", { oninput:onin }, cel("option", { value:"" }, "—")); bathList(EVENTS, CONFIG).forEach(b => inp.append(cel("option", { value:b }, b))); }
  else if(kind && kind.indexOf("sel:") === 0){ inp = cel("select", { oninput:onin }, cel("option", { value:"" }, "—")); kind.slice(4).split(",").forEach(o => inp.append(cel("option", { value:o }, o))); }
  else if(kind === "num") inp = cel("input", { type:"number", step:"any", oninput:onin });
  else if(kind === "operator") inp = cel("input", { type:"text", list:"opList", oninput:onin });
  else inp = cel("input", { type:"text", oninput:onin });
  if(formData[name] != null) inp.value = formData[name];
  wrap.append(inp); return wrap;
}

function buildGenericFields(card, refreshWarn){
  let needList = false;
  const two = cel("div", { class:"twocol" });
  TYPES[formType].fields.forEach(fd => { const [name, label, kind] = fd; if(kind === "operator") needList = true;
    two.append(fieldNode(name, label, kind, e => { formData[name] = e.target.value; refreshWarn(); })); });
  card.append(two);
  if(needList) appendOpList(card);
}

// Multi-select area toggles (which masked areas — re-masked, or failed).
function areaToggleControl(getSel, setSel, onChange, areasList){
  const wrap = cel("div", { class:"seg wrap" });
  (areasList || CONFIG.maskAreas || []).forEach(area => {
    const b = cel("button", { type:"button", class:(getSel() || []).includes(area) ? "on" : "", onclick:() => {
      let s = (getSel() || []).slice(); s.includes(area) ? s = s.filter(x => x !== area) : s.push(area); setSel(s); b.className = s.includes(area) ? "on" : ""; onChange();
    } }, area);
    wrap.append(b);
  });
  return wrap;
}

function buildRemaskFields(card, refreshWarn){
  appendOpList(card);
  const two = cel("div", { class:"twocol" });
  two.append(fieldNode("jc", "J/C No.", "text", e => { formData.jc = e.target.value; refreshWarn(); }));
  two.append(fieldNode("serial", "Serial", "text", e => { formData.serial = e.target.value; refreshWarn(); }));
  card.append(two);
  if(!Array.isArray(formData.areas)){ const uw = formData.serial ? unresolvedWaxAreas(EVENTS, formData.serial) : []; formData.areas = uw.length ? uw.map(u => u.area) : (CONFIG.maskAreas || []).slice(); }
  card.append(cel("div", { class:"field" }, [cel("label", { class:"f" }, "Areas re-masked"), areaToggleControl(() => formData.areas, s => { formData.areas = s; }, refreshWarn)]));
  card.append(fieldNode("operator", "Operator", "operator", e => { formData.operator = e.target.value; refreshWarn(); }));
  card.append(fieldNode("notes", "Notes", "text", e => { formData.notes = e.target.value; refreshWarn(); }));
}

function buildWaxFailFields(card, refreshWarn){
  appendOpList(card);
  const two = cel("div", { class:"twocol" });
  two.append(fieldNode("bath", "Bath", "baths", e => { formData.bath = e.target.value; refreshWarn(); }));
  two.append(fieldNode("jc", "J/C No.", "text", e => { formData.jc = e.target.value; refreshWarn(); }));
  card.append(two);
  card.append(fieldNode("serial", "Serial", "text", e => { formData.serial = e.target.value; refreshWarn(); }));
  formData.wax = Array.isArray(formData.wax) ? waxAreasOf(formData) : [];
  card.append(cel("div", { class:"field" }, [cel("label", { class:"f" }, "Mask failed on"), areaToggleControl(() => formData.wax, s => { formData.wax = s; }, refreshWarn)]));
  card.append(fieldNode("operator", "Operator", "operator", e => { formData.operator = e.target.value; refreshWarn(); }));
  card.append(fieldNode("notes", "Notes", "text", e => { formData.notes = e.target.value; refreshWarn(); }));
}

function buildLoadFields(card, refreshWarn){
  appendOpList(card);
  const jcField = fieldNode("jc", "J/C No.", "text", e => { formData.jc = e.target.value; refreshWarn(); });
  const compField = fieldNode("component", "Component", "text", e => { formData.component = e.target.value; refreshWarn(); });
  const jcInput = jcField.querySelector("input"), compInput = compField.querySelector("input");
  // Destination: a bath, or the waiting area (parked, not in a bath). No empty
  // option, so parts always land somewhere — the waiting area is the default.
  if(!formData.bath) formData.bath = WAITING_AREA;
  const bathField = cel("div", { class:"field" }, cel("label", { class:"f" }, "Bath / destination"));
  const bsel = cel("select", {}, cel("option", { value:WAITING_AREA }, "Waiting area (not in a bath yet)"));
  const knownBaths = bathList(EVENTS, CONFIG);
  knownBaths.forEach(b => bsel.append(cel("option", { value:b }, b)));
  if(formData.bath && formData.bath !== WAITING_AREA && !knownBaths.includes(formData.bath)) bsel.append(cel("option", { value:formData.bath }, formData.bath + " (unknown bath)"));
  bsel.value = formData.bath;
  bsel.addEventListener("input", () => { formData.bath = bsel.value; refreshWaiting(); refreshWarn(); });
  bathField.append(bsel);
  const two = cel("div", { class:"twocol" });
  two.append(bathField);
  two.append(jcField, compField);
  two.append(fieldNode("operator", "Operator", "operator", e => { formData.operator = e.target.value; refreshWarn(); }));
  card.append(two);
  formData.serials = formData.serials || [];
  const count = cel("span", { class:"muted", style:"font-weight:400" });
  const lbl = cel("label", { class:"f", style:"display:flex;justify-content:space-between" }, [cel("span", {}, "Serials"), count]);
  const setCount = () => { const n = formData.serials.length; count.textContent = n ? (n + " part" + (n > 1 ? "s" : "")) : ""; };
  const autofill = () => {
    if(!formData.serials.length) return;
    const info = lookupSerial(EVENTS, formData.serials[0]);
    if(info.jc && !formData.jc){ formData.jc = info.jc; if(jcInput) jcInput.value = info.jc; }
    if(info.component && !formData.component){ formData.component = info.component; if(compInput) compInput.value = info.component; }
  };
  const wrap = cel("div", { class:"field" }, lbl);
  const chipBox = chipInput(formData.serials, list => { formData.serials = list; setCount(); autofill(); refreshWaiting(); refreshRemask(); refreshWarn(); });
  wrap.append(chipBox);
  wrap.append(cel("div", { class:"faint", style:"font-size:11.5px;margin-top:5px" }, "Type, or paste a whole column from Excel (or a comma/space list) — each becomes a chip. Ranges like 7261-01..06 expand; known serials fill in J/C & component."));
  card.append(wrap); setCount(); autofill();

  // Waiting area — parts not in a bath (came out without re-entry, or parked on
  // receipt). Select one (or add all) to pull it into this bath. Hidden when the
  // destination IS the waiting area (you'd be adding to it, not pulling from it).
  const waitingWrap = cel("div", {}); card.append(waitingWrap);
  function refreshWaiting(){
    waitingWrap.innerHTML = "";
    if(formData.bath === WAITING_AREA) return;
    const waiting = waitingParts(EVENTS, CONFIG, nowLocalDT()).filter(p => !(formData.serials || []).includes(p.serial));
    if(!waiting.length) return;
    const hint = p => p.kind === "needs re-mask" ? "  ·  re-mask" : p.kind === "received" ? "  ·  new" : (p.lastBath ? "  ·  out " + p.lastBath : "  ·  awaiting");
    waitingWrap.append(cel("label", { class:"f", style:"margin:8px 0 5px" }, "Waiting area (" + waiting.length + ") — select to add"));
    const sel = cel("select", { style:"flex:1" }, cel("option", { value:"" }, "Add from waiting area…"));
    waiting.forEach(p => sel.append(cel("option", { value:p.serial }, p.serial + (p.jc ? "  ·  " + p.jc : "") + hint(p))));
    sel.addEventListener("input", () => { if(sel.value){ chipBox.addOne(sel.value); sel.value = ""; } });
    const addAll = cel("button", { class:"btn sm", type:"button", onclick:() => waiting.forEach(p => chipBox.addOne(p.serial)) }, "Add all");
    waitingWrap.append(cel("div", { style:"display:flex;gap:8px;align-items:center" }, [sel, addAll]));
  }
  refreshWaiting();

  // Re-masking happens here, as part of the re-dip: any entered part that came
  // out with a wax failure must have its failed areas re-masked before loading.
  const remaskWrap = cel("div", {}); card.append(remaskWrap);
  function refreshRemask(){
    remaskWrap.innerHTML = "";
    const needing = (formData.serials || []).map(s => ({ serial:s, areas:unresolvedWaxAreas(EVENTS, s).map(a => a.area) })).filter(x => x.areas.length);
    formData.remask = (formData.remask || []).filter(r => needing.some(n => n.serial === r.serial));
    if(!needing.length) return;
    remaskWrap.append(cel("div", { class:"warn-line", style:"background:#ece3f5;color:#6b3fa0;margin-top:4px" }, [cel("span", {}, "▦"), cel("span", {}, "Wax failure on these parts — tick the areas you re-masked before re-dipping:")]));
    needing.forEach(x => {
      let entry = formData.remask.find(r => r.serial === x.serial);
      if(!entry){ entry = { serial:x.serial, areas:x.areas.slice() }; formData.remask.push(entry); } // default: re-masked all failed areas
      remaskWrap.append(cel("div", { class:"field", style:"margin-bottom:8px" }, [
        cel("label", { class:"f" }, x.serial + " — re-masked"),
        areaToggleControl(() => entry.areas, s => { entry.areas = s; }, refreshWarn, x.areas)
      ]));
    });
  }
  refreshRemask();
  card.append(fieldNode("notes", "Notes", "text", e => { formData.notes = e.target.value; refreshWarn(); }));
}

// Waiting-area entry (Parts Received): serials parked, not yet in a bath. Reached
// when editing an existing waiting-area entry; new ones come from the Add-parts form.
function buildReceiveFields(card, refreshWarn){
  appendOpList(card);
  const two = cel("div", { class:"twocol" });
  two.append(fieldNode("jc", "J/C No.", "text", e => { formData.jc = e.target.value; refreshWarn(); }));
  two.append(fieldNode("component", "Component", "text", e => { formData.component = e.target.value; refreshWarn(); }));
  card.append(two);
  formData.serials = formData.serials || [];
  const count = cel("span", { class:"muted", style:"font-weight:400" });

// Chip entry: type/paste serials (or ranges) -> removable chips. Returns the box.
function chipInput(initial, onChange){
  const list = (initial || []).slice();
  const box = cel("div", { class:"chipbox" });
  const input = cel("input", { type:"text", placeholder:"type or paste serials (Excel column, commas, spaces)…" });
  const emit = () => onChange(list.slice());
  function paint(){ box.innerHTML = ""; list.forEach((s, i) => box.append(cel("span", { class:"chip" }, [cel("b", {}, s), cel("i", { title:"remove", onclick:ev => { ev.stopPropagation(); list.splice(i, 1); paint(); emit(); input.focus(); } }, "✕")]))); box.append(input); }
  const addTokens = text => { let added = false; parseSerials(text).forEach(s => { if(!list.includes(s)){ list.push(s); added = true; } }); if(added){ paint(); emit(); } };
  // Auto-commit whenever a separator appears in the field. This makes pasting a
  // column from Excel (tabs / newlines) or a comma/space list reliable, even if
  // the browser's paste event doesn't fire.
  input.addEventListener("input", () => { if(/[\s,;]/.test(input.value)){ const v = input.value; input.value = ""; addTokens(v); } });
  input.addEventListener("keydown", e => {
    if(e.key === "Enter" || e.key === "," || e.key === "Tab"){ if(input.value.trim()){ e.preventDefault(); addTokens(input.value); input.value = ""; input.focus(); } }
    else if(e.key === "Backspace" && !input.value && list.length){ list.pop(); paint(); emit(); input.focus(); }
  });
  input.addEventListener("paste", e => { const t = ((e.clipboardData || window.clipboardData) || { getData:() => "" }).getData("text"); if(t){ e.preventDefault(); addTokens(t); input.value = ""; } });
  input.addEventListener("blur", () => { if(input.value.trim()){ addTokens(input.value); input.value = ""; } box.classList.remove("focus"); });
  input.addEventListener("focus", () => box.classList.add("focus"));
  box.addEventListener("click", () => input.focus());
  box.addOne = s => addTokens(s);   // programmatic add (e.g. from the "waiting to go back in" suggestions)
  paint();
  return box;
}

async function saveForm(){
  const rec = {}; Object.keys(formData).forEach(k => { if(!k.startsWith("_")) rec[k] = formData[k]; });
  if(rec.type === "Load In"){
    if(!rec.bath){ alert("Select a bath or the waiting area."); return; }
    rec.serials = parseSerials(formData._serialText != null ? formData._serialText : (rec.serials || []).join(", "));
    if(!rec.serials.length){ alert("Enter at least one serial."); return; }
    // Waiting area = park the serials (not a bath dip): store as Parts Received.
    if(rec.bath === WAITING_AREA){ rec.type = "Parts Received"; delete rec.bath; delete rec.remask; }
  }
  if(rec.type === "Extraction"){ if(!rec.bath){ alert("Select a bath."); return; } if(!rec.items || !rec.items.length){ alert("Tick at least one part to extract."); return; } }
  if(rec.type === "Parts Received"){ rec.serials = rec.serials || []; if(!rec.serials.length){ alert("Enter at least one serial."); return; } }
  if(rec.type === "Top-Up"){ if(!(num(rec.hclAddedL) > 0 || num(rec.waterAddedL) > 0)){ alert("Enter an HCl or water amount."); return; } }
  if(rec.type === "Transfer"){ if(!rec.bath || !rec.toBath){ alert("Select source and destination baths."); return; } if(rec.bath === rec.toBath){ alert("Source and destination must differ."); return; } if(!(rec.serials || []).length){ alert("Tick at least one part to move."); return; } }
  if(editId != null){
    const prior = JSON.parse(JSON.stringify(EVENTS.find(e => e.id === editId)));
    rec.id = editId; rec.eventId = rec.eventId || nextEventId(rec.datetime, EVENTS);
    await updateEvent(rec); setUndo("edit " + rec.eventId, async () => { await updateEvent(prior); });
    flash("Updated " + rec.eventId, { label:"Undo", fn:doUndo });
    drawerOpen = false; formType = null; editId = null; formData = {};
  } else {
    await addEvent(rec); const newId = rec.id; setUndo("add " + rec.eventId, async () => { await removeEvent(newId); });
    flash("Saved " + rec.eventId, { label:"Undo", fn:doUndo });
    drawerOpen = false; formType = null; formData = {};
  }
  render();
}

/* --- export / import --- */
function download(name, text, type){ const b = new Blob([text], { type }); const u = URL.createObjectURL(b); const a = cel("a", { href:u, download:name }); document.body.append(a); a.click(); a.remove(); URL.revokeObjectURL(u); }
$("#exportJson").onclick = () => download("strip_historian_backup_" + todayISODate() + ".json", JSON.stringify({ app:"stripping-historian", version:2, exported:new Date().toISOString(), config:CONFIG, events:EVENTS }, null, 2), "application/json");
$("#exportCsv").onclick = () => {
  const cols = ["serial", "bath", "jc", "component", "cycle", "timeIn", "timeOut", "hours", "result", "waxFailure", "open", "anomaly"];
  const { records } = deriveImmersions(EVENTS, nowLocalDT());
  const lines = [cols.join(",")];
  records.forEach(r => {
    const row = { serial:r.serial, bath:r.bath, jc:r.jc, component:r.component, cycle:r.cycle, timeIn:r.inDT || "", timeOut:r.outDT || "",
      hours:r.open ? ("in bath " + (r.elapsedH || 0) + "h") : (r.hours == null ? "" : r.hours), result:r.result || "", waxFailure:waxSummary(r), open:r.open ? "yes" : "", anomaly:r.anomaly || "" };
    lines.push(cols.map(c => { let v = row[c] == null ? "" : String(row[c]); if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g, '""') + '"'; return v; }).join(","));
  });
  download("strip_historian_dips_" + todayISODate() + ".csv", lines.join("\n"), "text/csv");
};
$("#importBtn").onclick = () => $("#importFile").click();
$("#importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = async () => {
    try {
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.events)) throw new Error("no events array in file");
      if(!confirm("Import will REPLACE current data with the backup (" + d.events.length + " events). Continue?")) return;
      await clearStore("events");
      for(const ev of d.events){ const o = Object.assign({}, ev); delete o.id; await putRec("events", o); }
      if(d.config){ CONFIG = Object.assign(JSON.parse(JSON.stringify(DEFAULT_CONFIG)), d.config); await saveConfig(); }
      await loadAll(); flash("Imported " + d.events.length + " events"); render();
    } catch(err){ alert("Could not read file: " + err.message); }
  };
  r.readAsText(f); e.target.value = "";
};

  if(e.key !== "Enter") return;
  const q = e.target.value.trim(); if(!q) return;
  const hit = derivePieces(EVENTS, CONFIG, nowLocalDT()).find(p => p.serial.toLowerCase() === q.toLowerCase());
  if(hit) showSerial(hit.serial);
  else { logFilter = { type:"", bath:"", text:q }; activeTab = "Events"; render(); }
});
document.addEventListener("keydown", e => {
  if(e.key === "Escape"){ if(drawerOpen) closeDrawer(); return; }
  const tag = (e.target && e.target.tagName) || "";
  if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  if(e.key === "/"){ e.preventDefault(); const gs = $("#globalSearch"); if(gs) gs.focus(); }
  else if(e.key === "l" || e.key === "L") startLoad("");
  else if(e.key === "e" || e.key === "E") startExtraction("");
  else if(e.key === "n" || e.key === "N"){ formType = null; editId = null; formData = {}; openDrawer(); }
});
document.addEventListener("keydown", e => {
  if((e.metaKey || e.ctrlKey) && (e.key === "z" || e.key === "Z") && lastUndo){ e.preventDefault(); doUndo(); }
});
