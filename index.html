<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stripping Historian — event-based strip tracker</title>
<style>
  *{box-sizing:border-box}
  :root{
    --ink:#16242b; --muted:#647078; --faint:#8c98a0; --line:#e4e9ec; --line-2:#eef2f4;
    --bg:#eef2f4; --panel:#ffffff;
    --brand:#15323d; --brand-2:#1d4a5a; --brand-ink:#eaf2f5;
    --accent:#2e7d96; --accent-2:#2a6f86; --accent-weak:#e3eef2;
    --green:#1b7a3d; --green-bg:#dcf3e3; --amber:#8a5a00; --amber-bg:#fceccb;
    --red:#b3261e; --red-bg:#fbdcda; --blue:#1f5e84; --blue-bg:#dcebf5; --grey-bg:#eaeef0;
    --r:12px; --r-s:8px; --r-xs:6px;
    --sh-sm:0 1px 2px rgba(13,30,38,.06); --sh:0 6px 18px rgba(13,30,38,.10); --sh-lg:0 18px 50px rgba(8,20,26,.30);
  }
  html,body{height:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}

  #app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  #sidebar{background:linear-gradient(180deg,var(--brand),var(--brand-2));color:var(--brand-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:14px 12px;gap:3px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:15px;flex:none}
  .brand b{font-size:14.5px;font-weight:700;letter-spacing:.2px;display:block;line-height:1.1}
  .brand small{color:#9fc0cc;font-size:10.5px}
  #nav{display:flex;flex-direction:column;gap:2px}
  .navlink{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-s);color:#cfe0e6;cursor:pointer;font-size:13.5px;font-weight:500;border:none;background:none;text-align:left;width:100%}
  .navlink .ic{width:18px;text-align:center;opacity:.92;font-size:14px}
  .navlink:hover{background:rgba(255,255,255,.08);color:#fff}
  .navlink.on{background:rgba(255,255,255,.15);color:#fff}
  .navlink .badge{margin-left:auto;min-width:18px;text-align:center;padding:1px 6px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700}
  .navlink .badge.info{background:var(--accent)}
  .side-sp{flex:1}
  .side-log{margin:6px 2px 12px;padding:11px;border-radius:var(--r-s);background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
  .side-log:hover{background:#3690ab}
  .side-foot{display:flex;gap:6px;padding:2px}
  .side-foot button{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#dce8ec;border-radius:var(--r-xs);padding:6px 4px;font-size:11px;cursor:pointer}
  .side-foot button:hover{background:rgba(255,255,255,.14)}

  #content{display:flex;flex-direction:column;min-width:0}
  #topbar{position:sticky;top:0;z-index:20;min-height:54px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 18px}
  #topbar h1{font-size:16px;margin:0;font-weight:650}
  .search{margin-left:auto}
  .search input{width:240px;padding:7px 12px;border:1px solid var(--line);border-radius:20px;background:#f5f8f9;font-size:13px}
  .kbd{display:inline-block;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:0 5px;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace}
  #main{padding:18px 20px;flex:1;min-width:0;max-width:1320px;width:100%}

  .attn{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--red-bg);color:var(--red);border:1px solid #f1c7c4;border-radius:var(--r);padding:9px 14px;margin-bottom:16px;font-size:13px}
  .attn b{font-weight:700} .attn .sp{flex:1}

  h2.sec{font-size:15px;margin:0 0 14px;font-weight:650}
  h3.sub{font-size:11.5px;margin:22px 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .muted{color:var(--muted)} .faint{color:var(--faint)}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh-sm)}
  .linkish{color:var(--accent);cursor:pointer;font-weight:500} .linkish:hover{text-decoration:underline}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:46px 10px} .flagok{color:var(--green)}

  .btn{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 13px;border-radius:var(--r-s);cursor:pointer;font-size:13px;font-weight:550;box-shadow:var(--sh-sm)}
  .btn:hover{background:#f4f7f8}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#3690ab}
  .btn.sm{padding:5px 10px;font-size:12px}
  .btn.danger{color:var(--red);border-color:#e6b3b0}
  .btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
  .btnrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  label.f{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;font-weight:550}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-s);font-size:13.5px;font-family:inherit;background:#fff;color:var(--ink)}
  textarea{resize:vertical}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .field{margin-bottom:13px}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);max-height:64vh;background:var(--panel);box-shadow:var(--sh-sm)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 12px;text-align:left;vertical-align:middle;border-bottom:1px solid var(--line-2)}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  thead th{background:#f6f9fa;font-weight:600;color:var(--muted);position:sticky;top:0;font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--line);white-space:nowrap}
  thead th.sortable{cursor:pointer} thead th.sortable:hover{color:var(--ink)}
  tbody tr:hover{background:#f7fafb} tbody tr:last-child td{border-bottom:none}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
  .pill.nodot::before{display:none}
  .p-green{background:var(--green-bg);color:var(--green)} .p-amber{background:var(--amber-bg);color:var(--amber)}
  .p-red{background:var(--red-bg);color:var(--red)} .p-grey{background:var(--grey-bg);color:#5b6770}
  .p-blue{background:var(--blue-bg);color:var(--blue)}
  .p-purple{background:#ece3f5;color:#6b3fa0}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#eef2f4;border:1px solid var(--line);border-radius:7px;padding:3px 8px;font-size:12px;margin:2px 4px 0 0}
  .tag.flagbad{background:var(--red-bg);border-color:#eebfbc;color:var(--red)}

  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--sh-sm)}
  .kpi .v{font-size:25px;font-weight:750;letter-spacing:-.5px} .kpi .l{font-size:12px;color:var(--muted);margin-top:3px}
  .kpi.warn{border-color:#e6b3b0} .kpi.warn .v{color:var(--red)} .kpi.good .v{color:var(--green)}

  .bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .bathcard{cursor:pointer;transition:box-shadow .12s,transform .12s}
  .bathcard:hover{box-shadow:var(--sh);transform:translateY(-1px)}
  .bathcard h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line-2);font-size:12.5px}
  .kv span:first-child{color:var(--muted)}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
  .dot.g{background:var(--green)} .dot.r{background:var(--red)} .dot.a{background:var(--amber)} .dot.x{background:#b6c2c8}
  .partline{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:13px}
  .partline:last-child{border-bottom:none} .partline .s{font-weight:600} .partline .t{margin-left:auto;color:var(--muted);font-size:12px}
  .tankgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .tankcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--sh-sm);cursor:pointer;transition:box-shadow .12s}
  .tankcard:hover{box-shadow:var(--sh)}
  .tank-h{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .tank{position:relative;border:2px solid #aebfc6;border-top:none;border-radius:0 0 14px 14px;min-height:118px;background:linear-gradient(180deg,#e9f6fb,#cfe7f2);padding:9px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
  .tank.spent{background:linear-gradient(180deg,#fbe9e7,#f3cfca);border-color:#dcaaa5}
  .tank.off{background:repeating-linear-gradient(45deg,#f1f4f5,#f1f4f5 8px,#e9eef0 8px,#e9eef0 16px);border-color:var(--line)}
  .tank-part{background:#fff;border:1px solid #cdd9de;border-radius:6px;padding:3px 7px;font-size:11.5px;font-weight:600;box-shadow:var(--sh-sm);height:fit-content}
  .tank-part.hot{background:var(--red-bg);border-color:#e3a9a9;color:var(--red)}
  .tank-empty{color:var(--faint);font-size:12px;margin:auto}

  .chipbox{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;min-height:44px;align-content:flex-start}
  .chipbox.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak)}
  .chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);color:var(--accent-2);border-radius:7px;padding:3px 4px 3px 9px;font-size:12.5px;font-weight:600}
  .chip i{cursor:pointer;font-style:normal;width:16px;height:16px;border-radius:4px;display:flex;align-items:center;justify-content:center}
  .chip i:hover{background:rgba(0,0,0,.10)}
  .chipbox input{border:none;outline:none;box-shadow:none!important;flex:1;min-width:120px;padding:4px;background:transparent}
  .idlechip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-weak);color:var(--accent-2);border:1px solid var(--accent);border-radius:7px;padding:3px 9px;font-size:12.5px;font-weight:600;cursor:pointer}
  .idlechip:hover{background:#d6e8ef}
  .idlechip-tag{background:#ece3f5;color:#6b3fa0;border-radius:5px;padding:0 5px;font-size:10px}

  .contents{border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden;margin-top:4px}
  .crow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 11px;border-bottom:1px solid var(--line-2)}
  .crow:last-child{border-bottom:none} .crow.on{background:var(--accent-weak)}
  .crow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
  .seg button{border:none;background:#fff;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
  .seg button:last-child{border-right:none}
  .seg button.on{background:var(--accent);color:#fff}
  .seg.wrap{flex-wrap:wrap}
  .seg.wax button.on{background:var(--amber);color:#fff}
  .seg.wax button.on.partial{background:var(--amber);color:#fff}
  .seg.wax button.on.full{background:var(--red);color:#fff}

  svg.chart{display:block;max-width:100%}
  .charts3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
  .charts3 .ch{border:1px solid var(--line);border-radius:var(--r-s);padding:8px;background:#fcfdfd}
  .chttl{font-size:11px;color:var(--muted);margin-bottom:2px;display:flex;justify-content:space-between}
  .bar{height:8px;background:var(--line-2);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--accent);border-radius:6px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}

  .scrim{position:fixed;inset:0;background:rgba(8,20,26,.42);z-index:60;opacity:0;animation:fade .15s forwards}
  @keyframes fade{to{opacity:1}}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(480px,96vw);background:var(--panel);z-index:61;box-shadow:var(--sh-lg);display:flex;flex-direction:column;transform:translateX(100%);animation:slide .18s forwards}
  @keyframes slide{to{transform:translateX(0)}}
  .drawer-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .drawer-h h3{margin:0;font-size:15px;flex:1;font-weight:650}
  .drawer-b{padding:16px;overflow:auto;flex:1}
  .drawer-f{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .typetabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:14px}
  .typetab{padding:10px;border:1px solid var(--line);border-radius:var(--r-s);background:#fff;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
  .typetab small{display:block;font-weight:400;font-size:11px;color:var(--muted);margin-top:2px}
  .typetab.on{background:var(--brand);color:#fff;border-color:var(--brand)} .typetab.on small{color:#bcd2da}
  .warn-line{display:flex;gap:7px;align-items:flex-start;padding:7px 11px;border-radius:var(--r-s);font-size:12.5px;margin-bottom:6px}
  .warn-red{background:var(--red-bg);color:var(--red)} .warn-amber{background:var(--amber-bg);color:var(--amber)}

  .overlay{position:fixed;inset:0;background:rgba(8,20,26,.45);display:flex;align-items:flex-start;justify-content:center;padding:34px 14px;z-index:62;overflow:auto}
  .modal{background:#fff;border-radius:var(--r);max-width:760px;width:100%;box-shadow:var(--sh-lg)}
  .modal-h{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:var(--r) var(--r) 0 0}
  .modal-h h3{margin:0;font-size:15px;flex:1;font-weight:650}
  .modal-b{padding:18px}
  .modal-f{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .x{cursor:pointer;border:none;background:none;font-size:18px;color:var(--muted);line-height:1}

  .tl{list-style:none;margin:0;padding:0}
  .tl li{position:relative;padding:0 0 15px 22px;border-left:2px solid var(--line)}
  .tl li:last-child{border-left-color:transparent}
  .tl li::before{content:"";position:absolute;left:-7px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .tl .tl-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .tl .tl-when{font-size:12px;color:var(--muted)} .tl .tl-d{font-size:12.5px;color:#41525a;margin-top:2px}

  #printArea{display:none}
  .pr-head{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #16242b;padding-bottom:8px;margin-bottom:14px}
  .pr-head h2{margin:0;font-size:18px}
  .pr-meta td{border:none;padding:2px 14px 2px 0;font-size:12px}
  @media print{ body *{visibility:hidden} #printArea,#printArea *{visibility:visible} #printArea{display:block!important;position:absolute;inset:0;padding:0} thead th{position:static} }

  @media(max-width:900px){
    #app{grid-template-columns:1fr}
    #sidebar{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:4px;padding:8px}
    .brand{padding:4px 8px} .side-sp{flex:0} #nav{flex-direction:row;flex-wrap:wrap} .navlink{width:auto}
    .side-log{margin:0 0 0 auto} .side-foot{order:5} .twocol{grid-template-columns:1fr} .charts3{grid-template-columns:1fr} .crow{grid-template-columns:24px 1fr;row-gap:8px}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">S</div><div><b>Stripping&nbsp;Historian</b><small>offline · on this PC</small></div></div>
    <nav id="nav"></nav>
    <div class="side-sp"></div>
    <button class="side-log" id="logBtn">＋&nbsp; Log event&nbsp; <span class="kbd">N</span></button>
    <div class="side-foot">
      <button id="exportJson" title="Download a full JSON backup">Backup</button>
      <button id="importBtn" title="Restore from a backup">Import</button>
      <button id="exportCsv" title="Export the dip log as CSV">CSV</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </aside>
  <div id="content">
    <header id="topbar">
      <h1 id="pageTitle">Floor</h1>
      <div class="search"><input id="globalSearch" placeholder="Search serial, J/C, notes…   ( / )"></div>
    </header>
    <main id="main"></main>
  </div>
</div>
<div id="drawerRoot"></div>
<div id="modalRoot"></div>
<div id="printArea"></div>

<script>
"use strict";

/* =========================================================================
   Stripping Historian — a single-file, offline, event-sourced shop log for
   chemical stripping of turbine components.

   Dips are recorded as two separate events so the operator never has to know
   the out-time up front:
     • Load In   — N parts go INTO a bath  (event time = time in)
     • Extraction — SOME parts come OUT     (event time = time out, per-part result)
   The system pairs them per serial, counts cycles, and always knows what is
   still in each bath. Every view is a PURE function of the event stream.
   ========================================================================= */

const DB_NAME = "strip_historian_db", DB_VER = 1;
let db = null, EVENTS = [], CONFIG = {};

const DEFAULT_CONFIG = {
  tempSet: 90, tempTol: 3,
  hclMin: 16, hclMax: 22,
  feMax: 100,
  maxCycles: 3, maxHours: 24,
  maxBathAge: 30,
  bathCapacity: 12,
  maskAreas: ["Cooling holes", "Part body"],
  baths: [],   // no demo baths by default — set them in Settings, or they appear from your data
  operators: ["Diang", "JM", "Bernabe", "Maint", "QA"]
};

/* ============================ DOMAIN START ===============================
   Pure functions only. No DOM, no IndexedDB, no module-level mutable state. */

function round(n, p = 1){ const f = Math.pow(10, p); return Math.round((+n) * f) / f; }
function num(v){ return (v === "" || v == null) ? null : (Number.isFinite(+v) ? +v : null); }
function fmtNum(v){ const n = num(v); return n == null ? "" : String(round(n, 2)); }

function byDate(a, b){
  return String(a.datetime || "").localeCompare(String(b.datetime || ""))
      || String(a.eventId || "").localeCompare(String(b.eventId || ""));
}

function hrsBetween(a, b){ // clock-time difference, tolerant of overnight roll-over
  if(!a || !b) return 0;
  const [h1, m1] = a.split(":").map(Number), [h2, m2] = b.split(":").map(Number);
  let d = (h2 * 60 + m2) - (h1 * 60 + m1);
  if(d < 0) d += 1440;
  return round(d / 60, 2);
}
function hoursBetweenDT(a, b){ if(!a || !b) return 0; const d = (new Date(b) - new Date(a)) / 3600000; return d > 0 ? d : 0; }
function daysBetween(a, b){ if(!a || !b) return ""; return Math.round((new Date(b) - new Date(a)) / 86400000); }

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(dt){ if(!dt) return ""; const d = dt.slice(0,10).split("-"); return d[2] + " " + MONTHS[(+d[1]) - 1] + " " + d[0].slice(2); }
function fmtDT(dt){ if(!dt) return ""; return fmtDate(dt) + (dt.length > 10 ? " " + dt.slice(11,16) : ""); }

function nextEventId(dateStr, events){
  const ymd = (dateStr || "").slice(0,10).replace(/-/g, "");
  let n = 0; events.forEach(e => { if(e.eventId && e.eventId.indexOf(ymd) === 0) n++; });
  return ymd + "-" + String(n + 1).padStart(4, "0");
}

// "7261-01..06" / "7261-01..7261-06" expands to a list; commas/spaces/newlines split.
function parseSerials(text){
  if(!text) return [];
  const out = [], add = s => { if(s && !out.includes(s)) out.push(s); };
  String(text).split(/[\s,;]+/).map(t => t.trim().replace(/^["']+|["']+$/g, "")).filter(Boolean).forEach(tok => {
    const parts = tok.split("..");
    if(parts.length === 2){
      const lm = parts[0].match(/^(.*?)(\d+)$/);
      if(lm){
        const prefix = lm[1], width = lm[2].length;
        const hi = /^\d+$/.test(parts[1]) ? parts[1] : (parts[1].match(/(\d+)$/) || [])[1];
        if(hi != null){
          const a = parseInt(lm[2], 10), b = parseInt(hi, 10);
          if(b >= a && b - a < 10000){ for(let n = a; n <= b; n++) add(prefix + String(n).padStart(width, "0")); return; }
        }
      }
    }
    add(tok);
  });
  return out;
}

/* ---- event-type schema ---- */
const F = { // key -> [storedName, label, kind]
  bath:["bath","Bath","baths"], jc:["jc","J/C No.","text"], component:["component","Component","text"],
  serial:["serial","Serial","text"],
  hclPct:["hclPct","Free HCl %","num"], fePpm:["fePpm","Iron Fe (ppm)","num"], temp:["temp","Temp °C","num"],
  hcl:["hclAddedL","HCl added (L)","num"], water:["waterAddedL","Water added (L)","num"], h3po4:["h3po4AddedL","H₃PO₄ added (L)","num"],
  wax:["waxFailure","Wax failure","sel:None,Partial mask loss,Complete mask loss"],
  disp:["status","Disposition","sel:Accepted,Engineering review,Scrap,Return to vendor,Hold"],
  reason:["disposalReason","Disposal reason","sel:Iron limit reached,HCl exhausted,Contamination,Scheduled change,Other"],
  op:["operator","Operator","operator"], notes:["notes","Notes","text"]
};
const TYPES = {
  "Load In":          { desc:"parts INTO a bath (time in)",  custom:"load",    fields:[F.bath,F.jc,F.component,F.op,F.notes] },
  "Extraction":       { desc:"parts OUT of a bath (time out)",custom:"extract", fields:[F.bath,F.op,F.notes] },
  "Transfer":         { desc:"move parts to another bath",   custom:"move",    fields:[F.bath,F.op,F.notes] },
  "Parts Received":   { desc:"add serials to the waiting area (not in a bath)", custom:"received", hidden:true, fields:[F.jc,F.component,F.op,F.notes] },
  "Chemistry Check":  { desc:"titration result",   fields:[F.bath,F.temp,F.hclPct,F.fePpm,F.op,F.notes] },
  "Top-Up":           { desc:"partial top-up — add acid and/or water", fields:[F.bath,F.hcl,F.water,F.op,F.notes] },
  "Bath Fill":        { desc:"complete fill — new charge",   fields:[F.bath,F.hcl,F.water,F.h3po4,F.op,F.notes] },
  "HCl Top-Up":       { desc:"add acid",            hidden:true, fields:[F.bath,F.hcl,F.op,F.notes] },
  "Water Top-Up":     { desc:"add water",           hidden:true, fields:[F.bath,F.water,F.op,F.notes] },
  "Wax Failure":      { desc:"masking defect (per area)", custom:"waxfail", hidden:true, fields:[F.bath,F.jc,F.serial,F.op,F.notes] },
  "Re-Masking":       { desc:"re-wax failed areas",  custom:"remask",  hidden:true, fields:[F.jc,F.serial,F.op,F.notes] },
  "Engineering Review":{ desc:"disposition a part", fields:[F.jc,F.serial,F.disp,F.op,F.notes] },
  "Bath Disposal":    { desc:"bath taken out",      fields:[F.bath,F.reason,F.op,F.notes] }
};
// Friendly UI labels for the operator-facing actions. The stored event `type`
// stays "Load In" / "Extraction" (the formal ledger); only the display changes.
const TYPE_LABEL = { "Load In":"Add parts", "Extraction":"Remove parts", "Parts Received":"Waiting area" };
const typeLabel = t => TYPE_LABEL[t] || t;
// Sentinel chosen in the Add-parts bath drop-down to park serials in the waiting
// area instead of a bath. Never stored: a save with it becomes a Parts Received.
const WAITING_AREA = "__waiting__";
const TYPE_PILL = {
  "Load In":"p-blue","Extraction":"p-grey","Immersion":"p-grey","Chemistry Check":"p-grey",
  "Bath Fill":"p-green","Bath Disposal":"p-red","Wax Failure":"p-red","Re-Masking":"p-amber",
  "Engineering Review":"p-amber","HCl Top-Up":"p-grey","Water Top-Up":"p-grey",
  "Top-Up":"p-grey","Transfer":"p-blue","Parts Received":"p-purple"
};

// Events that mention a serial (it now lives inside arrays on load/extract events).
function eventsForSerial(events, serial){
  return events.filter(e =>
    e.serial === serial ||
    ((e.type === "Load In" || e.type === "Transfer" || e.type === "Parts Received") && (e.serials || []).includes(serial)) ||
    (e.type === "Extraction" && (e.items || []).some(i => i.serial === serial))
  ).slice().sort(byDate);
}

/* ---- the backbone: pair Load In + Extraction (and legacy Immersion) into
        per-part "dip" records, and report what is still in each bath ---- */
function deriveImmersions(events, nowDT){
  const seq = events.slice().sort(byDate);
  const records = [];
  const open = new Map();   // serial -> currently-open record
  const cyc = new Map();    // serial -> loads so far
  const bump = s => { const n = (cyc.get(s) || 0) + 1; cyc.set(s, n); return n; };
  for(const e of seq){
    if(e.type === "Load In"){
      (e.serials || []).forEach(s => {
        const rec = { serial:s, bath:e.bath || "", jc:e.jc || "", component:e.component || "",
          cycle:bump(s), inDT:e.datetime, outDT:null, result:null, waxFailure:null,
          hours:null, elapsedH:null, open:true, anomaly:null, loadEvent:e, extractEvent:null };
        if(open.has(s)){ const old = open.get(s); old.open = false; old.anomaly = (old.anomaly ? old.anomaly + "; " : "") + "no extraction logged"; rec.anomaly = "was already in " + old.bath; }
        open.set(s, rec); records.push(rec);
      });
    } else if(e.type === "Extraction"){
      (e.items || []).forEach(it => {
        const s = it.serial, r = open.get(s);
        if(r){ r.outDT = e.datetime; r.result = it.result || ""; r.waxFailure = it.waxFailure || "None"; r.wax = it.wax || null; r.open = false; r.hours = round(hoursBetweenDT(r.inDT, e.datetime), 2); r.extractEvent = e; open.delete(s); }
        else records.push({ serial:s, bath:e.bath || "", jc:"", component:"", cycle:(cyc.get(s) || 0),
          inDT:null, outDT:e.datetime, result:it.result || "", waxFailure:it.waxFailure || "None", wax:it.wax || null,
          hours:null, elapsedH:null, open:false, anomaly:"extracted but was not in bath", loadEvent:null, extractEvent:e });
      });
    } else if(e.type === "Transfer"){
      // Moving parts to another bath: close the open record in the source bath
      // (not a strip outcome) and open a continuation of the SAME cycle in the
      // destination, flagged `moved` so it is never counted as a new dip.
      const toBath = e.toBath || "";
      (e.serials || []).forEach(s => {
        const r = open.get(s);
        if(r){ r.outDT = e.datetime; r.result = "Moved"; r.open = false; r.hours = round(hoursBetweenDT(r.inDT, e.datetime), 2); r.extractEvent = e; }
        const cont = { serial:s, bath:toBath, jc:(r && r.jc) || e.jc || "", component:(r && r.component) || e.component || "",
          cycle:r ? r.cycle : (cyc.get(s) || 0), inDT:e.datetime, outDT:null, result:null, waxFailure:null,
          hours:null, elapsedH:null, open:true, anomaly:r ? null : "moved but was not in a bath", loadEvent:e, extractEvent:null, moved:true };
        open.set(s, cont); records.push(cont);
      });
    } else if(e.type === "Immersion"){ // legacy self-contained dip
      if(!e.serial) continue;
      records.push({ serial:e.serial, bath:e.bath || "", jc:e.jc || "", component:e.component || "",
        cycle:bump(e.serial), inDT:e.datetime, outDT:e.datetime, result:e.result || "", waxFailure:e.waxFailure || "None",
        hours:hrsBetween(e.timeIn, e.timeOut), elapsedH:null, open:false, anomaly:null, loadEvent:e, extractEvent:e });
    }
  }
  open.forEach(r => { r.elapsedH = round(hoursBetweenDT(r.inDT, nowDT), 2); });
  return { records, open };
}
function bathContents(events, nowDT, bath){
  const { open } = deriveImmersions(events, nowDT);
  return [...open.values()].filter(r => !bath || r.bath === bath).sort((a, b) => String(a.inDT).localeCompare(String(b.inDT)));
}

// A wax failure is recorded by which masked AREA failed (e.g. cooling holes vs
// the part body) — just the area name. Reads the simple {wax:[name]} shape, the
// older {wax:[{area}]} shape, and the legacy {waxFailure} field for back-compat.
function waxAreasOf(obj){
  if(obj && Array.isArray(obj.wax)) return obj.wax.map(x => typeof x === "string" ? x : (x && x.area)).filter(Boolean);
  if(obj && obj.waxFailure && obj.waxFailure !== "None") return [obj.waxArea || "Mask"];
  return [];
}
function remaskAreasOf(e){ return (Array.isArray(e.areas) && e.areas.length) ? e.areas : null; } // null = covers all areas
// Re-masking is recorded as part of the re-dip (on the Load In event), or, for
// legacy data, as a standalone Re-Masking event. Both count as resolving wax.
function remaskActions(events, serial){
  const out = [];
  events.forEach(e => {
    if(e.type === "Re-Masking" && e.serial === serial) out.push({ datetime:e.datetime, areas:remaskAreasOf(e) });
    else if(e.type === "Load In" && Array.isArray(e.remask)){ const r = e.remask.find(x => x.serial === serial); if(r) out.push({ datetime:e.datetime, areas:(Array.isArray(r.areas) && r.areas.length) ? r.areas : null }); }
  });
  return out;
}
function waxSummary(obj){ return waxAreasOf(obj).join(", "); }

// Every wax-failed area observed for a serial (discovered at extraction).
function waxFailures(events, serial){
  const out = [];
  const add = (datetime, areas, event) => areas.forEach(area => out.push({ datetime, area, event }));
  events.forEach(e => {
    if(e.type === "Extraction") (e.items || []).forEach(it => { if(it.serial === serial) add(e.datetime, waxAreasOf(it), e); });
    else if((e.type === "Wax Failure" || e.type === "Immersion") && e.serial === serial) add(e.datetime, waxAreasOf(e), e);
  });
  return out.sort((a, b) => String(a.datetime).localeCompare(String(b.datetime)));
}
// Areas whose most-recent failure has not been resolved by a later re-masking
// that covers that area. The part can't be re-stripped while any remain.
function unresolvedWaxAreas(events, serial){
  const fails = waxFailures(events, serial);
  if(!fails.length) return [];
  const latest = new Map();
  fails.forEach(f => { const c = latest.get(f.area); if(!c || f.datetime > c.datetime) latest.set(f.area, f); });
  const remasks = remaskActions(events, serial);
  const out = [];
  latest.forEach((f, area) => { if(!remasks.some(r => r.datetime >= f.datetime && (r.areas == null || r.areas.includes(area)))) out.push(f); });
  return out.sort((a, b) => String(a.datetime).localeCompare(String(b.datetime)));
}
// Back-compat single-value accessor: the most recent unresolved area failure.
function lastUnresolvedWax(events, serial){ const u = unresolvedWaxAreas(events, serial); return u.length ? u[u.length - 1] : null; }

function pieceStatusFor(recs, engEvents, config, needsRemask){
  const open = recs.some(r => r.open);
  const cleared = recs.some(r => r.result === "Cleared");
  const cycles = recs.filter(r => !r.moved).length;   // a bath-to-bath move is not a new dip
  const closedH = round(recs.filter(r => !r.open).reduce((a, r) => a + (r.hours || 0), 0));
  const totalH = round(closedH + recs.filter(r => r.open).reduce((a, r) => a + (r.elapsedH || 0), 0));
  const engDisp = engEvents.length ? engEvents[engEvents.length - 1].status : "";
  const base = { cycles, hours:closedH, totalH, open };
  if(cleared)                        return { s:"Cleared",          cls:"p-green", ...base };
  if(engDisp === "Accepted")         return { s:"Accepted",         cls:"p-green", ...base };
  if(engDisp === "Scrap")            return { s:"Scrap",            cls:"p-red",   ...base };
  if(engDisp === "Return to vendor") return { s:"Returned",         cls:"p-grey",  ...base };
  if(engEvents.length)               return { s:"→ Engineering",    cls:"p-red",   ...base };
  if(open)                           return { s:"In bath",          cls:"p-blue",  ...base };
  if(cycles >= config.maxCycles || totalH >= config.maxHours){
    const why = [];
    if(cycles >= config.maxCycles) why.push(cycles + " cycles ≥ " + config.maxCycles);
    if(totalH >= config.maxHours) why.push(totalH + " h ≥ " + config.maxHours);
    return { s:"→ Engineering", cls:"p-red", reason:why.join(", "), ...base };
  }
  if(needsRemask)                    return { s:"Needs re-mask",    cls:"p-purple", ...base };
  if(cycles > 0)                     return { s:"Awaiting re-strip", cls:"p-amber", ...base };
  return { s:"—", cls:"p-grey", ...base };
}

function derivePieces(events, config, nowDT){
  const { records } = deriveImmersions(events, nowDT);
  const map = new Map();
  records.forEach(r => { const o = map.get(r.serial) || { serial:r.serial, jc:"", component:"", recs:[] }; o.recs.push(r); if(r.jc) o.jc = r.jc; if(r.component) o.component = r.component; map.set(r.serial, o); });
  events.forEach(e => { if(e.serial && !map.has(e.serial)) map.set(e.serial, { serial:e.serial, jc:e.jc || "", component:e.component || "", recs:[] }); });
  const rows = [];
  map.forEach(o => {
    const recs = o.recs.slice().sort((a, b) => String(a.inDT || a.outDT).localeCompare(String(b.inDT || b.outDT)));
    const evs = eventsForSerial(events, o.serial);
    const eng = evs.filter(e => e.type === "Engineering Review");
    const unresolvedWax = unresolvedWaxAreas(events, o.serial);
    const st = pieceStatusFor(recs, eng, config, unresolvedWax.length > 0);
    const openRec = recs.find(r => r.open);
    rows.push({
      serial:o.serial, jc:o.jc || (evs[0] && evs[0].jc) || "", component:o.component || (evs[0] && evs[0].component) || "",
      cycles:recs.filter(r => !r.moved).length, hours:st.hours,
      wax: recs.reduce((a, r) => a + waxAreasOf(r).length, 0) + evs.filter(e => e.type === "Wax Failure").reduce((a, e) => a + waxAreasOf(e).length, 0),
      reStrips: recs.filter(r => r.result === "Re-strip").length,
      inBath: !!openRec, currentBath: openRec ? openRec.bath : "",
      lastBath: recs.length ? recs[recs.length - 1].bath : "",
      firstPass: recs.some(r => r.result === "Cleared") && !recs.some(r => r.result === "Re-strip"),
      needsRemask: unresolvedWax.length > 0,
      waxFail: unresolvedWax.length ? { areas:unresolvedWax.map(u => u.area), detail:unresolvedWax.map(u => u.area).join(", "), event:unresolvedWax[unresolvedWax.length - 1].event } : null,
      status:st, recs, events:evs
    });
  });
  rows.sort((a, b) => String(a.jc).localeCompare(String(b.jc)) || String(a.serial).localeCompare(String(b.serial)));
  return rows;
}

function deriveBath(events, config, bath, nowDT){
  const evs = events.filter(e => e.bath === bath).slice().sort(byDate);
  const fills = evs.filter(e => e.type === "Bath Fill");
  const lastFill = fills.length ? fills[fills.length - 1] : null;
  const start = lastFill ? lastFill.datetime : null;
  const inCharge = dt => !start || dt >= start;
  const disposal = evs.filter(e => e.type === "Bath Disposal" && inCharge(e.datetime)).slice(-1)[0] || null;
  const end = disposal ? disposal.datetime : nowDT;
  const within = e => inCharge(e.datetime) && e.datetime <= end;
  const chem = evs.filter(e => e.type === "Chemistry Check" && within(e));
  const lastChem = chem.length ? chem[chem.length - 1] : null;

  const { records, open } = deriveImmersions(events, nowDT);
  const recTime = r => r.inDT || r.outDT;
  const recs = records.filter(r => r.bath === bath && recTime(r) && inCharge(recTime(r)) && recTime(r) <= end);
  const contents = [...open.values()].filter(r => r.bath === bath).sort((a, b) => String(a.inDT).localeCompare(String(b.inDT)));
  const loadH = round(recs.reduce((a, r) => a + (r.open ? (r.elapsedH || 0) : (r.hours || 0)), 0));
  const parts = new Set(recs.map(r => r.serial)).size;
  const wax = recs.reduce((a, r) => a + waxAreasOf(r).length, 0) + evs.filter(e => within(e) && e.type === "Wax Failure").reduce((a, e) => a + waxAreasOf(e).length, 0);
  const hclAdded = evs.filter(within).reduce((a, e) => a + (+e.hclAddedL || 0), 0);
  const waterAdded = evs.filter(within).reduce((a, e) => a + (+e.waterAddedL || 0), 0);
  const age = lastFill ? daysBetween(lastFill.datetime, end) : "";
  const active = !!lastFill && !disposal;

  const flags = [];
  if(lastChem){
    if(num(lastChem.fePpm) != null && +lastChem.fePpm > config.feMax) flags.push("Iron " + lastChem.fePpm + " ppm > " + config.feMax);
    if(num(lastChem.hclPct) != null && (+lastChem.hclPct < config.hclMin || +lastChem.hclPct > config.hclMax)) flags.push("HCl " + lastChem.hclPct + "% out of band");
    if(num(lastChem.temp) != null && Math.abs(+lastChem.temp - config.tempSet) > config.tempTol) flags.push("Temp " + lastChem.temp + "°C out of band");
  }
  if(active && age !== "" && age >= config.maxBathAge) flags.push("Age " + age + " d ≥ " + config.maxBathAge);
  const capacity = config.bathCapacity || 0;
  const free = capacity ? Math.max(0, capacity - contents.length) : null;
  if(active && capacity && contents.length > capacity) flags.push("Over capacity " + contents.length + "/" + capacity);
  if(disposal && contents.length) flags.push(contents.length + " part(s) still recorded as inside a disposed bath");

  return { bath, lastFill, disposal, active, chem, lastChem, loadH, parts, wax, hclAdded, waterAdded, age, flags, contents, capacity, free };
}
// The baths to show/offer: the ones configured in Settings, plus any bath that
// actually appears in the event log — so nothing defaults in, yet no bath with
// real data is ever hidden. (config.baths is empty until you set it or load data.)
function bathList(events, config){
  const out = (config.baths || []).slice(), seen = new Set(out);
  events.forEach(e => [e.bath, e.toBath].forEach(b => { if(b && b !== WAITING_AREA && !seen.has(b)){ seen.add(b); out.push(b); } }));
  return out;
}
function deriveBaths(events, config, nowDT){ return bathList(events, config).map(b => deriveBath(events, config, b, nowDT)); }

function deriveJobCards(events, config, nowDT){
  const map = new Map();
  derivePieces(events, config, nowDT).forEach(r => {
    const k = r.jc || "(none)";
    const o = map.get(k) || { jc:r.jc || "(none)", component:r.component, pieces:0, cleared:0, fp:0, eng:0, inBath:0, reStrips:0, wax:0 };
    o.pieces++; if(r.status.s === "Cleared") o.cleared++; if(r.firstPass) o.fp++;
    if(r.status.s === "→ Engineering") o.eng++; if(r.inBath) o.inBath++;
    o.reStrips += r.reStrips; o.wax += r.wax;
    if(!o.component && r.component) o.component = r.component;
    map.set(k, o);
  });
  return [...map.values()].map(o => ({ ...o, fpy: o.pieces ? Math.round(o.fp / o.pieces * 100) : 0 }))
    .sort((a, b) => String(a.jc).localeCompare(String(b.jc)));
}

function deriveKpis(events, config, nowDT){
  const pr = derivePieces(events, config, nowDT);
  const { records, open } = deriveImmersions(events, nowDT);
  const realDips = records.filter(r => !r.moved).length;   // exclude bath-to-bath move continuations
  const reStrip = records.filter(r => r.result === "Re-strip").length;
  const baths = deriveBaths(events, config, nowDT);
  const clearedPieces = pr.filter(r => r.status.s === "Cleared");
  return {
    total: pr.length, cleared: clearedPieces.length,
    fp: pr.filter(r => r.firstPass).length,
    eng: pr.filter(r => r.status.s === "→ Engineering").length,
    awaiting: pr.filter(r => r.status.s === "Awaiting re-strip").length,
    inBath: open.size,
    fpy: pr.length ? Math.round(pr.filter(r => r.firstPass).length / pr.length * 100) : 0,
    dips: realDips, reStrip, reStripRate: realDips ? Math.round(reStrip / realDips * 100) : 0,
    wax: records.filter(r => r.waxFailure && r.waxFailure !== "None").length + events.filter(e => e.type === "Wax Failure").length,
    bathsOver: baths.filter(b => b.active && b.flags.length).length,
    activeBaths: baths.filter(b => b.active).length,
    avgCycles: clearedPieces.length ? round(clearedPieces.reduce((a, r) => a + r.cycles, 0) / clearedPieces.length, 2) : 0
  };
}

function deriveDefects(events){
  const out = [];
  events.forEach(e => {
    if(e.type === "Engineering Review") out.push({ e, kind:"Eng review", detail:e.status || "", serial:e.serial || "", bath:e.bath || "" });
    else if(e.type === "Re-Masking"){ const ar = remaskAreasOf(e); out.push({ e, kind:"Re-mask", detail:"resolves " + (ar ? ar.join(", ") : (e.waxFailure || "wax failure")) + (e.notes ? " · " + e.notes : ""), serial:e.serial || "", bath:e.bath || "" }); }
    else if(e.type === "Wax Failure") out.push({ e, kind:"Wax failure", detail:waxSummary(e), serial:e.serial || "", bath:e.bath || "" });
    else if(e.type === "Extraction") (e.items || []).forEach(it => {
      if(waxAreasOf(it).length) out.push({ e, kind:"Wax failure", detail:waxSummary(it), serial:it.serial, bath:e.bath || "" });
      if(it.result === "Re-strip") out.push({ e, kind:"Re-strip", detail:"", serial:it.serial, bath:e.bath || "" });
    });
    else if(e.type === "Immersion"){
      if(waxAreasOf(e).length) out.push({ e, kind:"Wax failure", detail:waxSummary(e), serial:e.serial || "", bath:e.bath || "" });
      if(e.result === "Re-strip") out.push({ e, kind:"Re-strip", detail:"", serial:e.serial || "", bath:e.bath || "" });
    }
  });
  return out.sort((a, b) => byDate(a.e, b.e)).reverse();
}

// Relationship-aware checks: does this draft contradict the current state of
// its bath or its pieces? Soft (non-blocking) — guidance, not gates.
function eventWarnings(d, events, config, nowDT){
  const w = [], add = (level, msg) => w.push({ level, msg });
  const others = events.filter(e => e.id == null || e.id !== d.id);
  let _pi = null;
  const pieceOf = s => { if(!_pi) _pi = new Map(derivePieces(others, config, nowDT).map(p => [p.serial, p])); return _pi.get(s); };
  const lastSerialDT = s => { const evs = eventsForSerial(others, s); return evs.length ? evs[evs.length - 1].datetime : null; };

  if(d.type === "Chemistry Check"){
    const fe = num(d.fePpm); if(fe != null && fe > config.feMax) add("red", `Iron ${fe} ppm exceeds limit ${config.feMax} — bath may be spent`);
    const hp = num(d.hclPct); if(hp != null && (hp < config.hclMin || hp > config.hclMax)) add("amber", `Free HCl ${hp}% outside band ${config.hclMin}–${config.hclMax}%`);
    const t = num(d.temp); if(t != null && Math.abs(t - config.tempSet) > config.tempTol) add("amber", `Temp ${t}°C outside ${config.tempSet}±${config.tempTol}°C`);
    if(d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.disposal) add("amber", `Bath ${d.bath} was disposed ${fmtDate(bs.disposal.datetime)} — this check is on an inactive bath`); else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`); }
  }
  if(d.type === "Load In"){
    if(d.bath){
      const bs = deriveBath(others, config, d.bath, nowDT);
      if(bs.disposal) add("red", `Bath ${d.bath} was disposed ${fmtDate(bs.disposal.datetime)} — fill it before loading`);
      else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`);
      else if(bs.flags.length) add("amber", `Bath ${d.bath}: ${bs.flags.join("; ")}`);
      if(bs.capacity){
        const adding = (d.serials || []).filter(s => !bs.contents.some(r => r.serial === s)).length;
        if(bs.contents.length + adding > bs.capacity) add("red", `Bath ${d.bath} would hold ${bs.contents.length + adding} parts (capacity ${bs.capacity})`);
      }
    }
    (d.serials || []).forEach(s => {
      const p = pieceOf(s);
      if(p){
        if(p.inBath) add("amber", `${s} is already in bath ${p.currentBath}`);
        else if(p.status.s === "Cleared" || p.status.s === "Accepted") add("amber", `${s} is already ${p.status.s} — re-loading starts a new cycle`);
        else if(p.status.s === "Scrap" || p.status.s === "Returned") add("red", `${s} was dispositioned ${p.status.s} — it should not be re-stripped`);
        else if(p.status.s === "→ Engineering") add("red", `${s} is awaiting engineering review — disposition it before re-stripping`);
        if((p.cycles + 1) > config.maxCycles) add("red", `${s} would be cycle ${p.cycles + 1} (> max ${config.maxCycles}) — route to engineering`);
      }
      const uw = unresolvedWaxAreas(others, s);
      if(uw.length){
        const rm = (d.remask || []).find(x => x.serial === s);
        const covered = rm ? (Array.isArray(rm.areas) && rm.areas.length ? rm.areas : null) : [];
        const remaining = covered == null ? [] : uw.filter(a => !covered.includes(a.area));
        if(remaining.length) add("red", `${s} has a wax failure (${remaining.map(x => x.area).join(", ")}) — re-mask it before re-loading`);
      }
      const last = lastSerialDT(s); if(last && d.datetime && d.datetime < last) add("amber", `${s}: this load is dated before its last recorded event (${fmtDT(last)})`);
    });
  }
  if(d.type === "Extraction" && d.bath){
    const bs = deriveBath(others, config, d.bath, nowDT);
    if(bs.disposal) add("red", `Bath ${d.bath} is disposed`);
    const idx = new Map(bathContents(others, nowDT, d.bath).map(r => [r.serial, r]));
    (d.items || []).forEach(it => {
      const r = idx.get(it.serial);
      if(!r) add("amber", `${it.serial} is not currently in bath ${d.bath}`);
      else if(r.inDT && d.datetime && d.datetime < r.inDT) add("red", `${it.serial}: time out is before it went in (${fmtDT(r.inDT)})`);
    });
  }
  if(d.type === "Bath Disposal" && d.bath){
    const bs = deriveBath(others, config, d.bath, nowDT);
    if(!bs.lastFill) add("amber", `Bath ${d.bath} has no charge to dispose`);
    else if(!bs.active) add("amber", `Bath ${d.bath} is already disposed (${fmtDate(bs.disposal.datetime)})`);
    if(bs.contents.length) add("red", `Bath ${d.bath} still holds ${bs.contents.length} part(s): ${bs.contents.map(r => r.serial).join(", ")} — extract them first`);
  }
  if(d.type === "Bath Fill" && d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.active) add("amber", `Bath ${d.bath} is already active (filled ${fmtDate(bs.lastFill.datetime)}); dispose before re-filling`); }
  if((d.type === "HCl Top-Up" || d.type === "Water Top-Up" || d.type === "Top-Up") && d.bath){ const bs = deriveBath(others, config, d.bath, nowDT); if(bs.disposal) add("red", `Bath ${d.bath} is disposed`); else if(!bs.lastFill) add("amber", `Bath ${d.bath} has no fill logged`); }
  if(d.type === "Transfer"){
    if(d.bath && d.toBath && d.bath === d.toBath) add("red", "Source and destination are the same bath");
    if(d.toBath){
      const bd = deriveBath(others, config, d.toBath, nowDT);
      if(bd.disposal) add("red", `Bath ${d.toBath} was disposed ${fmtDate(bd.disposal.datetime)} — fill it before moving parts in`);
      else if(!bd.lastFill) add("amber", `Bath ${d.toBath} has no fill logged`);
      else if(bd.flags.length) add("amber", `Bath ${d.toBath}: ${bd.flags.join("; ")}`);
      if(bd.capacity){
        const adding = (d.serials || []).filter(s => !bd.contents.some(r => r.serial === s)).length;
        if(bd.contents.length + adding > bd.capacity) add("red", `Bath ${d.toBath} would hold ${bd.contents.length + adding} parts (capacity ${bd.capacity})`);
      }
    }
    if(d.bath){
      const idx = new Map(bathContents(others, nowDT, d.bath).map(r => [r.serial, r]));
      (d.serials || []).forEach(s => { if(!idx.has(s)) add("amber", `${s} is not currently in bath ${d.bath}`); });
    }
  }
  if(d.type === "Parts Received"){
    (d.serials || []).forEach(s => { const p = pieceOf(s); if(p && p.inBath) add("amber", `${s} is currently in bath ${p.currentBath} — it can't also be waiting`); });
  }
  if(d.type === "Re-Masking" && d.serial){
    const p = pieceOf(d.serial);
    if(p && p.inBath) add("red", `${d.serial} is currently in bath ${p.currentBath} — extract it before re-masking`);
    else if(!lastUnresolvedWax(others, d.serial)) add("amber", `No unresolved wax failure for ${d.serial} — re-masking may be unnecessary`);
  }
  if(d.type === "Engineering Review" && d.serial){
    const p = pieceOf(d.serial);
    if(p){
      if(p.status.s === "Cleared") add("amber", `${d.serial} has already cleared — engineering review may be unnecessary`);
      else if(p.inBath) add("amber", `${d.serial} is still in bath ${p.currentBath}`);
      const eng = p.events.filter(e => e.type === "Engineering Review");
      if(eng.length && d.id == null) add("amber", `${d.serial} already has a disposition (${eng[eng.length - 1].status})`);
    }
  }
  return w;
}

// Autofill: a serial's last-known job card / component from history.
function lookupSerial(events, serial){
  let jc = "", component = "";
  events.forEach(e => { if(e.serial === serial || (e.serials || []).includes(serial)){ if(e.jc) jc = e.jc; if(e.component) component = e.component; } });
  return { jc, component };
}
// Active, in-band baths ranked by lowest iron — candidates to receive a re-strip.
function healthyBaths(events, config, nowDT){
  return deriveBaths(events, config, nowDT).filter(b => b.active && !b.flags.length)
    .sort((a, b) => (+((a.lastChem || {}).fePpm) || 0) - (+((b.lastChem || {}).fePpm) || 0));
}
function suggestRescueBath(events, config, nowDT, exclude){
  const h = healthyBaths(events, config, nowDT).filter(b => b.bath !== exclude && (b.free === null || b.free > 0));
  return h.length ? h[0].bath : "";
}

// The smart layer: given the current state, what should happen next? Each
// suggestion carries an `action` that prefills the log drawer.
function deriveSuggestions(events, config, nowDT){
  const out = [];
  const pieces = derivePieces(events, config, nowDT);
  const baths = deriveBaths(events, config, nowDT);
  const rescue = exclude => suggestRescueBath(events, config, nowDT, exclude);

  baths.forEach(b => {
    if(!b.active){ if(b.contents.length) out.push({ level:"red", icon:"⚠", title:`Bath ${b.bath}: ${b.contents.length} part(s) recorded inside a disposed bath`, detail:b.contents.map(r => r.serial).join(", "), action:{ type:"extract", bath:b.bath, preselect:b.contents.map(r => r.serial) } }); return; }
    const overH = b.contents.filter(r => r.elapsedH >= config.maxHours);
    if(overH.length) out.push({ level:"red", icon:"⏱", title:`Bath ${b.bath}: ${overH.length} part(s) over ${config.maxHours} h immersion`, detail:overH.map(r => r.serial).join(", "), action:{ type:"extract", bath:b.bath, preselect:overH.map(r => r.serial) } });
    const lc = b.lastChem;
    if(lc && num(lc.fePpm) != null && +lc.fePpm > config.feMax) out.push({ level:"red", icon:"⚗", title:`Bath ${b.bath}: iron ${lc.fePpm} ppm over limit`, detail:"Spent — dispose and refill.", action:{ type:"dispose", bath:b.bath } });
    else if(lc && num(lc.hclPct) != null && +lc.hclPct < config.hclMin) out.push({ level:"amber", icon:"⚗", title:`Bath ${b.bath}: free HCl ${lc.hclPct}% below ${config.hclMin}%`, detail:"Top up acid.", action:{ type:"topup-hcl", bath:b.bath } });
    if(b.age !== "" && b.age >= config.maxBathAge) out.push({ level:"amber", icon:"⌛", title:`Bath ${b.bath}: ${b.age} days old (≥ ${config.maxBathAge})`, detail:"Scheduled change due.", action:{ type:"dispose", bath:b.bath } });
    const lastChemDT = b.chem.length ? b.chem[b.chem.length - 1].datetime : b.lastFill.datetime;
    const dd = daysBetween(lastChemDT, nowDT);
    if(dd !== "" && dd >= 2) out.push({ level:"info", icon:"⚗", title:`Bath ${b.bath}: no chemistry check in ${dd} days`, detail:"Log a titration.", action:{ type:"chem", bath:b.bath } });
  });

  const groups = new Map();
  pieces.forEach(p => {
    if(p.status.s !== "Awaiting re-strip" && p.status.s !== "Needs re-mask") return;
    const last = p.recs[p.recs.length - 1];
    const rb = rescue(last ? last.bath : "");
    const key = (p.jc || "") + "|" + rb;
    const g = groups.get(key) || { jc:p.jc, component:p.component, bath:rb, serials:[], remask:0 };
    g.serials.push(p.serial); if(p.status.s === "Needs re-mask") g.remask++;
    groups.set(key, g);
  });
  groups.forEach(g => out.push({ level:"amber", icon:"↻", title:`Re-load ${g.serials.length > 1 ? g.serials.length + " parts" : g.serials[0]}${g.jc ? " (" + g.jc + ")" : ""}`, detail:(g.bath ? "→ bath " + g.bath : "no healthy bath available") + (g.remask ? " · re-mask " + g.remask + " first" : ""), action:{ type:"reload", serials:g.serials, bath:g.bath, jc:g.jc, component:g.component } }));
  pieces.filter(p => p.status.s === "→ Engineering").forEach(p => out.push({ level:"red", icon:"⚑", title:`Engineering review: ${p.serial}`, detail:`${p.cycles} cycles${p.hours ? ", " + p.hours + " h" : ""}${p.jc ? " · " + p.jc : ""}`, action:{ type:"engineering", serial:p.serial, jc:p.jc } }));

  const rank = { red:0, amber:1, info:2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level]);
}

// Idle parts: came out of a tank and are not finished — waiting to go back in
// (awaiting another strip, or blocked needing a re-mask). Newest-out first.
function idleParts(events, config, nowDT){
  return derivePieces(events, config, nowDT)
    .filter(p => p.status.s === "Awaiting re-strip" || p.status.s === "Needs re-mask")
    .sort((a, b) => String((b.recs[b.recs.length - 1] || {}).outDT || "").localeCompare(String((a.recs[a.recs.length - 1] || {}).outDT || "")));
}

// Parked parts: serials a tech logged as received in their area (a "Parts
// Received" event) but has not yet loaded into a bath since — staged, awaiting
// a first dip. A part drops off this list once it is loaded. Newest first.
function parkedParts(events, config, nowDT){
  const latest = new Map();
  events.forEach(e => { if(e.type === "Parts Received") (e.serials || []).forEach(s => {
    const c = latest.get(s);
    if(!c || String(e.datetime) > String(c.datetime)) latest.set(s, { datetime:e.datetime, jc:e.jc || "", component:e.component || "", operator:e.operator || "" });
  }); });
  if(!latest.size) return [];
  const out = [];
  latest.forEach((info, s) => {
    const loaded = events.some(e => e.type === "Load In" && (e.serials || []).includes(s) && String(e.datetime) >= String(info.datetime));
    if(loaded) return;
    const look = lookupSerial(events, s);
    out.push({ serial:s, jc:info.jc || look.jc || "", component:info.component || look.component || "", datetime:info.datetime, operator:info.operator || "" });
  });
  return out.sort((a, b) => String(b.datetime).localeCompare(String(a.datetime)));
}

// The waiting area: everything not currently in a bath but still in play —
// parts that went OUT of a bath without re-entry (awaiting re-strip / needs
// re-mask), plus serials parked on receipt. One entry per serial, newest first.
function waitingParts(events, config, nowDT){
  const out = [], seen = new Set();
  idleParts(events, config, nowDT).forEach(p => {
    if(seen.has(p.serial)) return; seen.add(p.serial);
    out.push({ serial:p.serial, jc:p.jc || "", component:p.component || "",
      kind:p.status.s === "Needs re-mask" ? "needs re-mask" : "awaiting re-strip",
      lastBath:p.lastBath || "", datetime:(p.recs[p.recs.length - 1] || {}).outDT || "" });
  });
  parkedParts(events, config, nowDT).forEach(p => {
    if(seen.has(p.serial)) return; seen.add(p.serial);
    out.push({ serial:p.serial, jc:p.jc || "", component:p.component || "", kind:"received", lastBath:"", datetime:p.datetime });
  });
  return out.sort((a, b) => String(b.datetime).localeCompare(String(a.datetime)));
}

/* ----------------------------- storage -------------------------------- */
function openDB(){ return new Promise((res, rej) => {
  const r = indexedDB.open(DB_NAME, DB_VER);
  r.onupgradeneeded = e => { const d = e.target.result;
    if(!d.objectStoreNames.contains("events")) d.createObjectStore("events", { keyPath:"id", autoIncrement:true });
    if(!d.objectStoreNames.contains("config")) d.createObjectStore("config", { keyPath:"k" }); };
  r.onsuccess = e => { db = e.target.result; res(); };
  r.onerror = e => rej(e.target.error);
}); }
function tx(store, mode){ return db.transaction(store, mode).objectStore(store); }
function getAll(store){ return new Promise((res, rej) => { const r = tx(store, "readonly").getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => rej(r.error); }); }
function putRec(store, obj){ return new Promise((res, rej) => { const r = tx(store, "readwrite").put(obj); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
function delRec(store, key){ return new Promise((res, rej) => { const r = tx(store, "readwrite").delete(key); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }
function clearStore(store){ return new Promise((res, rej) => { const r = tx(store, "readwrite").clear(); r.onsuccess = () => res(); r.onerror = () => rej(r.error); }); }

async function loadAll(){
  EVENTS = (await getAll("events")).sort(byDate);
  CONFIG = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
  (await getAll("config")).forEach(o => CONFIG[o.k] = o.v);
}
async function saveConfig(){ for(const k of Object.keys(CONFIG)) await putRec("config", { k, v:CONFIG[k] }); }

function nowLocalDT(){ const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,16); }
function todayISODate(){ return new Date().toISOString().slice(0,10); }

async function addEvent(obj){ obj.datetime = obj.datetime || nowLocalDT(); obj.eventId = nextEventId(obj.datetime, EVENTS); const id = await putRec("events", obj); obj.id = id; await loadAll(); }
async function updateEvent(obj){ await putRec("events", obj); await loadAll(); }
async function removeEvent(id){ await delRec("events", id); await loadAll(); }

/* ---------------------------- DOM helpers ----------------------------- */
const $ = (s, el = document) => el.querySelector(s);
function esc(s){ return (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function cel(tag, attrs = {}, kids = []){
  const e = document.createElement(tag);
  for(const k in attrs){ const v = attrs[k];
    if(k === "class") e.className = v;
    else if(k === "html") e.innerHTML = v;
    else if(k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else if(v != null && v !== false) e.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => { if(c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const pill = (text, cls) => cel("span", { class:"pill " + (cls || "p-grey") }, text);
const tcell = (v, cls) => cel("td", cls ? { class:cls } : {}, v == null ? "" : String(v));
function flash(msg, action){
  const b = cel("div", { style:"position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#16242b;color:#fff;padding:9px 16px;border-radius:8px;z-index:80;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)" }, msg);
  if(action) b.append(cel("button", { style:"background:none;border:none;color:#7fd0ea;font-weight:700;cursor:pointer;font-size:13px", onclick:() => { b.remove(); action.fn(); } }, action.label));
  document.body.append(b); setTimeout(() => b.remove(), action ? 5000 : 1600);
}
/* one-step undo for the last add / edit / delete */
let lastUndo = null;
function setUndo(label, fn){ lastUndo = { label, fn }; }
async function doUndo(){ if(!lastUndo) return; const u = lastUndo; lastUndo = null; try { await u.fn(); flash("Undone — " + u.label); render(); } catch(err){ alert("Could not undo: " + err.message); } }

function modal(title, bodyNode, footerNodes){
  const root = $("#modalRoot"); root.innerHTML = "";
  const overlay = cel("div", { class:"overlay", onclick:e => { if(e.target === overlay) closeModal(); } });
  const box = cel("div", { class:"modal" });
  box.append(
    cel("div", { class:"modal-h" }, [ cel("h3", {}, title), cel("button", { class:"x", title:"Close", onclick:closeModal }, "✕") ]),
    cel("div", { class:"modal-b" }, bodyNode),
    footerNodes ? cel("div", { class:"modal-f" }, footerNodes) : null
  );
  overlay.append(box); root.append(overlay);
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModal(); });

const SVGNS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs){ const e = document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function svgText(x, y, s, anchor){ const t = svgEl("text", { x, y, "font-size":9, fill:"#6b7c84", "text-anchor":anchor || "start" }); t.textContent = s; return t; }
function trendChart(points, opt = {}){
  const w = opt.w || 260, h = opt.h || 92, mini = !!opt.mini;
  const padL = mini ? 4 : 30, padR = mini ? 4 : 8, padT = mini ? 4 : 10, padB = mini ? 4 : 16;
  const fmtY = opt.fmtY || (v => String(round(v, 1)));
  const ys = points.map(p => p.y).filter(Number.isFinite);
  let hi = Math.max(...ys, opt.limit != null ? opt.limit : -Infinity, opt.band ? opt.band.hi : -Infinity);
  let lo = Math.min(...ys, opt.band ? opt.band.lo : Infinity);
  if(!Number.isFinite(hi)) hi = 1; if(!Number.isFinite(lo)) lo = 0;
  lo = Math.min(lo, hi); if(hi === lo) hi = lo + 1;
  const span = hi - lo; hi += span * 0.12; lo -= span * 0.08;
  const X = i => padL + (points.length <= 1 ? (w - padL - padR) / 2 : i * (w - padL - padR) / (points.length - 1));
  const Y = v => padT + (h - padT - padB) * (1 - (v - lo) / (hi - lo));
  const svg = svgEl("svg", { class:"chart", width:"100%", height:h, viewBox:`0 0 ${w} ${h}`, preserveAspectRatio:"none" });
  if(opt.band) svg.appendChild(svgEl("rect", { x:padL, y:Y(opt.band.hi), width:w - padL - padR, height:Math.max(0, Y(opt.band.lo) - Y(opt.band.hi)), fill:"rgba(31,122,61,.10)" }));
  if(opt.limit != null){ const ly = Y(opt.limit); svg.appendChild(svgEl("line", { x1:padL, y1:ly, x2:w - padR, y2:ly, stroke:"#9c2a2a", "stroke-dasharray":"4 3", "stroke-width":1 })); }
  if(!mini){ svg.appendChild(svgText(padL - 4, Y(hi - span * 0.05) + 3, fmtY(hi - span * 0.05), "end")); svg.appendChild(svgText(padL - 4, Y(lo + span * 0.05), fmtY(lo + span * 0.05), "end")); }
  const d = points.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  svg.appendChild(svgEl("path", { d, fill:"none", stroke:opt.color || "#2e6e84", "stroke-width":2, "stroke-linejoin":"round" }));
  if(!mini) points.forEach((p, i) => { const over = opt.limit != null && p.y > opt.limit; svg.appendChild(svgEl("circle", { cx:X(i), cy:Y(p.y), r:2.6, fill:over ? "#9c2a2a" : (opt.color || "#2e6e84") })); });
  return svg;
}

/* presentation helpers (DOM-free, app layer) */
function eventDetail(e){
  const d = [];
  if(e.type === "Chemistry Check") d.push(`HCl ${fmtNum(e.hclPct)}%, Fe ${fmtNum(e.fePpm)} ppm, ${fmtNum(e.temp)}°C`);
  if(e.type === "Load In"){ const s = e.serials || []; d.push(`${s.length} part${s.length !== 1 ? "s" : ""} in${e.bath ? " → " + e.bath : ""}: ${s.slice(0,8).join(", ")}${s.length > 8 ? " +" + (s.length - 8) : ""}`); }
  if(e.type === "Extraction"){ const it = e.items || []; const by = r => it.filter(i => i.result === r).length; const parts = []; ["Cleared","Re-strip","Hold"].forEach(r => { const n = by(r); if(n) parts.push(n + " " + r.toLowerCase()); }); const wax = it.filter(i => waxAreasOf(i).length).length; d.push(`${it.length} out${e.bath ? " ← " + e.bath : ""} · ${parts.join(", ")}${wax ? ` · ${wax} wax` : ""}`); }
  if(e.type === "Immersion") d.push(`${e.timeIn || ""}-${e.timeOut || ""} ${e.result || ""}`);
  if(e.type === "Bath Fill") d.push(`HCl ${e.hclAddedL || 0} L · H₂O ${e.waterAddedL || 0} L · H₃PO₄ ${e.h3po4AddedL || 0} L`);
  if(e.type === "HCl Top-Up") d.push(`+${e.hclAddedL || 0} L HCl`);
  if(e.type === "Water Top-Up") d.push(`+${e.waterAddedL || 0} L water`);
  if(e.type === "Top-Up"){ const p = []; if(+e.hclAddedL) p.push(`+${e.hclAddedL} L HCl`); if(+e.waterAddedL) p.push(`+${e.waterAddedL} L water`); d.push(p.join(" · ") || "top-up"); }
  if(e.type === "Transfer"){ const s = e.serials || []; d.push(`${s.length} part${s.length !== 1 ? "s" : ""} moved${e.bath ? " " + e.bath : ""}${e.toBath ? " → " + e.toBath : ""}: ${s.slice(0,8).join(", ")}${s.length > 8 ? " +" + (s.length - 8) : ""}`); }
  if(e.type === "Parts Received"){ const s = e.serials || []; d.push(`${s.length} part${s.length !== 1 ? "s" : ""} → waiting area: ${s.slice(0,8).join(", ")}${s.length > 8 ? " +" + (s.length - 8) : ""}`); }
  if(e.type === "Wax Failure") d.push(e.waxFailure || "");
  if(e.type === "Engineering Review") d.push(e.status || "");
  if(e.type === "Bath Disposal") d.push(e.disposalReason || "");
  if(e.notes) d.push("“" + e.notes + "”");
  return d.join("  ");
}
function eventDetailForSerial(e, serial){
  if(e.type === "Load In") return "loaded into " + (e.bath || "bath");
  if(e.type === "Transfer") return "moved " + (e.bath || "bath") + " → " + (e.toBath || "bath");
  if(e.type === "Parts Received") return "added to waiting area" + (e.jc ? " · " + e.jc : "");
  if(e.type === "Extraction"){ const it = (e.items || []).find(i => i.serial === serial); return it ? ("pulled from " + (e.bath || "bath") + " — " + (it.result || "") + (waxAreasOf(it).length ? " · ⚠ wax: " + waxSummary(it) : "")) : ("extraction from " + (e.bath || "bath")); }
  if(e.type === "Re-Masking"){ const ar = remaskAreasOf(e); return "re-masked" + (ar ? " — " + ar.join(", ") : (e.waxFailure ? " — resolves " + e.waxFailure : "")) + (e.notes ? " · " + e.notes : ""); }
  return eventDetail(e);
}
